<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" font-family="Segoe UI, Arial, sans-serif">
  <rect width="860" height="500" fill="#f4f7fb"/>
  <text x="430" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a2b40">WLAN Savunma Katmanlari: Maliyet x Etki</text>
  <text x="430" y="50" text-anchor="middle" font-size="11" fill="#6b7a90">Her balon: bir savunma onlemi — hangi saldiriyi kapatiyor?</text>

  <!-- Panel -->
  <rect x="30" y="60" width="800" height="410" fill="#fff" stroke="#9fb3c8" stroke-width="1"/>

  <!-- Eksen cizgileri -->
  <!-- X ekseni: Etki (dusuk -> yuksek) -->
  <line x1="80" y1="440" x2="800" y2="440" stroke="#d3dde8" stroke-width="1.5"/>
  <!-- Y ekseni: Maliyet (yuksek -> dusuk) -->
  <line x1="80" y1="80" x2="80" y2="440" stroke="#d3dde8" stroke-width="1.5"/>

  <!-- Eksen etiketleri -->
  <text x="440" y="468" text-anchor="middle" font-size="12" fill="#6b7a90" font-weight="bold">ETKI (duşük &#x2192; yuksek)</text>
  <text x="22" y="260" text-anchor="middle" font-size="11" fill="#6b7a90" font-weight="bold" transform="rotate(-90,22,260)">MALIYET (dusuk &#x2191; yuksek)</text>

  <!-- Izgara yatay -->
  <line x1="80" y1="160" x2="800" y2="160" stroke="#e8edf4" stroke-width="1"/>
  <line x1="80" y1="240" x2="800" y2="240" stroke="#e8edf4" stroke-width="1"/>
  <line x1="80" y1="320" x2="800" y2="320" stroke="#e8edf4" stroke-width="1"/>
  <line x1="80" y1="400" x2="800" y2="400" stroke="#e8edf4" stroke-width="1"/>
  <!-- Izgara dikey -->
  <line x1="200" y1="80" x2="200" y2="440" stroke="#e8edf4" stroke-width="1"/>
  <line x1="320" y1="80" x2="320" y2="440" stroke="#e8edf4" stroke-width="1"/>
  <line x1="440" y1="80" x2="440" y2="440" stroke="#e8edf4" stroke-width="1"/>
  <line x1="560" y1="80" x2="560" y2="440" stroke="#e8edf4" stroke-width="1"/>
  <line x1="680" y1="80" x2="680" y2="440" stroke="#e8edf4" stroke-width="1"/>

  <!-- Balonlar: cx=etki, cy=maliyet (y kuculdukce maliyet artar) -->
  <!-- r: gorselbuyukluk -->

  <!-- 1: Guclu parola - Etki cok yuksek, maliyet sifir -->
  <!-- cx~720, cy~415 (cok dusuk maliyet), r=30 -->
  <circle cx="730" cy="415" r="30" fill="#1a8a3a" opacity="0.20"/>
  <circle cx="730" cy="415" r="30" fill="none" stroke="#1a8a3a" stroke-width="2"/>
  <text x="730" y="411" text-anchor="middle" font-size="9" fill="#1a8a3a" font-weight="bold">Guclu</text>
  <text x="730" y="423" text-anchor="middle" font-size="9" fill="#1a8a3a" font-weight="bold">Parola</text>
  <!-- Hangi saldiriyi kapatir -->
  <text x="730" y="390" text-anchor="middle" font-size="8.5" fill="#6b7a90">Hashcat/offline</text>

  <!-- 2: WPA3 - Etki cok yuksek, maliyet dusuk-orta -->
  <circle cx="760" cy="370" r="28" fill="#1565c0" opacity="0.18"/>
  <circle cx="760" cy="370" r="28" fill="none" stroke="#1565c0" stroke-width="2"/>
  <text x="760" y="367" text-anchor="middle" font-size="9" fill="#1565c0" font-weight="bold">WPA3</text>
  <text x="760" y="378" text-anchor="middle" font-size="9" fill="#1565c0" font-weight="bold">-SAE</text>
  <text x="760" y="346" text-anchor="middle" font-size="8.5" fill="#6b7a90">Yakala-kir zinciri</text>

  <!-- 3: PMF - Etki yuksek, maliyet dusuk -->
  <circle cx="670" cy="410" r="26" fill="#ff8f00" opacity="0.20"/>
  <circle cx="670" cy="410" r="26" fill="none" stroke="#ff8f00" stroke-width="2"/>
  <text x="670" y="408" text-anchor="middle" font-size="9" fill="#ff8f00" font-weight="bold">PMF</text>
  <text x="670" y="419" text-anchor="middle" font-size="9" fill="#ff8f00" font-weight="bold">802.11w</text>
  <text x="670" y="386" text-anchor="middle" font-size="8.5" fill="#6b7a90">Deauth/DoS</text>

  <!-- 4: WPS Kapali - Etki yuksek, maliyet sifir -->
  <circle cx="620" cy="418" r="24" fill="#1a8a3a" opacity="0.18"/>
  <circle cx="620" cy="418" r="24" fill="none" stroke="#1a8a3a" stroke-width="2"/>
  <text x="620" y="415" text-anchor="middle" font-size="8.5" fill="#1a8a3a" font-weight="bold">WPS</text>
  <text x="620" y="425" text-anchor="middle" font-size="8.5" fill="#1a8a3a" font-weight="bold">Kapali</text>
  <text x="620" y="394" text-anchor="middle" font-size="8.5" fill="#6b7a90">WPS PIN</text>

  <!-- 5: Firmware guncel - Etki orta-yuksek, maliyet dusuk -->
  <circle cx="570" cy="415" r="22" fill="#1a8a3a" opacity="0.15"/>
  <circle cx="570" cy="415" r="22" fill="none" stroke="#1a8a3a" stroke-width="1.5"/>
  <text x="570" y="411" text-anchor="middle" font-size="8.5" fill="#1a8a3a" font-weight="bold">Firmware</text>
  <text x="570" y="422" text-anchor="middle" font-size="8.5" fill="#1a8a3a" font-weight="bold">Guncel</text>
  <text x="570" y="393" text-anchor="middle" font-size="8.5" fill="#6b7a90">KRACK/CVE</text>

  <!-- 6: Istemci Izolasyonu - Etki orta, maliyet dusuk -->
  <circle cx="470" cy="412" r="22" fill="#1565c0" opacity="0.15"/>
  <circle cx="470" cy="412" r="22" fill="none" stroke="#1565c0" stroke-width="1.5"/>
  <text x="470" y="409" text-anchor="middle" font-size="8.5" fill="#1565c0" font-weight="bold">Istemci</text>
  <text x="470" y="420" text-anchor="middle" font-size="8.5" fill="#1565c0" font-weight="bold">Izolasyon</text>
  <text x="470" y="388" text-anchor="middle" font-size="8.5" fill="#6b7a90">Yanal hareket</text>

  <!-- 7: 802.1X Enterprise - Etki cok yuksek, maliyet yuksek -->
  <circle cx="720" cy="170" r="28" fill="#1565c0" opacity="0.20"/>
  <circle cx="720" cy="170" r="28" fill="none" stroke="#1565c0" stroke-width="2"/>
  <text x="720" y="167" text-anchor="middle" font-size="9" fill="#1565c0" font-weight="bold">802.1X</text>
  <text x="720" y="178" text-anchor="middle" font-size="9" fill="#1565c0" font-weight="bold">EAP-TLS</text>
  <text x="720" y="146" text-anchor="middle" font-size="8.5" fill="#6b7a90">Paylasilan parola</text>

  <!-- 8: WIDS/WIPS - Etki orta-yuksek, maliyet yuksek -->
  <circle cx="590" cy="180" r="26" fill="#c0392b" opacity="0.18"/>
  <circle cx="590" cy="180" r="26" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="590" y="177" text-anchor="middle" font-size="9" fill="#c0392b" font-weight="bold">WIDS</text>
  <text x="590" y="188" text-anchor="middle" font-size="9" fill="#c0392b" font-weight="bold">WIPS</text>
  <text x="590" y="156" text-anchor="middle" font-size="8.5" fill="#6b7a90">Rogue AP/Evil Twin</text>

  <!-- 9: Segmentasyon - Etki orta, maliyet orta -->
  <circle cx="430" cy="270" r="24" fill="#6b7a90" opacity="0.20"/>
  <circle cx="430" cy="270" r="24" fill="none" stroke="#6b7a90" stroke-width="1.5"/>
  <text x="430" y="268" text-anchor="middle" font-size="8.5" fill="#6b7a90" font-weight="bold">VLAN</text>
  <text x="430" y="279" text-anchor="middle" font-size="8.5" fill="#6b7a90" font-weight="bold">Segment</text>
  <text x="430" y="247" text-anchor="middle" font-size="8.5" fill="#6b7a90">IoT sicramas</text>

  <!-- Oncelik etiketleri kenarda -->
  <rect x="83" y="396" width="90" height="18" fill="#1a8a3a" opacity="0.12" rx="2"/>
  <text x="128" y="409" text-anchor="middle" font-size="9.5" fill="#1a8a3a" font-weight="bold">Oncelik 1-5</text>
  <rect x="83" y="84" width="90" height="18" fill="#c0392b" opacity="0.12" rx="2"/>
  <text x="128" y="97" text-anchor="middle" font-size="9.5" fill="#c0392b" font-weight="bold">Oncelik 7-9</text>

  <!-- Aciklama alani -->
  <rect x="83" y="296" width="220" height="108" fill="#f4f7fb" stroke="#d3dde8" stroke-width="1" rx="3"/>
  <text x="93" y="313" font-size="10" font-weight="bold" fill="#1a2b40">Renk Aciklamasi:</text>
  <circle cx="100" cy="329" r="6" fill="#1a8a3a" opacity="0.7"/>
  <text x="112" y="333" font-size="10" fill="#4a5a70">Sifir/dusuk maliyet, yuksek etki</text>
  <circle cx="100" cy="350" r="6" fill="#1565c0" opacity="0.7"/>
  <text x="112" y="354" font-size="10" fill="#4a5a70">Orta maliyet (altyapi gerektir)</text>
  <circle cx="100" cy="371" r="6" fill="#ff8f00" opacity="0.7"/>
  <text x="112" y="375" font-size="10" fill="#4a5a70">Ayar, dusuk maliyet</text>
  <circle cx="100" cy="392" r="6" fill="#c0392b" opacity="0.7"/>
  <text x="112" y="396" font-size="10" fill="#4a5a70">Yuksek maliyet/karmasiklik</text>
</svg>
