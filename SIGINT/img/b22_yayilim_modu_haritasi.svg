<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="Segoe UI, Arial, sans-serif">
  <rect width="820" height="480" fill="#f4f7fb"/>
  <text x="410" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a2b40">Egzotik Yayilim Modu Haritasi: Frekans × Menzil</text>

  <!-- Grafik alani -->
  <rect x="80" y="45" width="710" height="340" rx="4" fill="#ffffff" stroke="#9fb3c8" stroke-width="1"/>

  <!-- Y ekseni: Menzil (km) -->
  <text x="20" y="220" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a5a70" transform="rotate(-90,20,220)">Menzil (km)</text>
  <!-- Y ekseni cizgisi -->
  <line x1="80" y1="45" x2="80" y2="385" stroke="#9fb3c8" stroke-width="1.5"/>
  <!-- Y ekseni isaretleri -->
  <line x1="75" y1="370" x2="80" y2="370" stroke="#9fb3c8" stroke-width="1"/>
  <text x="72" y="374" text-anchor="end" font-size="9" fill="#6b7a90">10</text>
  <line x1="75" y1="335" x2="80" y2="335" stroke="#9fb3c8" stroke-width="1"/>
  <text x="72" y="339" text-anchor="end" font-size="9" fill="#6b7a90">100</text>
  <line x1="75" y1="295" x2="80" y2="295" stroke="#9fb3c8" stroke-width="1"/>
  <text x="72" y="299" text-anchor="end" font-size="9" fill="#6b7a90">1000</text>
  <line x1="75" y1="240" x2="80" y2="240" stroke="#9fb3c8" stroke-width="1"/>
  <text x="72" y="244" text-anchor="end" font-size="9" fill="#6b7a90">5000</text>
  <line x1="75" y1="180" x2="80" y2="180" stroke="#9fb3c8" stroke-width="1"/>
  <text x="72" y="184" text-anchor="end" font-size="9" fill="#6b7a90">15000</text>
  <line x1="75" y1="100" x2="80" y2="100" stroke="#9fb3c8" stroke-width="1"/>
  <text x="72" y="104" text-anchor="end" font-size="9" fill="#6b7a90">EME</text>

  <!-- X ekseni: Frekans -->
  <line x1="80" y1="385" x2="790" y2="385" stroke="#9fb3c8" stroke-width="1.5"/>
  <polygon points="790,385 780,380 780,390" fill="#9fb3c8"/>
  <text x="440" y="408" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a5a70">Frekans Bantlari</text>

  <!-- X ekseni band etiketleri -->
  <text x="115" y="400" text-anchor="middle" font-size="9" fill="#6b7a90">ELF/VLF</text>
  <text x="115" y="411" text-anchor="middle" font-size="9" fill="#6b7a90">&lt;30kHz</text>
  <line x1="150" y1="380" x2="150" y2="390" stroke="#d3dde8" stroke-width="1"/>

  <text x="215" y="400" text-anchor="middle" font-size="9" fill="#6b7a90">LF/MF</text>
  <text x="215" y="411" text-anchor="middle" font-size="9" fill="#6b7a90">30k–3MHz</text>
  <line x1="280" y1="380" x2="280" y2="390" stroke="#d3dde8" stroke-width="1"/>

  <text x="345" y="400" text-anchor="middle" font-size="9" fill="#6b7a90">HF</text>
  <text x="345" y="411" text-anchor="middle" font-size="9" fill="#6b7a90">3–30MHz</text>
  <line x1="410" y1="380" x2="410" y2="390" stroke="#d3dde8" stroke-width="1"/>

  <text x="490" y="400" text-anchor="middle" font-size="9" fill="#6b7a90">VHF/UHF</text>
  <text x="490" y="411" text-anchor="middle" font-size="9" fill="#6b7a90">30M–3GHz</text>
  <line x1="570" y1="380" x2="570" y2="390" stroke="#d3dde8" stroke-width="1"/>

  <text x="655" y="400" text-anchor="middle" font-size="9" fill="#6b7a90">SHF/EHF</text>
  <text x="655" y="411" text-anchor="middle" font-size="9" fill="#6b7a90">3–300GHz</text>
  <line x1="730" y1="380" x2="730" y2="390" stroke="#d3dde8" stroke-width="1"/>

  <text x="760" y="400" text-anchor="middle" font-size="9" fill="#6b7a90">THz</text>

  <!-- Hafif ızgara çizgileri -->
  <line x1="80" y1="335" x2="790" y2="335" stroke="#f0f4f8" stroke-width="1"/>
  <line x1="80" y1="295" x2="790" y2="295" stroke="#f0f4f8" stroke-width="1"/>
  <line x1="80" y1="240" x2="790" y2="240" stroke="#f0f4f8" stroke-width="1"/>
  <line x1="80" y1="180" x2="790" y2="180" stroke="#f0f4f8" stroke-width="1"/>
  <line x1="150" y1="45" x2="150" y2="385" stroke="#f0f4f8" stroke-width="1"/>
  <line x1="280" y1="45" x2="280" y2="385" stroke="#f0f4f8" stroke-width="1"/>
  <line x1="410" y1="45" x2="410" y2="385" stroke="#f0f4f8" stroke-width="1"/>
  <line x1="570" y1="45" x2="570" y2="385" stroke="#f0f4f8" stroke-width="1"/>
  <line x1="730" y1="45" x2="730" y2="385" stroke="#f0f4f8" stroke-width="1"/>

  <!-- MODLAR / BÖLGELER -->
  <!-- ELF/VLF Küresel (derin su) -->
  <rect x="85" y="55" width="60" height="40" rx="5" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="1.2"/>
  <text x="115" y="72" text-anchor="middle" font-size="9" font-weight="bold" fill="#1565c0">ELF/VLF</text>
  <text x="115" y="85" text-anchor="middle" font-size="8" fill="#1565c0">Küresel</text>

  <!-- Ground-wave -->
  <ellipse cx="215" cy="355" rx="55" ry="18" fill="#6b7a90" fill-opacity="0.18" stroke="#6b7a90" stroke-width="1.2"/>
  <text x="215" y="353" text-anchor="middle" font-size="9" font-weight="bold" fill="#5a6b80">Ground-wave</text>
  <text x="215" y="365" text-anchor="middle" font-size="8" fill="#5a6b80">~10–500 km</text>

  <!-- Sky-wave HF (büyük bölge) -->
  <rect x="290" y="165" width="108" height="85" rx="5" fill="#c0392b" fill-opacity="0.13" stroke="#c0392b" stroke-width="1.3"/>
  <text x="344" y="190" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">Sky-wave</text>
  <text x="344" y="204" text-anchor="middle" font-size="9" fill="#c0392b">1000–12000</text>
  <text x="344" y="218" text-anchor="middle" font-size="9" fill="#c0392b">km</text>
  <text x="344" y="235" text-anchor="middle" font-size="8" fill="#c0392b">F2 katmanı</text>

  <!-- NVIS -->
  <ellipse cx="320" cy="310" rx="38" ry="22" fill="#ff8f00" fill-opacity="0.18" stroke="#ff8f00" stroke-width="1.2"/>
  <text x="320" y="307" text-anchor="middle" font-size="9" font-weight="bold" fill="#b36200">NVIS</text>
  <text x="320" y="320" text-anchor="middle" font-size="8" fill="#b36200">0–400 km</text>

  <!-- Sporadic-E -->
  <ellipse cx="460" cy="248" rx="45" ry="22" fill="#1a8a3a" fill-opacity="0.18" stroke="#1a8a3a" stroke-width="1.2"/>
  <text x="460" y="245" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a8a3a">Sporadic-E</text>
  <text x="460" y="258" text-anchor="middle" font-size="8" fill="#1a8a3a">500–2300 km</text>

  <!-- Tropo ducting -->
  <ellipse cx="515" cy="310" rx="48" ry="22" fill="#1565c0" fill-opacity="0.13" stroke="#1565c0" stroke-width="1.2"/>
  <text x="515" y="307" text-anchor="middle" font-size="9" font-weight="bold" fill="#1565c0">Tropo Ducting</text>
  <text x="515" y="320" text-anchor="middle" font-size="8" fill="#1565c0">100–2000 km</text>

  <!-- Meteor scatter -->
  <ellipse cx="490" cy="200" rx="38" ry="20" fill="#ff8f00" fill-opacity="0.18" stroke="#ff8f00" stroke-width="1.2"/>
  <text x="490" y="197" text-anchor="middle" font-size="9" font-weight="bold" fill="#b36200">Meteor Scatter</text>
  <text x="490" y="209" text-anchor="middle" font-size="8" fill="#b36200">600–2300 km</text>

  <!-- Aurora -->
  <ellipse cx="580" cy="210" rx="40" ry="20" fill="#6b7a90" fill-opacity="0.18" stroke="#6b7a90" stroke-width="1.2"/>
  <text x="580" y="207" text-anchor="middle" font-size="9" font-weight="bold" fill="#5a6b80">Aurora</text>
  <text x="580" y="220" text-anchor="middle" font-size="8" fill="#5a6b80">500–2000 km</text>

  <!-- Moonbounce EME (en üstte, geniş) -->
  <rect x="415" y="58" width="200" height="35" rx="5" fill="#1a2b40" fill-opacity="0.12" stroke="#1a2b40" stroke-width="1.3"/>
  <text x="515" y="74" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a2b40">Moonbounce / EME</text>
  <text x="515" y="87" text-anchor="middle" font-size="9" fill="#1a2b40">~384 000 km (Ay gidiş-dönüş)</text>

  <!-- Lazer/Optik uzay -->
  <ellipse cx="775" cy="80" rx="30" ry="20" fill="#1a8a3a" fill-opacity="0.18" stroke="#1a8a3a" stroke-width="1.2"/>
  <text x="775" y="77" text-anchor="middle" font-size="8" font-weight="bold" fill="#1a8a3a">Optik/</text>
  <text x="775" y="88" text-anchor="middle" font-size="8" font-weight="bold" fill="#1a8a3a">Lazer</text>

  <!-- Efsane -->
  <rect x="85" y="423" width="710" height="42" rx="5" fill="#ffffff" stroke="#d3dde8" stroke-width="1"/>
  <circle cx="115" cy="444" r="6" fill="#c0392b" fill-opacity="0.3" stroke="#c0392b" stroke-width="1"/>
  <text x="128" y="448" font-size="9" fill="#4a5a70">HF Sky-wave/NVIS</text>
  <circle cx="230" cy="444" r="6" fill="#1a8a3a" fill-opacity="0.3" stroke="#1a8a3a" stroke-width="1"/>
  <text x="243" y="448" font-size="9" fill="#4a5a70">Sporadic-E</text>
  <circle cx="330" cy="444" r="6" fill="#ff8f00" fill-opacity="0.3" stroke="#ff8f00" stroke-width="1"/>
  <text x="343" y="448" font-size="9" fill="#4a5a70">Meteor Scatter/NVIS</text>
  <circle cx="470" cy="444" r="6" fill="#1565c0" fill-opacity="0.3" stroke="#1565c0" stroke-width="1"/>
  <text x="483" y="448" font-size="9" fill="#4a5a70">ELF/Tropo Ducting</text>
  <circle cx="600" cy="444" r="6" fill="#6b7a90" fill-opacity="0.3" stroke="#6b7a90" stroke-width="1"/>
  <text x="613" y="448" font-size="9" fill="#4a5a70">Aurora/Ground-wave</text>
  <rect x="710" cy="438" width="12" height="12" rx="2" fill="#1a2b40" fill-opacity="0.2" stroke="#1a2b40" stroke-width="1"/>
  <text x="728" y="448" font-size="9" fill="#4a5a70">EME/Optik</text>

  <line x1="10" y1="472" x2="810" y2="472" stroke="#d3dde8" stroke-width="1"/>
  <text x="410" y="470" text-anchor="middle" font-size="9" fill="#7a8aa0">SIGINT El Kitabı — Bölüm 22: Egzotik Yayilim ve Gelecek SIGINT</text>
</svg>
