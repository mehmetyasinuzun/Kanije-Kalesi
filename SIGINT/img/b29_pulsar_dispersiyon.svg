<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" font-family="Segoe UI, Arial, sans-serif">
  <rect width="860" height="500" fill="#f4f7fb"/>
  <text x="430" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a2b40">Pulsar Dispersiyon ve Dedispersiyon</text>

  <!-- Sol panel: Ham (dispersiyonlu) zaman-frekans -->
  <rect x="15" y="42" width="400" height="430" fill="#ffffff" stroke="#9fb3c8" stroke-width="1" rx="4"/>
  <text x="215" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Ham Veri: Dispersiyon Var (DM biylinmiyor)</text>

  <!-- Zaman-frekans eksen -->
  <line x1="55" y1="90" x2="55" y2="390" stroke="#6b7a90" stroke-width="1.5"/>
  <line x1="55" y1="390" x2="385" y2="390" stroke="#6b7a90" stroke-width="1.5"/>

  <!-- Eksen etiketleri -->
  <text x="220" y="408" text-anchor="middle" font-size="11" fill="#6b7a90">Zaman →</text>
  <text x="40" y="245" text-anchor="middle" font-size="11" fill="#6b7a90" transform="rotate(-90,40,245)">Frekans ↑</text>

  <!-- Frekans isaretleri -->
  <text x="48" y="105" text-anchor="end" font-size="10" fill="#6b7a90">yüksek</text>
  <text x="48" y="385" text-anchor="end" font-size="10" fill="#6b7a90">dusuk</text>
  <!-- Orta frekanslari goster -->
  <text x="48" y="175" text-anchor="end" font-size="9" fill="#6b7a90">f_H</text>
  <text x="48" y="310" text-anchor="end" font-size="9" fill="#6b7a90">f_L</text>

  <!-- Frekans yatay cizgileri -->
  <line x1="55" y1="100" x2="385" y2="100" stroke="#d3dde8" stroke-width="0.7"/>
  <line x1="55" y1="170" x2="385" y2="170" stroke="#d3dde8" stroke-width="0.7"/>
  <line x1="55" y1="240" x2="385" y2="240" stroke="#d3dde8" stroke-width="0.7"/>
  <line x1="55" y1="310" x2="385" y2="310" stroke="#d3dde8" stroke-width="0.7"/>
  <line x1="55" y1="380" x2="385" y2="380" stroke="#d3dde8" stroke-width="0.7"/>

  <!-- Dispersiyonlu darbe: egrili cizgi yuksek frekanstan dusuge dogru kayar -->
  <!-- Yuksek f: x=120, y=100 -->
  <!-- Dusuk f: x=280, y=380 -->
  <!-- Kavisli egri (plazma dispersiyonu: t ∝ 1/f^2) -->
  <!-- Nokta parcalar: her frekans kanalinda gaussian darbe -->

  <!-- Darbe izini gosteren egri: t(f) = DM * 4.15e9 / f^2 ms -->
  <!-- Basitlestirilmis: x(y) = 120 + (y-100)^2/390 gibi -->
  <!-- y=100 (yuksek f): x=120 -->
  <!-- y=170: x=120+4900/390=120+12.6=133 -->
  <!-- y=240: x=120+19600/390=120+50.3=170 -->
  <!-- y=310: x=120+44100/390=120+113=233 -->
  <!-- y=380: x=120+79200/390=120+203=323 -->

  <!-- Her kanalda parcali pulse (kalın çizgi segment) -->
  <line x1="115" y1="100" x2="125" y2="100" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
  <line x1="128" y1="115" x2="138" y2="115" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
  <line x1="131" y1="130" x2="141" y2="130" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
  <line x1="138" y1="145" x2="148" y2="145" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
  <line x1="147" y1="160" x2="157" y2="160" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
  <line x1="159" y1="175" x2="169" y2="175" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
  <line x1="172" y1="190" x2="182" y2="190" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
  <line x1="188" y1="205" x2="198" y2="205" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
  <line x1="200" y1="220" x2="210" y2="220" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
  <line x1="213" y1="235" x2="223" y2="235" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
  <line x1="228" y1="250" x2="238" y2="250" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
  <line x1="243" y1="265" x2="253" y2="265" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
  <line x1="256" y1="280" x2="266" y2="280" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
  <line x1="268" y1="295" x2="278" y2="295" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
  <line x1="282" y1="310" x2="292" y2="310" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
  <line x1="297" y1="325" x2="307" y2="325" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
  <line x1="310" y1="340" x2="320" y2="340" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
  <line x1="322" y1="355" x2="332" y2="355" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
  <line x1="318" y1="370" x2="328" y2="370" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
  <line x1="313" y1="380" x2="323" y2="380" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>

  <!-- Egri oklarla goster -->
  <path d="M120,100 Q200,240 320,380" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7"/>

  <!-- Aciklamalar sol panel -->
  <text x="330" y="108" font-size="10" fill="#c0392b">yuksek f</text>
  <text x="330" y="120" font-size="10" fill="#c0392b">once gelir</text>

  <text x="330" y="372" font-size="10" fill="#c0392b">dusuk f</text>
  <text x="330" y="384" font-size="10" fill="#c0392b">gec kalir</text>

  <!-- Gecikme oku -->
  <line x1="120" y1="100" x2="320" y2="100" stroke="#6b7a90" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="320" y1="100" x2="320" y2="378" stroke="#6b7a90" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="322" y="240" font-size="9" fill="#6b7a90">Δt</text>
  <text x="322" y="252" font-size="9" fill="#6b7a90">(DM</text>
  <text x="322" y="264" font-size="9" fill="#6b7a90">∝ 1/f²)</text>

  <!-- Alt bilgi sol -->
  <rect x="22" y="400" width="385" height="62" rx="3" fill="#fdf0f0" stroke="#c0392b" stroke-width="1"/>
  <text x="215" y="416" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">Dispersiyon: Plazma Gecikmesi</text>
  <text x="215" y="430" text-anchor="middle" font-size="10" fill="#36506e">t_gecikme(f) ∝ DM / f²  (plazma dispersiyon formülü)</text>
  <text x="215" y="444" text-anchor="middle" font-size="10" fill="#36506e">DM = ∫ n_e dl  (goruş hattındaki toplam elektron)</text>
  <text x="215" y="458" text-anchor="middle" font-size="10" fill="#36506e">Daha buyuk DM → daha buyuk frekans yayilmasi</text>

  <!-- Sag panel: Dedispersiyon (duzeltilmis) -->
  <rect x="430" y="42" width="415" height="430" fill="#ffffff" stroke="#9fb3c8" stroke-width="1" rx="4"/>
  <text x="637" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a8a3a">Dedispersiyon Sonrasi (DM biliniyor)</text>

  <!-- Zaman-frekans eksen -->
  <line x1="465" y1="90" x2="465" y2="390" stroke="#6b7a90" stroke-width="1.5"/>
  <line x1="465" y1="390" x2="830" y2="390" stroke="#6b7a90" stroke-width="1.5"/>

  <text x="648" y="408" text-anchor="middle" font-size="11" fill="#6b7a90">Zaman →</text>
  <text x="450" y="245" text-anchor="middle" font-size="11" fill="#6b7a90" transform="rotate(-90,450,245)">Frekans ↑</text>

  <!-- Frekans etiket -->
  <text x="458" y="105" text-anchor="end" font-size="10" fill="#6b7a90">yüksek</text>
  <text x="458" y="385" text-anchor="end" font-size="10" fill="#6b7a90">dusuk</text>

  <!-- Frekans yatay cizgileri -->
  <line x1="465" y1="100" x2="830" y2="100" stroke="#d3dde8" stroke-width="0.7"/>
  <line x1="465" y1="170" x2="830" y2="170" stroke="#d3dde8" stroke-width="0.7"/>
  <line x1="465" y1="240" x2="830" y2="240" stroke="#d3dde8" stroke-width="0.7"/>
  <line x1="465" y1="310" x2="830" y2="310" stroke="#d3dde8" stroke-width="0.7"/>
  <line x1="465" y1="380" x2="830" y2="380" stroke="#d3dde8" stroke-width="0.7"/>

  <!-- Dedispersiyon ile hizalanmis darbeler: hepsi x=630 civari -->
  <!-- Her kanal ayni x konumunda -->
  <line x1="625" y1="100" x2="635" y2="100" stroke="#1a8a3a" stroke-width="4" stroke-linecap="round"/>
  <line x1="625" y1="115" x2="635" y2="115" stroke="#1a8a3a" stroke-width="4" stroke-linecap="round"/>
  <line x1="625" y1="130" x2="635" y2="130" stroke="#1a8a3a" stroke-width="4" stroke-linecap="round"/>
  <line x1="625" y1="145" x2="635" y2="145" stroke="#1a8a3a" stroke-width="4" stroke-linecap="round"/>
  <line x1="625" y1="160" x2="635" y2="160" stroke="#1a8a3a" stroke-width="4" stroke-linecap="round"/>
  <line x1="625" y1="175" x2="635" y2="175" stroke="#1a8a3a" stroke-width="4" stroke-linecap="round"/>
  <line x1="625" y1="190" x2="635" y2="190" stroke="#1a8a3a" stroke-width="4" stroke-linecap="round"/>
  <line x1="625" y1="205" x2="635" y2="205" stroke="#1a8a3a" stroke-width="4" stroke-linecap="round"/>
  <line x1="625" y1="220" x2="635" y2="220" stroke="#1a8a3a" stroke-width="4" stroke-linecap="round"/>
  <line x1="625" y1="235" x2="635" y2="235" stroke="#1a8a3a" stroke-width="4" stroke-linecap="round"/>
  <line x1="625" y1="250" x2="635" y2="250" stroke="#1a8a3a" stroke-width="4" stroke-linecap="round"/>
  <line x1="625" y1="265" x2="635" y2="265" stroke="#1a8a3a" stroke-width="4" stroke-linecap="round"/>
  <line x1="625" y1="280" x2="635" y2="280" stroke="#1a8a3a" stroke-width="4" stroke-linecap="round"/>
  <line x1="625" y1="295" x2="635" y2="295" stroke="#1a8a3a" stroke-width="4" stroke-linecap="round"/>
  <line x1="625" y1="310" x2="635" y2="310" stroke="#1a8a3a" stroke-width="4" stroke-linecap="round"/>
  <line x1="625" y1="325" x2="635" y2="325" stroke="#1a8a3a" stroke-width="4" stroke-linecap="round"/>
  <line x1="625" y1="340" x2="635" y2="340" stroke="#1a8a3a" stroke-width="4" stroke-linecap="round"/>
  <line x1="625" y1="355" x2="635" y2="355" stroke="#1a8a3a" stroke-width="4" stroke-linecap="round"/>
  <line x1="625" y1="370" x2="635" y2="370" stroke="#1a8a3a" stroke-width="4" stroke-linecap="round"/>
  <line x1="625" y1="380" x2="635" y2="380" stroke="#1a8a3a" stroke-width="4" stroke-linecap="round"/>

  <!-- Dikey cizgi: hizalanmis darbe -->
  <line x1="630" y1="100" x2="630" y2="385" stroke="#1a8a3a" stroke-width="2" stroke-dasharray="3,2" opacity="0.5"/>

  <!-- Hizalanmis etiketi -->
  <text x="650" y="190" font-size="10" fill="#1a8a3a" font-weight="bold">Tum</text>
  <text x="650" y="203" font-size="10" fill="#1a8a3a" font-weight="bold">kanallar</text>
  <text x="650" y="216" font-size="10" fill="#1a8a3a" font-weight="bold">hizalandi!</text>

  <!-- Ikinci darbe (periyot gosterimi) -->
  <line x1="720" y1="100" x2="730" y2="100" stroke="#1a8a3a" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="720" y1="115" x2="730" y2="115" stroke="#1a8a3a" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="720" y1="130" x2="730" y2="130" stroke="#1a8a3a" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="720" y1="145" x2="730" y2="145" stroke="#1a8a3a" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="720" y1="160" x2="730" y2="160" stroke="#1a8a3a" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="720" y1="175" x2="730" y2="175" stroke="#1a8a3a" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="720" y1="190" x2="730" y2="190" stroke="#1a8a3a" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="720" y1="205" x2="730" y2="205" stroke="#1a8a3a" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="720" y1="220" x2="730" y2="220" stroke="#1a8a3a" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="720" y1="235" x2="730" y2="235" stroke="#1a8a3a" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="720" y1="250" x2="730" y2="250" stroke="#1a8a3a" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="720" y1="265" x2="730" y2="265" stroke="#1a8a3a" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="720" y1="280" x2="730" y2="280" stroke="#1a8a3a" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="720" y1="295" x2="730" y2="295" stroke="#1a8a3a" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="720" y1="310" x2="730" y2="310" stroke="#1a8a3a" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="720" y1="325" x2="730" y2="325" stroke="#1a8a3a" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="720" y1="340" x2="730" y2="340" stroke="#1a8a3a" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="720" y1="355" x2="730" y2="355" stroke="#1a8a3a" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="720" y1="370" x2="730" y2="370" stroke="#1a8a3a" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="720" y1="380" x2="730" y2="380" stroke="#1a8a3a" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="725" y1="100" x2="725" y2="385" stroke="#1a8a3a" stroke-width="2" stroke-dasharray="3,2" opacity="0.3"/>

  <!-- Periyot etiketi -->
  <line x1="630" y1="92" x2="725" y2="92" stroke="#1565c0" stroke-width="1.5"/>
  <line x1="630" y1="88" x2="630" y2="96" stroke="#1565c0" stroke-width="1.5"/>
  <line x1="725" y1="88" x2="725" y2="96" stroke="#1565c0" stroke-width="1.5"/>
  <text x="678" y="87" text-anchor="middle" font-size="10" fill="#1565c0" font-weight="bold">P (periyot)</text>

  <!-- Alt bilgi sag -->
  <rect x="438" y="400" width="400" height="65" rx="3" fill="#f0fff4" stroke="#1a8a3a" stroke-width="1.5"/>
  <text x="638" y="416" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a8a3a">Dedispersiyon: Kanal Geri Kaydirma</text>
  <text x="638" y="430" text-anchor="middle" font-size="10" fill="#36506e">Her frekans kanali Δt(f) = DM × 4150 / f² ms kadar geri kaydırılır</text>
  <text x="638" y="444" text-anchor="middle" font-size="10" fill="#36506e">DM bilinirse: tam hizalama → darbe keskinlesir → zamanlama mumkun</text>
  <text x="638" y="458" text-anchor="middle" font-size="10" fill="#36506e">DM bilinmiyorsa: en keskin darbe veren DM aranir (arama/optimizasyon)</text>

</svg>
