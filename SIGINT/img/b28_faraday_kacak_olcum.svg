<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" font-family="Segoe UI, Arial, sans-serif">
  <rect width="840" height="460" fill="#f4f7fb"/>
  <text x="420" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a2b40">Faraday Kafesi Etkinligi Olcumu (A/B Karsilastirma)</text>

  <defs>
    <marker id="aw" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ff8f00"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1a8a3a"/>
    </marker>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Sol panel: Duzen aciklamasi -->
  <rect x="15" y="42" width="380" height="390" fill="#ffffff" stroke="#9fb3c8" stroke-width="1" rx="4"/>
  <text x="205" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#36506e">Olcum Duzeni</text>

  <!-- Referans sinyal kaynagi (DISARIDA) -->
  <rect x="30" y="80" width="140" height="60" rx="5" fill="#fff8e1" stroke="#ff8f00" stroke-width="2"/>
  <text x="100" y="103" text-anchor="middle" font-size="11" font-weight="bold" fill="#ff8f00">Referans Sinyal</text>
  <text x="100" y="118" text-anchor="middle" font-size="10" fill="#ff8f00">Kaynagi (DISARIDA)</text>
  <text x="100" y="131" text-anchor="middle" font-size="9" fill="#6b7a90">FM istasyonu veya kendi</text>
  <!-- Anten sembolu -->
  <line x1="166" y1="110" x2="195" y2="110" stroke="#ff8f00" stroke-width="2"/>
  <text x="175" y="106" font-size="9" fill="#ff8f00">→</text>
  <text x="185" y="106" font-size="20" fill="#ff8f00">~</text>

  <!-- Sinyal oklarla Faraday kutusuna dogru -->
  <line x1="200" y1="110" x2="260" y2="140" stroke="#ff8f00" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#aw)"/>
  <line x1="200" y1="110" x2="260" y2="180" stroke="#ff8f00" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#aw)"/>
  <line x1="200" y1="110" x2="260" y2="240" stroke="#ff8f00" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#aw)"/>

  <!-- Faraday kafes/kutu (ic) -->
  <!-- Kapi: acik durum icin dashed taraf, kapali icin solid -->
  <!-- Kutu: 260-370, 120-340 -->
  <rect x="258" y="118" width="115" height="220" fill="#f4f7fb" stroke="#1565c0" stroke-width="2.5" rx="3"
    stroke-dasharray="8,4"/>
  <text x="315" y="140" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565c0">FARADAY</text>
  <text x="315" y="153" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565c0">KAFES</text>

  <!-- Kapak acik ikonu (ust sol kosede) -->
  <rect x="258" y="118" width="35" height="12" fill="#fff" stroke="#1565c0" stroke-width="1.5" rx="1"/>
  <text x="275" y="128" text-anchor="middle" font-size="9" fill="#c0392b">ACIK</text>

  <!-- Kapalı ikonu -->
  <rect x="298" y="118" width="35" height="12" fill="#1565c0" stroke="#1565c0" stroke-width="1.5" rx="1"/>
  <text x="315" y="128" text-anchor="middle" font-size="9" fill="#ffffff">KAPALI</text>

  <!-- RTL-SDR ICINDE -->
  <rect x="270" y="200" width="90" height="52" rx="4" fill="#e8f0fb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="315" y="220" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565c0">RTL-SDR</text>
  <text x="315" y="233" text-anchor="middle" font-size="9" fill="#1565c0">+ kisa anten</text>
  <text x="315" y="244" text-anchor="middle" font-size="9" fill="#1565c0">ICINDE</text>

  <!-- Olcum adimları -->
  <rect x="25" y="350" width="360" height="72" rx="4" fill="#f0fff4" stroke="#1a8a3a" stroke-width="1"/>
  <text x="205" y="367" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a8a3a">Olcum Yontemi:</text>
  <text x="205" y="381" text-anchor="middle" font-size="10" fill="#36506e">1) Kapak ACIKKEN → sinyal seviyesi oku (dBFS)</text>
  <text x="205" y="394" text-anchor="middle" font-size="10" fill="#36506e">2) Kapagi KAPAT → ayni frekans, seviyeyi tekrar oku</text>
  <text x="205" y="408" text-anchor="middle" font-size="10" fill="#1a8a3a">Izolasyon ≈ Acik_dBFS − Kapali_dBFS</text>

  <!-- Sag panel: Spektrum karsilastirma -->
  <rect x="410" y="42" width="415" height="390" fill="#ffffff" stroke="#9fb3c8" stroke-width="1" rx="4"/>
  <text x="617" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#36506e">GQRX / SDR++ Sinyal Seviyesi (ornek)</text>

  <!-- Ust: KAPAK ACIK -->
  <rect x="420" y="75" width="395" height="145" rx="3" fill="#fdf5e6" stroke="#ff8f00" stroke-width="1.5"/>
  <text x="617" y="93" text-anchor="middle" font-size="11" font-weight="bold" fill="#ff8f00">KAPAK ACIK — Sinyal iceri giriyor</text>

  <!-- Spektrum grafik acik -->
  <line x1="430" y1="185" x2="800" y2="185" stroke="#6b7a90" stroke-width="1"/>
  <line x1="430" y1="110" x2="430" y2="185" stroke="#6b7a90" stroke-width="1"/>
  <text x="425" y="115" text-anchor="end" font-size="9" fill="#6b7a90">−30</text>
  <text x="425" y="130" text-anchor="end" font-size="9" fill="#6b7a90">−40</text>
  <text x="425" y="150" text-anchor="end" font-size="9" fill="#6b7a90">−55</text>
  <text x="425" y="185" text-anchor="end" font-size="9" fill="#6b7a90">−80</text>
  <text x="800" y="193" text-anchor="middle" font-size="9" fill="#6b7a90">dBFS</text>

  <!-- Gurultu tabani acik: y=175 -->
  <line x1="430" y1="175" x2="800" y2="175" stroke="#9fb3c8" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- Referans sinyal tepesi: acikta guclu (FM isitasyonu gibi) -->
  <!-- Tepe x=615, y=115 (cok guclu) -->
  <path d="M430,175 L500,175 L590,175 L600,155 L610,125 L617,112 L625,125 L635,155 L645,175 L700,175 L800,175"
    fill="none" stroke="#ff8f00" stroke-width="2"/>
  <!-- Tepe etiketi -->
  <line x1="617" y1="112" x2="680" y2="95" stroke="#ff8f00" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="682" y="95" font-size="10" fill="#ff8f00" font-weight="bold">−30 dBFS</text>
  <text x="682" y="107" font-size="9" fill="#ff8f00">(referans FM)</text>

  <!-- Bant etiketi -->
  <text x="617" y="200" text-anchor="middle" font-size="9" fill="#6b7a90">100 MHz</text>

  <!-- Alt: KAPAK KAPALI -->
  <rect x="420" y="230" width="395" height="145" rx="3" fill="#f0fff4" stroke="#1a8a3a" stroke-width="2"/>
  <text x="617" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a8a3a">KAPAK KAPALI — Kafes zayiflatmasi aktif</text>

  <!-- Spektrum grafik kapali -->
  <line x1="430" y1="340" x2="800" y2="340" stroke="#6b7a90" stroke-width="1"/>
  <line x1="430" y1="265" x2="430" y2="340" stroke="#6b7a90" stroke-width="1"/>
  <text x="425" y="270" text-anchor="end" font-size="9" fill="#6b7a90">−30</text>
  <text x="425" y="285" text-anchor="end" font-size="9" fill="#6b7a90">−40</text>
  <text x="425" y="305" text-anchor="end" font-size="9" fill="#6b7a90">−55</text>
  <text x="425" y="340" text-anchor="end" font-size="9" fill="#6b7a90">−80</text>

  <!-- Gurultu tabani kapali: y=335 -->
  <line x1="430" y1="333" x2="800" y2="333" stroke="#9fb3c8" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- Referans sinyal cok zayif (−70 dBFS → y konumu ~307) -->
  <path d="M430,333 L590,333 L600,330 L610,325 L617,320 L625,325 L635,330 L645,333 L800,333"
    fill="none" stroke="#1a8a3a" stroke-width="2"/>
  <!-- Tepe etiketi -->
  <line x1="617" y1="320" x2="680" y2="305" stroke="#1a8a3a" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="682" y="305" font-size="10" fill="#1a8a3a" font-weight="bold">−70 dBFS</text>
  <text x="682" y="317" font-size="9" fill="#1a8a3a">(kafes icerisinde)</text>

  <!-- Fark oku + izolasyon etiketi -->
  <line x1="720" y1="115" x2="720" y2="320" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="724" y="165" font-size="10" fill="#c0392b" font-weight="bold">Δ =</text>
  <text x="724" y="178" font-size="10" fill="#c0392b" font-weight="bold">−30</text>
  <text x="724" y="191" font-size="10" fill="#c0392b" font-weight="bold">−(−70)</text>
  <text x="724" y="204" font-size="10" fill="#c0392b" font-weight="bold">= 40 dB</text>
  <text x="724" y="218" font-size="10" fill="#c0392b">izolasyon</text>
  <!-- Ok uclar -->
  <line x1="718" y1="117" x2="726" y2="117" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="718" y1="319" x2="726" y2="319" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Alt ozet seridi -->
  <rect x="420" y="385" width="395" height="40" rx="3" fill="#e8f0fb" stroke="#9fb3c8" stroke-width="1"/>
  <text x="617" y="401" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565c0">Ornek sonuc: bu kafes bu frekansta ≈ 40 dB izolasyon sagliyor</text>
  <text x="617" y="415" text-anchor="middle" font-size="10" fill="#36506e">Frekansa gore degisir — her hedef frekansta ayri olc!</text>

</svg>
