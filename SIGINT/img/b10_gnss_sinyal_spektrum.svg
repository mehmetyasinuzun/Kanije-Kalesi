<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="860" height="480" fill="#f4f7fb"/>
  <text x="430" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a2b40">GNSS Ailesi — Frekans Bantlari (1100–1650 MHz)</text>

  <!-- Ana panel -->
  <rect x="20" y="44" width="820" height="390" fill="#ffffff" stroke="#9fb3c8" stroke-width="1" rx="3"/>

  <!-- Frekans ekseni -->
  <line x1="55" y1="360" x2="830" y2="360" stroke="#6b7a90" stroke-width="1.5"/>
  <!-- Eksende ok -->
  <polygon points="830,356 840,360 830,364" fill="#6b7a90"/>
  <text x="845" y="364" font-size="11" fill="#1a2b40">MHz</text>

  <!-- Frekans isaretleri ve etiketleri -->
  <!-- 1100 -->
  <line x1="60" y1="358" x2="60" y2="365" stroke="#6b7a90" stroke-width="1"/>
  <text x="42" y="378" font-size="9" fill="#4a5a70">1100</text>
  <!-- 1150 -->
  <line x1="115" y1="358" x2="115" y2="364" stroke="#d3dde8" stroke-width="0.8"/>
  <text x="101" y="378" font-size="9" fill="#4a5a70">1150</text>
  <!-- 1176.45 L5/E5a/B2a -->
  <line x1="141" y1="358" x2="141" y2="125" stroke="#d3dde8" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="127" y="378" font-size="9" fill="#4a5a70">1176</text>
  <!-- 1200 -->
  <line x1="168" y1="358" x2="168" y2="364" stroke="#d3dde8" stroke-width="0.8"/>
  <text x="154" y="378" font-size="9" fill="#4a5a70">1200</text>
  <!-- 1207.14 E5b -->
  <line x1="175" y1="358" x2="175" y2="330" stroke="#d3dde8" stroke-width="0.8" stroke-dasharray="2,2"/>
  <!-- 1227.60 L2 -->
  <line x1="198" y1="358" x2="198" y2="300" stroke="#d3dde8" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="184" y="378" font-size="9" fill="#4a5a70">1228</text>
  <!-- 1246 GLONASS L2 -->
  <line x1="248" y1="358" x2="248" y2="364" stroke="#d3dde8" stroke-width="0.8"/>
  <text x="234" y="378" font-size="9" fill="#4a5a70">1246</text>
  <!-- 1268 B3 -->
  <line x1="272" y1="358" x2="272" y2="364" stroke="#d3dde8" stroke-width="0.8"/>
  <!-- 1278 E6 -->
  <line x1="284" y1="358" x2="284" y2="330" stroke="#d3dde8" stroke-width="0.8" stroke-dasharray="2,2"/>
  <!-- 1300 -->
  <line x1="308" y1="358" x2="308" y2="364" stroke="#d3dde8" stroke-width="0.8"/>
  <text x="294" y="378" font-size="9" fill="#4a5a70">1300</text>
  <!-- 1400 -->
  <line x1="420" y1="358" x2="420" y2="364" stroke="#d3dde8" stroke-width="0.8"/>
  <text x="406" y="378" font-size="9" fill="#4a5a70">1400</text>
  <!-- 1500 -->
  <line x1="532" y1="358" x2="532" y2="364" stroke="#d3dde8" stroke-width="0.8"/>
  <text x="518" y="378" font-size="9" fill="#4a5a70">1500</text>
  <!-- 1561 BDS B1I -->
  <line x1="591" y1="358" x2="591" y2="364" stroke="#d3dde8" stroke-width="0.8"/>
  <!-- 1575.42 L1/E1/B1C -->
  <line x1="608" y1="358" x2="608" y2="95" stroke="#d3dde8" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="594" y="378" font-size="9" fill="#4a5a70">1575</text>
  <!-- 1600 -->
  <line x1="644" y1="358" x2="644" y2="364" stroke="#d3dde8" stroke-width="0.8"/>
  <text x="630" y="378" font-size="9" fill="#4a5a70">1600</text>
  <!-- 1602 GLONASS L1 merkez -->
  <line x1="646" y1="358" x2="646" y2="200" stroke="#d3dde8" stroke-width="0.8" stroke-dasharray="3,2"/>
  <!-- 1650 -->
  <line x1="700" y1="358" x2="700" y2="364" stroke="#d3dde8" stroke-width="0.8"/>
  <text x="686" y="378" font-size="9" fill="#4a5a70">1650</text>

  <!-- ====== BANT BLOKLARI ====== -->
  <!-- Ölcek: 1 MHz = ~1.12 px, 1100 -> x=60, 1650 -> x=716 -->
  <!-- x = 60 + (f - 1100) * 1.12 -->

  <!-- GPS L5: 1176.45 MHz, bant ~24 MHz = ~27px -->
  <!-- x_center = 60 + (1176.45-1100)*1.12 = 60+85.6 = 145.6 ~146 -->
  <rect x="133" y="130" width="26" height="228" fill="#1565c0" fill-opacity="0.75" rx="1"/>
  <text x="146" y="125" text-anchor="middle" font-size="9" font-weight="bold" fill="#1565c0">GPS L5</text>
  <text x="146" y="115" text-anchor="middle" font-size="8" fill="#1565c0">1176.45</text>

  <!-- Galileo E5a: 1176.45 MHz, ~51 MHz genis -->
  <rect x="120" y="145" width="52" height="50" fill="#ff8f00" fill-opacity="0.4" rx="1"/>
  <text x="146" y="211" text-anchor="middle" font-size="9" fill="#ff8f00">GAL E5a</text>
  <text x="146" y="223" text-anchor="middle" font-size="8" fill="#ff8f00">1176.45</text>

  <!-- BeiDou B2a: 1176.45, dar -->
  <rect x="137" y="160" width="18" height="45" fill="#1a8a3a" fill-opacity="0.5" rx="1"/>
  <text x="146" y="252" text-anchor="middle" font-size="9" fill="#1a8a3a">BDS B2a</text>

  <!-- NavIC L5: 1176.45 -->
  <rect x="140" y="175" width="12" height="30" fill="#7a8aa0" fill-opacity="0.6" rx="1"/>

  <!-- GPS L2: 1227.60 MHz, ~24 MHz -->
  <!-- x = 60 + (1227.60-1100)*1.12 = 60+142.9 = 203 -->
  <rect x="191" y="170" width="26" height="188" fill="#1565c0" fill-opacity="0.75" rx="1"/>
  <text x="204" y="165" text-anchor="middle" font-size="9" font-weight="bold" fill="#1565c0">GPS L2</text>
  <text x="204" y="155" text-anchor="middle" font-size="8" fill="#1565c0">1227.60</text>

  <!-- GLONASS L2: ~1246-1256 MHz, her uydu farkli f (FDMA), 14 kanal ~12MHz aralik -->
  <!-- x_merkez = 60+(1246-1100)*1.12 = 60+163.5 = 223.5, genislik ~20 -->
  <rect x="237" y="195" width="22" height="163" fill="#c0392b" fill-opacity="0.55" rx="1"/>
  <text x="248" y="190" text-anchor="middle" font-size="9" font-weight="bold" fill="#c0392b">GLO L2</text>
  <text x="248" y="180" text-anchor="middle" font-size="8" fill="#c0392b">~1246</text>

  <!-- Galileo E6: 1278.75 MHz -->
  <!-- x = 60+(1278.75-1100)*1.12 = 60+200.2 = 260 -->
  <rect x="254" y="240" width="40" height="118" fill="#ff8f00" fill-opacity="0.55" rx="1"/>
  <text x="274" y="234" text-anchor="middle" font-size="9" font-weight="bold" fill="#ff8f00">GAL E6</text>
  <text x="274" y="224" text-anchor="middle" font-size="8" fill="#ff8f00">1278.75</text>

  <!-- BeiDou B3: ~1268.52 MHz -->
  <!-- x = 60+(1268.52-1100)*1.12 = 60+188.7 = 249 -->
  <rect x="263" y="260" width="20" height="98" fill="#1a8a3a" fill-opacity="0.5" rx="1"/>
  <text x="273" y="374" text-anchor="middle" font-size="8" fill="#1a8a3a">BDS B3</text>

  <!-- Galileo E5b: 1207.14 MHz -->
  <!-- x = 60+(1207.14-1100)*1.12 = 60+120 = 180 -->
  <rect x="168" y="215" width="24" height="143" fill="#ff8f00" fill-opacity="0.5" rx="1"/>
  <text x="180" y="210" text-anchor="middle" font-size="9" fill="#ff8f00">GAL E5b</text>
  <text x="180" y="200" text-anchor="middle" font-size="8" fill="#ff8f00">1207.14</text>

  <!-- BeiDou B1I: 1561.098 MHz -->
  <!-- x = 60+(1561.098-1100)*1.12 = 60+516.4 = 576 -->
  <rect x="568" y="185" width="18" height="173" fill="#1a8a3a" fill-opacity="0.65" rx="1"/>
  <text x="577" y="180" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a8a3a">BDS B1I</text>
  <text x="577" y="170" text-anchor="middle" font-size="8" fill="#1a8a3a">1561.1</text>

  <!-- GPS L1 / Galileo E1 / BeiDou B1C / QZSS L1: 1575.42 MHz -->
  <!-- x = 60+(1575.42-1100)*1.12 = 60+532.5 = 592 -->
  <!-- Ortak frekans - cok kalin, urgulayan -->
  <rect x="584" y="95" width="50" height="263" fill="#1565c0" fill-opacity="0.6" rx="1"/>
  <!-- Galileo E1 (ustune binen) -->
  <rect x="587" y="108" width="44" height="60" fill="#ff8f00" fill-opacity="0.55" rx="1"/>
  <!-- BeiDou B1C -->
  <rect x="592" y="128" width="34" height="45" fill="#1a8a3a" fill-opacity="0.5" rx="1"/>
  <!-- Etiketler -->
  <text x="609" y="90" text-anchor="middle" font-size="9" font-weight="bold" fill="#1565c0">GPS L1</text>
  <text x="609" y="80" text-anchor="middle" font-size="8" fill="#1565c0">1575.42 MHz</text>
  <text x="609" y="70" text-anchor="middle" font-size="8" font-weight="bold" fill="#c0392b">← ORTAK FREKANS</text>

  <!-- GLONASS L1: FDMA ~1598-1606 MHz -->
  <!-- x_merkez = 60+(1602-1100)*1.12 = 60+562.2 = 622 -->
  <rect x="631" y="175" width="30" height="183" fill="#c0392b" fill-opacity="0.55" rx="1"/>
  <text x="646" y="170" text-anchor="middle" font-size="9" font-weight="bold" fill="#c0392b">GLO L1</text>
  <text x="646" y="160" text-anchor="middle" font-size="8" fill="#c0392b">~1598-1606</text>
  <text x="646" y="150" text-anchor="middle" font-size="8" fill="#c0392b">(FDMA)</text>

  <!-- ====== OZEL ISARET: ORTAK FREKANS ====== -->
  <!-- 1575.42 dikey kesik cizgi -->
  <line x1="609" y1="56" x2="609" y2="358" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="6,3"/>
  <!-- 1176.45 dikey kesik cizgi -->
  <line x1="146" y1="88" x2="146" y2="358" stroke="#7a8aa0" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Etiket 1176.45 -->
  <rect x="62" y="88" width="80" height="28" fill="#f4f7fb" stroke="#7a8aa0" stroke-width="0.8" rx="2"/>
  <text x="102" y="100" text-anchor="middle" font-size="9" font-weight="bold" fill="#7a8aa0">1176.45 MHz</text>
  <text x="102" y="112" text-anchor="middle" font-size="8" fill="#7a8aa0">L5/E5a/B2a ortak</text>

  <!-- Etiket 1575.42 -->
  <rect x="660" y="68" width="88" height="30" fill="#fff0f0" stroke="#c0392b" stroke-width="1" rx="2"/>
  <text x="704" y="80" text-anchor="middle" font-size="9" font-weight="bold" fill="#c0392b">1575.42 MHz</text>
  <text x="704" y="94" text-anchor="middle" font-size="8" fill="#c0392b">GPS/GAL/BDS/QZSS ortak</text>

  <!-- Efsane / Legand -->
  <rect x="30" y="390" width="800" height="38" fill="#f4f7fb" rx="2"/>
  <line x1="40" y1="407" x2="60" y2="407" stroke="#1565c0" stroke-width="5" opacity="0.75"/>
  <text x="64" y="411" font-size="10" fill="#1a2b40">GPS</text>
  <line x1="100" y1="407" x2="120" y2="407" stroke="#ff8f00" stroke-width="5" opacity="0.75"/>
  <text x="124" y="411" font-size="10" fill="#1a2b40">Galileo</text>
  <line x1="180" y1="407" x2="200" y2="407" stroke="#c0392b" stroke-width="5" opacity="0.75"/>
  <text x="204" y="411" font-size="10" fill="#1a2b40">GLONASS (FDMA → her uydu ayri f)</text>
  <line x1="390" y1="407" x2="410" y2="407" stroke="#1a8a3a" stroke-width="5" opacity="0.75"/>
  <text x="414" y="411" font-size="10" fill="#1a2b40">BeiDou</text>
  <line x1="470" y1="407" x2="490" y2="407" stroke="#7a8aa0" stroke-width="5" opacity="0.75"/>
  <text x="494" y="411" font-size="10" fill="#1a2b40">NavIC/QZSS (L bandı paylaşimi)</text>

  <text x="430" y="428" text-anchor="middle" font-size="10" fill="#36506e">Ayni frekansta uzduse birden fazla sistem varsa CDMA ile kod ayrimi yapilir (GPS/GAL/BDS aynı 1575.42 MHz'de farkli kodlarla).</text>

  <!-- Baslik cizgisi -->
  <line x1="20" y1="38" x2="840" y2="38" stroke="#9fb3c8" stroke-width="0.8"/>
</svg>
