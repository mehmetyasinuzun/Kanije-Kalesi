<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" font-family="Segoe UI, Arial, sans-serif">
  <rect width="820" height="460" fill="#f4f7fb"/>
  <text x="410" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a2b40">Proje Donanim Baglanti ve Anten Eklemeleri</text>
  <text x="410" y="46" text-anchor="middle" font-size="11" fill="#6b7a90">RTL-SDR cekirdek kit + ozel ekler</text>

  <defs>
    <marker id="conn" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1565c0"/>
    </marker>
    <marker id="connp" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ff8f00"/>
    </marker>
  </defs>

  <!-- ===== Ana zincir (orta satir) ===== -->
  <!-- y=200-240 merkez -->

  <!-- 1. RTL-SDR Dongle -->
  <rect x="30" y="188" width="110" height="56" rx="6" fill="#1565c0"/>
  <text x="85" y="210" text-anchor="middle" font-size="11" font-weight="bold" fill="white">RTL-SDR</text>
  <text x="85" y="224" text-anchor="middle" font-size="10" fill="white">Blog V3/V4</text>
  <text x="85" y="237" text-anchor="middle" font-size="9" fill="#d3dde8">100kHz-1.7GHz</text>

  <!-- USB -->
  <line x1="140" y1="216" x2="175" y2="216" stroke="#1565c0" stroke-width="2.5" marker-end="url(#conn)"/>
  <rect x="148" y="205" width="30" height="13" rx="2" fill="#4a5a70"/>
  <text x="163" y="215" text-anchor="middle" font-size="9" fill="white">USB</text>

  <!-- 2. Raspberry Pi -->
  <rect x="178" y="188" width="120" height="56" rx="6" fill="#1565c0"/>
  <text x="238" y="210" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Raspberry Pi</text>
  <text x="238" y="224" text-anchor="middle" font-size="10" fill="white">4 veya 5</text>
  <text x="238" y="237" text-anchor="middle" font-size="9" fill="#d3dde8">headless / DragonOS</text>

  <!-- Ethernet -->
  <line x1="298" y1="216" x2="333" y2="216" stroke="#1565c0" stroke-width="2.5" marker-end="url(#conn)"/>
  <rect x="304" y="205" width="32" height="13" rx="2" fill="#4a5a70"/>
  <text x="320" y="215" text-anchor="middle" font-size="9" fill="white">ETH</text>

  <!-- 3. Yonlendirici -->
  <rect x="336" y="188" width="100" height="56" rx="6" fill="#1565c0"/>
  <text x="386" y="210" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Router</text>
  <text x="386" y="224" text-anchor="middle" font-size="10" fill="white">Yonlendirici</text>
  <text x="386" y="237" text-anchor="middle" font-size="9" fill="#d3dde8">LAN/WiFi</text>

  <!-- SSH -->
  <line x1="436" y1="216" x2="468" y2="216" stroke="#1565c0" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#conn)"/>
  <text x="452" y="210" text-anchor="middle" font-size="9" fill="#1565c0">SSH</text>

  <!-- 4. Uzak erisim -->
  <rect x="470" y="196" width="100" height="40" rx="6" fill="#1a8a3a"/>
  <text x="520" y="212" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Uzak Erisim</text>
  <text x="520" y="227" text-anchor="middle" font-size="9" fill="white">dizustu / bulut</text>

  <!-- ===== Anten eklemeleri (yukari sira) ===== -->

  <!-- SMA girisi dongleden sol uce -->
  <line x1="85" y1="188" x2="85" y2="120" stroke="#ff8f00" stroke-width="2" marker-end="url(#connp)"/>
  <text x="92" y="160" font-size="9" fill="#ff8f00">SMA</text>

  <!-- Anten basliklari -->
  <!-- 1090 MHz ADS-B -->
  <rect x="10" y="60" width="95" height="54" rx="5" fill="#ffffff" stroke="#ff8f00" stroke-width="1.5"/>
  <text x="57" y="78" text-anchor="middle" font-size="9" font-weight="bold" fill="#ff8f00">1090 MHz Anten</text>
  <text x="57" y="92" text-anchor="middle" font-size="9" fill="#4a5a70">ADS-B dikdortgen</text>
  <text x="57" y="105" text-anchor="middle" font-size="9" fill="#4a5a70">veya kolineer</text>

  <!-- 137 QFH -->
  <rect x="120" y="60" width="95" height="54" rx="5" fill="#ffffff" stroke="#ff8f00" stroke-width="1.5"/>
  <text x="167" y="78" text-anchor="middle" font-size="9" font-weight="bold" fill="#ff8f00">137 MHz QFH</text>
  <text x="167" y="92" text-anchor="middle" font-size="9" fill="#4a5a70">NOAA/Meteor</text>
  <text x="167" y="105" text-anchor="middle" font-size="9" fill="#4a5a70">uydu V-dipol</text>

  <!-- Discone -->
  <rect x="228" y="60" width="85" height="54" rx="5" fill="#ffffff" stroke="#ff8f00" stroke-width="1.5"/>
  <text x="270" y="78" text-anchor="middle" font-size="9" font-weight="bold" fill="#ff8f00">Discone</text>
  <text x="270" y="92" text-anchor="middle" font-size="9" fill="#4a5a70">Genis bant</text>
  <text x="270" y="105" text-anchor="middle" font-size="9" fill="#4a5a70">survey</text>

  <!-- 433 dipol -->
  <rect x="326" y="60" width="85" height="54" rx="5" fill="#ffffff" stroke="#ff8f00" stroke-width="1.5"/>
  <text x="368" y="78" text-anchor="middle" font-size="9" font-weight="bold" fill="#ff8f00">433 MHz Dipol</text>
  <text x="368" y="92" text-anchor="middle" font-size="9" fill="#4a5a70">ISM / rtl_433</text>
  <text x="368" y="105" text-anchor="middle" font-size="9" fill="#4a5a70">sub-GHz</text>

  <!-- Varsayilan dipol -->
  <rect x="424" y="60" width="90" height="54" rx="5" fill="#ffffff" stroke="#6b7a90" stroke-width="1.5"/>
  <text x="469" y="78" text-anchor="middle" font-size="9" font-weight="bold" fill="#6b7a90">Teleskopik</text>
  <text x="469" y="92" text-anchor="middle" font-size="9" fill="#4a5a70">Dipol (kit)</text>
  <text x="469" y="105" text-anchor="middle" font-size="9" fill="#4a5a70">FM/VHF/UHF</text>

  <!-- Anten -> SMA oklari: her antenin SMA ucunu dongle SMA girisi bölümüne bagla -->
  <line x1="57" y1="114" x2="57" y2="136" stroke="#ff8f00" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#connp)"/>
  <line x1="167" y1="114" x2="167" y2="136" stroke="#ff8f00" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#connp)"/>
  <line x1="270" y1="114" x2="270" y2="136" stroke="#ff8f00" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#connp)"/>
  <line x1="368" y1="114" x2="368" y2="136" stroke="#ff8f00" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#connp)"/>
  <line x1="469" y1="114" x2="469" y2="136" stroke="#6b7a90" stroke-width="1.2" stroke-dasharray="4,2"/>

  <!-- LNA / Filtre ekleme noktasi -->
  <rect x="10" y="136" width="510" height="48" rx="5" fill="#ffffff" stroke="#1a8a3a" stroke-width="1.5"/>
  <text x="265" y="156" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a8a3a">LNA / BPF (Bant Geciren Filtre) Ekleme Noktasi</text>
  <text x="265" y="174" text-anchor="middle" font-size="9" fill="#4a5a70">LNA → Anten dibi + kablo arasına (kayıptan ONCE yukseltic) | BPF → LNA sonrası (paraziti kes) | Bias-tee → Pi V3/V4 ile besleme</text>

  <!-- Kalibrasyon / Adaptorler -->
  <rect x="575" y="60" width="220" height="130" rx="6" fill="#ffffff" stroke="#9fb3c8" stroke-width="1"/>
  <text x="685" y="78" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2b40">Gerekli Ekler / Notlar</text>
  <text x="585" y="98" font-size="9" fill="#4a5a70">SMA-F/MCX adaptoru (dongle girisi)</text>
  <text x="585" y="113" font-size="9" fill="#4a5a70">USB uzatma kablosu (anteni disari tasi)</text>
  <text x="585" y="128" font-size="9" fill="#4a5a70">Coax kaliteli (RG-316 veya LMR-195)</text>
  <text x="585" y="143" font-size="9" fill="#4a5a70">TCXO'lu dongle = frekans stabilitesi</text>
  <text x="585" y="158" font-size="9" fill="#4a5a70">USB hub değil — dogrudan port</text>
  <text x="585" y="173" font-size="9" fill="#4a5a70">Ferrit boncuk (USB + güç kablosu)</text>
  <text x="585" y="188" font-size="9" fill="#c0392b">V4 için rtlsdrblog çatalı sürücüsü</text>

  <!-- Projeye ozel katmanlar altta -->
  <rect x="10" y="300" width="790" height="150" rx="6" fill="#ffffff" stroke="#9fb3c8" stroke-width="1"/>
  <text x="30" y="318" font-size="11" font-weight="bold" fill="#1a2b40">Projeye Ozel Ek Donanim</text>

  <rect x="20" y="326" width="120" height="114" rx="4" fill="#f4f7fb" stroke="#d3dde8" stroke-width="1"/>
  <text x="80" y="344" text-anchor="middle" font-size="10" font-weight="bold" fill="#ff8f00">P2 ADS-B</text>
  <text x="80" y="360" text-anchor="middle" font-size="9" fill="#4a5a70">1090 anten</text>
  <text x="80" y="374" text-anchor="middle" font-size="9" fill="#4a5a70">+(opsiyonel)</text>
  <text x="80" y="388" text-anchor="middle" font-size="9" fill="#4a5a70">LNA+SAW filtre</text>

  <rect x="152" y="326" width="120" height="114" rx="4" fill="#f4f7fb" stroke="#d3dde8" stroke-width="1"/>
  <text x="212" y="344" text-anchor="middle" font-size="10" font-weight="bold" fill="#ff8f00">P3 Uydu</text>
  <text x="212" y="360" text-anchor="middle" font-size="9" fill="#4a5a70">137 MHz QFH</text>
  <text x="212" y="374" text-anchor="middle" font-size="9" fill="#4a5a70">veya V-dipol</text>
  <text x="212" y="388" text-anchor="middle" font-size="9" fill="#4a5a70">+(Gpredict)</text>

  <rect x="284" y="326" width="120" height="114" rx="4" fill="#f4f7fb" stroke="#d3dde8" stroke-width="1"/>
  <text x="344" y="344" text-anchor="middle" font-size="10" font-weight="bold" fill="#ff8f00">P7 WiFi Lab</text>
  <text x="344" y="360" text-anchor="middle" font-size="9" fill="#4a5a70">Monitor-mode</text>
  <text x="344" y="374" text-anchor="middle" font-size="9" fill="#4a5a70">WiFi adaptoru</text>
  <text x="344" y="388" text-anchor="middle" font-size="9" fill="#4a5a70">(Alfa AWUS036)</text>

  <rect x="416" y="326" width="120" height="114" rx="4" fill="#f4f7fb" stroke="#d3dde8" stroke-width="1"/>
  <text x="476" y="344" text-anchor="middle" font-size="10" font-weight="bold" fill="#ff8f00">P8 DF</text>
  <text x="476" y="360" text-anchor="middle" font-size="9" fill="#4a5a70">KrakenSDR</text>
  <text x="476" y="374" text-anchor="middle" font-size="9" fill="#4a5a70">5 kanal senkron</text>
  <text x="476" y="388" text-anchor="middle" font-size="9" fill="#4a5a70">veya 2xRTL+ref</text>

  <rect x="548" y="326" width="120" height="114" rx="4" fill="#f4f7fb" stroke="#d3dde8" stroke-width="1"/>
  <text x="608" y="344" text-anchor="middle" font-size="10" font-weight="bold" fill="#ff8f00">P5 HF/WSPR</text>
  <text x="608" y="360" text-anchor="middle" font-size="9" fill="#4a5a70">HF SDR</text>
  <text x="608" y="374" text-anchor="middle" font-size="9" fill="#4a5a70">(SDRplay/Airspy)</text>
  <text x="608" y="388" text-anchor="middle" font-size="9" fill="#4a5a70">+ uzun tel anten</text>

  <rect x="680" y="326" width="114" height="114" rx="4" fill="#f4f7fb" stroke="#d3dde8" stroke-width="1"/>
  <text x="737" y="344" text-anchor="middle" font-size="10" font-weight="bold" fill="#6b7a90">P1/P6/P9/P10</text>
  <text x="737" y="360" text-anchor="middle" font-size="9" fill="#4a5a70">Yalnizca</text>
  <text x="737" y="374" text-anchor="middle" font-size="9" fill="#4a5a70">cekirdek kit</text>
  <text x="737" y="388" text-anchor="middle" font-size="9" fill="#4a5a70">yeterli</text>
</svg>
