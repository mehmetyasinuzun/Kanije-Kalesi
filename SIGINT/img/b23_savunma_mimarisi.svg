<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" font-family="Segoe UI, Arial, sans-serif">
  <rect width="820" height="500" fill="#f4f7fb"/>
  <text x="410" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a2b40">Kablosuz Savunma Mimarisi: Katmanlar ve Saldiri Sinifi Örtüsmesi</text>

  <!-- 4 katman yatay bant (üstten alta) -->

  <!-- Katman A: İzleme/Tespit -->
  <rect x="15" y="46" width="790" height="75" rx="6" fill="#1565c0" fill-opacity="0.10" stroke="#1565c0" stroke-width="1.5"/>
  <rect x="15" y="46" width="160" height="75" rx="6" fill="#1565c0" fill-opacity="0.20"/>
  <text x="95" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">İZLEME /</text>
  <text x="95" y="95" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">TESPİT</text>
  <text x="95" y="111" text-anchor="middle" font-size="9" fill="#1565c0">WIDS / WIPS</text>

  <!-- İzleme kontroller -->
  <rect x="185" y="56" width="100" height="55" rx="5" fill="#ffffff" stroke="#1565c0" stroke-width="1"/>
  <text x="235" y="75" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565c0">WIDS</text>
  <text x="235" y="89" text-anchor="middle" font-size="9" fill="#4a5a70">Kismet</text>
  <text x="235" y="102" text-anchor="middle" font-size="9" fill="#4a5a70">Rogue AP alarm</text>

  <rect x="297" y="56" width="100" height="55" rx="5" fill="#ffffff" stroke="#1565c0" stroke-width="1"/>
  <text x="347" y="75" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565c0">Spektrum</text>
  <text x="347" y="89" text-anchor="middle" font-size="9" fill="#4a5a70">İzleme</text>
  <text x="347" y="102" text-anchor="middle" font-size="9" fill="#4a5a70">Gürültü taban</text>

  <rect x="409" y="56" width="100" height="55" rx="5" fill="#ffffff" stroke="#1565c0" stroke-width="1"/>
  <text x="459" y="75" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565c0">Anomali</text>
  <text x="459" y="89" text-anchor="middle" font-size="9" fill="#4a5a70">Tespiti</text>
  <text x="459" y="102" text-anchor="middle" font-size="9" fill="#4a5a70">Trafik baseline</text>

  <rect x="521" y="56" width="100" height="55" rx="5" fill="#ffffff" stroke="#1565c0" stroke-width="1"/>
  <text x="571" y="75" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565c0">İstemci</text>
  <text x="571" y="89" text-anchor="middle" font-size="9" fill="#4a5a70">Envanteri</text>
  <text x="571" y="102" text-anchor="middle" font-size="9" fill="#4a5a70">MAC/cihaz kayıt</text>

  <!-- Saldiri sinifi etiket (sag) -->
  <text x="710" y="72" text-anchor="middle" font-size="9" fill="#1565c0">Hedeflenen saldiri sinifi:</text>
  <text x="710" y="85" text-anchor="middle" font-size="9" font-weight="bold" fill="#1565c0">Tüm siniflar görünür</text>
  <text x="710" y="98" text-anchor="middle" font-size="9" fill="#1565c0">Rogue AP, deauth, yeni cihaz</text>
  <text x="710" y="111" text-anchor="middle" font-size="9" fill="#1565c0">Kariştirma alarmı</text>

  <!-- Katman B: Kimlik/Sifreleme -->
  <rect x="15" y="133" width="790" height="85" rx="6" fill="#c0392b" fill-opacity="0.08" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="15" y="133" width="160" height="85" rx="6" fill="#c0392b" fill-opacity="0.18"/>
  <text x="95" y="166" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">KİMLİK /</text>
  <text x="95" y="181" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">SİFRELEME</text>
  <text x="95" y="196" text-anchor="middle" font-size="9" fill="#c0392b">WPA3 / 802.1X</text>
  <text x="95" y="209" text-anchor="middle" font-size="9" fill="#c0392b">PMF / EAP</text>

  <rect x="185" y="143" width="100" height="65" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="235" y="162" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">WPA3-SAE</text>
  <text x="235" y="176" text-anchor="middle" font-size="9" fill="#4a5a70">Çevrimdışı</text>
  <text x="235" y="189" text-anchor="middle" font-size="9" fill="#4a5a70">tahmine direnc</text>
  <text x="235" y="200" text-anchor="middle" font-size="9" fill="#6b7a90">Erisim sinifi</text>

  <rect x="297" y="143" width="100" height="65" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="347" y="162" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">802.11w</text>
  <text x="347" y="176" text-anchor="middle" font-size="9" fill="#4a5a70">PMF — yönetim</text>
  <text x="347" y="189" text-anchor="middle" font-size="9" fill="#4a5a70">çerçeve koruma</text>
  <text x="347" y="200" text-anchor="middle" font-size="9" fill="#6b7a90">Deauth DoS sinifi</text>

  <rect x="409" y="143" width="100" height="65" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="459" y="162" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">802.1X / EAP</text>
  <text x="459" y="176" text-anchor="middle" font-size="9" fill="#4a5a70">Karsilikli</text>
  <text x="459" y="189" text-anchor="middle" font-size="9" fill="#4a5a70">dogrulama</text>
  <text x="459" y="200" text-anchor="middle" font-size="9" fill="#6b7a90">Evil twin / MitM</text>

  <rect x="521" y="143" width="100" height="65" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="571" y="162" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">Sertifika</text>
  <text x="571" y="176" text-anchor="middle" font-size="9" fill="#4a5a70">Dogrulama /</text>
  <text x="571" y="189" text-anchor="middle" font-size="9" fill="#4a5a70">HSTS</text>
  <text x="571" y="200" text-anchor="middle" font-size="9" fill="#6b7a90">SSL stripping</text>

  <text x="710" y="165" text-anchor="middle" font-size="9" fill="#c0392b">Hedeflenen sinif:</text>
  <text x="710" y="178" text-anchor="middle" font-size="9" font-weight="bold" fill="#c0392b">Erisim + Kimlik + Gizlilik</text>
  <text x="710" y="191" text-anchor="middle" font-size="9" fill="#c0392b">WPA3: parola zaafı</text>
  <text x="710" y="204" text-anchor="middle" font-size="9" fill="#c0392b">PMF: deauth DoS</text>
  <text x="710" y="217" text-anchor="middle" font-size="9" fill="#c0392b">EAP: evil twin/rogue</text>

  <!-- Katman C: Ag Kontrol -->
  <rect x="15" y="230" width="790" height="85" rx="6" fill="#ff8f00" fill-opacity="0.08" stroke="#ff8f00" stroke-width="1.5"/>
  <rect x="15" y="230" width="160" height="85" rx="6" fill="#ff8f00" fill-opacity="0.18"/>
  <text x="95" y="263" text-anchor="middle" font-size="11" font-weight="bold" fill="#b36200">AG KONTROL</text>
  <text x="95" y="278" text-anchor="middle" font-size="11" font-weight="bold" fill="#b36200">KATMANI</text>
  <text x="95" y="293" text-anchor="middle" font-size="9" fill="#b36200">DHCP/ARP</text>
  <text x="95" y="306" text-anchor="middle" font-size="9" fill="#b36200">Segmentasyon</text>

  <rect x="185" y="240" width="100" height="65" rx="5" fill="#ffffff" stroke="#ff8f00" stroke-width="1"/>
  <text x="235" y="260" text-anchor="middle" font-size="10" font-weight="bold" fill="#b36200">DHCP</text>
  <text x="235" y="274" text-anchor="middle" font-size="9" fill="#4a5a70">Snooping</text>
  <text x="235" y="287" text-anchor="middle" font-size="9" fill="#4a5a70">Güvenilir port</text>
  <text x="235" y="298" text-anchor="middle" font-size="9" fill="#6b7a90">DHCP tüketme</text>

  <rect x="297" y="240" width="100" height="65" rx="5" fill="#ffffff" stroke="#ff8f00" stroke-width="1"/>
  <text x="347" y="260" text-anchor="middle" font-size="10" font-weight="bold" fill="#b36200">DAI</text>
  <text x="347" y="274" text-anchor="middle" font-size="9" fill="#4a5a70">Dinamik ARP</text>
  <text x="347" y="287" text-anchor="middle" font-size="9" fill="#4a5a70">İnceleme</text>
  <text x="347" y="298" text-anchor="middle" font-size="9" fill="#6b7a90">ARP sel/zehir</text>

  <rect x="409" y="240" width="100" height="65" rx="5" fill="#ffffff" stroke="#ff8f00" stroke-width="1"/>
  <text x="459" y="260" text-anchor="middle" font-size="10" font-weight="bold" fill="#b36200">Oran</text>
  <text x="459" y="274" text-anchor="middle" font-size="9" fill="#4a5a70">Sınırlama</text>
  <text x="459" y="287" text-anchor="middle" font-size="9" fill="#4a5a70">Port güvenligi</text>
  <text x="459" y="298" text-anchor="middle" font-size="9" fill="#6b7a90">Tablo doldurma</text>

  <rect x="521" y="240" width="100" height="65" rx="5" fill="#ffffff" stroke="#ff8f00" stroke-width="1"/>
  <text x="571" y="260" text-anchor="middle" font-size="10" font-weight="bold" fill="#b36200">Segmentasyon</text>
  <text x="571" y="274" text-anchor="middle" font-size="9" fill="#4a5a70">IoT / misafir</text>
  <text x="571" y="287" text-anchor="middle" font-size="9" fill="#4a5a70">ayrı ag</text>
  <text x="571" y="298" text-anchor="middle" font-size="9" fill="#6b7a90">Yanal hareket</text>

  <text x="710" y="260" text-anchor="middle" font-size="9" fill="#b36200">Hedeflenen sinif:</text>
  <text x="710" y="273" text-anchor="middle" font-size="9" font-weight="bold" fill="#b36200">Erisilebilirlik (ag katmanı)</text>
  <text x="710" y="286" text-anchor="middle" font-size="9" fill="#b36200">DHCP/ARP tüketme</text>
  <text x="710" y="299" text-anchor="middle" font-size="9" fill="#b36200">Botnet yanal hareket</text>
  <text x="710" y="312" text-anchor="middle" font-size="9" fill="#b36200">Kota kötüye kullanımı</text>

  <!-- Katman D: Sıfır-Güven/Uygulama -->
  <rect x="15" y="327" width="790" height="80" rx="6" fill="#1a8a3a" fill-opacity="0.08" stroke="#1a8a3a" stroke-width="1.5"/>
  <rect x="15" y="327" width="160" height="80" rx="6" fill="#1a8a3a" fill-opacity="0.18"/>
  <text x="95" y="358" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a8a3a">SIFIR-GÜVEN /</text>
  <text x="95" y="373" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a8a3a">UYGULAMA</text>
  <text x="95" y="388" text-anchor="middle" font-size="9" fill="#1a8a3a">En az ayrıcalık</text>
  <text x="95" y="401" text-anchor="middle" font-size="9" fill="#1a8a3a">Uçtan uca güven</text>

  <rect x="185" y="337" width="100" height="60" rx="5" fill="#ffffff" stroke="#1a8a3a" stroke-width="1"/>
  <text x="235" y="356" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a8a3a">VPN</text>
  <text x="235" y="370" text-anchor="middle" font-size="9" fill="#4a5a70">Uçtan uca tünel</text>
  <text x="235" y="383" text-anchor="middle" font-size="9" fill="#6b7a90">MitM / dinleme</text>

  <rect x="297" y="337" width="100" height="60" rx="5" fill="#ffffff" stroke="#1a8a3a" stroke-width="1"/>
  <text x="347" y="356" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a8a3a">TLS + HSTS</text>
  <text x="347" y="370" text-anchor="middle" font-size="9" fill="#4a5a70">Sertifika sabitle</text>
  <text x="347" y="383" text-anchor="middle" font-size="9" fill="#6b7a90">SSL stripping</text>

  <rect x="409" y="337" width="100" height="60" rx="5" fill="#ffffff" stroke="#1a8a3a" stroke-width="1"/>
  <text x="459" y="356" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a8a3a">En Az</text>
  <text x="459" y="370" text-anchor="middle" font-size="9" fill="#4a5a70">Ayrıcalık</text>
  <text x="459" y="383" text-anchor="middle" font-size="9" fill="#6b7a90">Tüm siniflar</text>

  <rect x="521" y="337" width="100" height="60" rx="5" fill="#ffffff" stroke="#1a8a3a" stroke-width="1"/>
  <text x="571" y="356" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a8a3a">Sifir Güven</text>
  <text x="571" y="370" text-anchor="middle" font-size="9" fill="#4a5a70">"Dogrulanana</text>
  <text x="571" y="383" text-anchor="middle" font-size="9" fill="#4a5a70">kadar güvensiz"</text>

  <text x="710" y="360" text-anchor="middle" font-size="9" fill="#1a8a3a">Hedeflenen sinif:</text>
  <text x="710" y="373" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a8a3a">Tüm siniflar (genel)</text>
  <text x="710" y="386" text-anchor="middle" font-size="9" fill="#1a8a3a">MitM/spoofing/evil twin</text>
  <text x="710" y="399" text-anchor="middle" font-size="9" fill="#1a8a3a">Içerik dinleme</text>

  <!-- Defense in depth oku (sol kenar) -->
  <line x1="8" y1="420" x2="8" y2="55" stroke="#1a2b40" stroke-width="1.5"/>
  <polygon points="8,55 4,68 12,68" fill="#1a2b40"/>
  <text x="5" y="250" text-anchor="middle" font-size="9" fill="#4a5a70" transform="rotate(-90,5,250)">Defense in Depth (Derinlemenine Savunma)</text>

  <!-- Alt not -->
  <rect x="15" y="422" width="790" height="58" rx="6" fill="#ffffff" stroke="#d3dde8" stroke-width="1"/>
  <text x="410" y="440" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2b40">Savunma Gücü: Derinlemenine Katmanlar (Defense in Depth)</text>
  <text x="410" y="456" text-anchor="middle" font-size="9" fill="#4a5a70">Hiçbir tek kontrol her saldirıyı durdurmaz. WPA3 (erisim) + PMF (deauth DoS) + DHCP snooping (ag katmanı) + sıfır-güven (genel):</text>
  <text x="410" y="470" text-anchor="middle" font-size="9" fill="#4a5a70">Saldırganın her halkayı ayrı ayrı asması gerekir → asimetri savunmacı lehine döner.</text>

  <line x1="10" y1="491" x2="810" y2="491" stroke="#d3dde8" stroke-width="1"/>
  <text x="410" y="489" text-anchor="middle" font-size="9" fill="#7a8aa0">SIGINT El Kitabı — Bölüm 23: Tespit ve Savunma Mimarisi</text>
</svg>
