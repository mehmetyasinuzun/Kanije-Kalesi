      <circle cx="621" cy="114" r="2.4"/><circle cx="628" cy="121" r="2.4"/><circle cx="620" cy="123" r="2.4"/><circle cx="627" cy="111" r="2.4"/><circle cx="623" cy="125" r="2.4"/><circle cx="630" cy="116" r="2.4"/>

      <circle cx="513" cy="185" r="2.4"/><circle cx="520" cy="193" r="2.4"/><circle cx="511" cy="194" r="2.4"/><circle cx="519" cy="183" r="2.4"/><circle cx="516" cy="197" r="2.4"/><circle cx="509" cy="187" r="2.4"/>
      <circle cx="549" cy="186" r="2.4"/><circle cx="556" cy="192" r="2.4"/><circle cx="548" cy="195" r="2.4"/><circle cx="555" cy="184" r="2.4"/><circle cx="551" cy="196" r="2.4"/><circle cx="558" cy="188" r="2.4"/>
      <circle cx="585" cy="185" r="2.4"/><circle cx="592" cy="193" r="2.4"/><circle cx="584" cy="194" r="2.4"/><circle cx="591" cy="182" r="2.4"/><circle cx="588" cy="198" r="2.4"/><circle cx="582" cy="187" r="2.4"/>
      <circle cx="621" cy="186" r="2.4"/><circle cx="628" cy="193" r="2.4"/><circle cx="620" cy="195" r="2.4"/><circle cx="627" cy="183" r="2.4"/><circle cx="623" cy="197" r="2.4"/><circle cx="630" cy="188" r="2.4"/>

      <circle cx="513" cy="257" r="2.4"/><circle cx="520" cy="265" r="2.4"/><circle cx="511" cy="266" r="2.4"/><circle cx="519" cy="255" r="2.4"/><circle cx="516" cy="269" r="2.4"/><circle cx="509" cy="259" r="2.4"/>
      <circle cx="549" cy="258" r="2.4"/><circle cx="556" cy="264" r="2.4"/><circle cx="548" cy="267" r="2.4"/><circle cx="555" cy="256" r="2.4"/><circle cx="551" cy="268" r="2.4"/><circle cx="558" cy="260" r="2.4"/>
      <circle cx="585" cy="257" r="2.4"/><circle cx="592" cy="265" r="2.4"/><circle cx="584" cy="266" r="2.4"/><circle cx="591" cy="254" r="2.4"/><circle cx="588" cy="270" r="2.4"/><circle cx="582" cy="259" r="2.4"/>
      <circle cx="621" cy="258" r="2.4"/><circle cx="628" cy="265" r="2.4"/><circle cx="620" cy="267" r="2.4"/><circle cx="627" cy="255" r="2.4"/><circle cx="623" cy="269" r="2.4"/><circle cx="630" cy="260" r="2.4"/>

      <circle cx="513" cy="329" r="2.4"/><circle cx="520" cy="337" r="2.4"/><circle cx="511" cy="338" r="2.4"/><circle cx="519" cy="327" r="2.4"/><circle cx="516" cy="341" r="2.4"/><circle cx="509" cy="331" r="2.4"/>
      <circle cx="549" cy="330" r="2.4"/><circle cx="556" cy="336" r="2.4"/><circle cx="548" cy="339" r="2.4"/><circle cx="555" cy="328" r="2.4"/><circle cx="551" cy="340" r="2.4"/><circle cx="558" cy="332" r="2.4"/>
      <circle cx="585" cy="329" r="2.4"/><circle cx="592" cy="337" r="2.4"/><circle cx="584" cy="338" r="2.4"/><circle cx="591" cy="326" r="2.4"/><circle cx="588" cy="342" r="2.4"/><circle cx="582" cy="331" r="2.4"/>
      <circle cx="621" cy="330" r="2.4"/><circle cx="628" cy="337" r="2.4"/><circle cx="620" cy="339" r="2.4"/><circle cx="627" cy="327" r="2.4"/><circle cx="623" cy="341" r="2.4"/><circle cx="630" cy="332" r="2.4"/>
