<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="420" fill="#f5f8fc"/>
  <text x="380" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a2b40">16-QAM I/Q Takimyildizi: SNR Etkisi</text>

  <!-- ===== SOL PANEL: yuksek SNR ===== -->
  <g>
    <rect x="30" y="55" width="320" height="320" fill="#ffffff" stroke="#9fb3c8" stroke-width="1"/>
    <text x="190" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a6e2e">16-QAM (yuksek SNR)</text>

    <!-- eksenler: merkez (190,225) -->
    <line x1="50" y1="225" x2="330" y2="225" stroke="#7a8aa0" stroke-width="1.2"/>
    <line x1="190" y1="95" x2="190" y2="355" stroke="#7a8aa0" stroke-width="1.2"/>
    <polygon points="330,225 322,221 322,229" fill="#7a8aa0"/>
    <polygon points="190,95 186,103 194,103" fill="#7a8aa0"/>
    <text x="338" y="222" font-size="13" fill="#36506e" font-style="italic">I</text>
    <text x="197" y="105" font-size="13" fill="#36506e" font-style="italic">Q</text>

    <!-- 4x4 keskin noktalar: konumlar -3,-1,1,3 -> piksel adimi 36 -->
    <g fill="#1565c0">
      <!-- satir +3 (y=117) --><circle cx="136" cy="117" r="4.5"/><circle cx="172" cy="117" r="4.5"/><circle cx="208" cy="117" r="4.5"/><circle cx="244" cy="117" r="4.5"/>
      <!-- satir +1 (y=189) --><circle cx="136" cy="189" r="4.5"/><circle cx="172" cy="189" r="4.5"/><circle cx="208" cy="189" r="4.5"/><circle cx="244" cy="189" r="4.5"/>
      <!-- satir -1 (y=261) --><circle cx="136" cy="261" r="4.5"/><circle cx="172" cy="261" r="4.5"/><circle cx="208" cy="261" r="4.5"/><circle cx="244" cy="261" r="4.5"/>
      <!-- satir -3 (y=333) --><circle cx="136" cy="333" r="4.5"/><circle cx="172" cy="333" r="4.5"/><circle cx="208" cy="333" r="4.5"/><circle cx="244" cy="333" r="4.5"/>
    </g>
    <text x="190" y="368" text-anchor="middle" font-size="11.5" fill="#4a5a70">16 nokta ayrik, karar bolgeleri net</text>
  </g>

  <!-- ===== SAG PANEL: dusuk SNR ===== -->
  <g>
    <rect x="410" y="55" width="320" height="320" fill="#ffffff" stroke="#9fb3c8" stroke-width="1"/>
    <text x="570" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#a3361b">16-QAM (dusuk SNR)</text>

