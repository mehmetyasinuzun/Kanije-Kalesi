    <line x1="570" y1="95" x2="570" y2="355" stroke="#7a8aa0" stroke-width="1.2"/>
    <polygon points="710,225 702,221 702,229" fill="#7a8aa0"/>
    <polygon points="570,95 566,103 574,103" fill="#7a8aa0"/>
    <text x="718" y="222" font-size="13" fill="#36506e" font-style="italic">I</text>
    <text x="577" y="105" font-size="13" fill="#36506e" font-style="italic">Q</text>

    <!-- ayni 16 merkez (offset +380), her merkez etrafinda gurultu bulutu -->
    <!-- merkez ideal noktalar soluk -->
    <g fill="#e0a89a">
      <circle cx="516" cy="117" r="2"/><circle cx="552" cy="117" r="2"/><circle cx="588" cy="117" r="2"/><circle cx="624" cy="117" r="2"/>
