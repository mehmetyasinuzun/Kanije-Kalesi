<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" font-family="Segoe UI, Arial, sans-serif">
  <!-- Zemin -->
  <rect x="0" y="0" width="860" height="480" fill="#f4f7fb"/>
  <!-- Baslik -->
  <text x="430" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a2b40">TDOA — Varis Zamani Farki ile Hiperbolik Konumlandirma</text>
  <!-- Panel arka plan -->
  <rect x="20" y="44" width="820" height="422" fill="#ffffff" stroke="#9fb3c8" stroke-width="1" rx="3"/>

  <!-- Koordinat ekseni cizgileri (hafif) -->
  <line x1="40" y1="255" x2="840" y2="255" stroke="#d3dde8" stroke-width="1"/>
  <line x1="430" y1="60" x2="430" y2="450" stroke="#d3dde8" stroke-width="1"/>

  <!-- Ok tanimlari -->
  <defs>
    <marker id="arrowB" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#1565c0"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#c0392b"/>
    </marker>
    <marker id="arrowG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#1a8a3a"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#6b7a90"/>
    </marker>
  </defs>

  <!-- ===== ALICI NOKTALARI ===== -->
  <!-- A: sol alt -->
  <circle cx="160" cy="380" r="9" fill="#1565c0"/>
  <text x="137" y="376" font-size="13" font-weight="bold" fill="#1565c0">A</text>
  <text x="122" y="392" font-size="10" fill="#4a5a70">(0, 0)</text>

  <!-- B: sag alt -->
  <circle cx="680" cy="380" r="9" fill="#1565c0"/>
  <text x="691" y="376" font-size="13" font-weight="bold" fill="#1565c0">B</text>
  <text x="688" y="392" font-size="10" fill="#4a5a70">(8, 0)</text>

  <!-- C: ust orta -->
  <circle cx="430" cy="105" r="9" fill="#1565c0"/>
  <text x="441" y="101" font-size="13" font-weight="bold" fill="#1565c0">C</text>
  <text x="441" y="117" font-size="10" fill="#4a5a70">(4, 5)</text>

  <!-- ===== HIPERBOL A-B (kirmizi) ===== -->
  <!-- |SA| - |SB| = sabit = delta_AB -->
  <!-- Kaynak S yaklasik (4.8, 2.5) olsun, delta_AB = -2 birim -->
  <!-- Hiperbol A-B: odaklar A(0,0) B(8,0), |PA|-|PB|= sabit -->
  <!-- Sagdan bakan kol (kaynak A'ya yakin) -->
  <path d="M 248 90 C 260 130, 270 180, 272 220 C 273 250, 268 290, 260 340 C 255 360, 248 390, 235 420"
        fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <!-- Sol kol (B'ye yakin) -->
  <path d="M 640 90 C 628 130, 618 180, 616 220 C 615 250, 620 290, 628 340 C 633 360, 640 390, 653 420"
        fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6,4"/>
  <!-- Etiket A-B kirmizi -->
  <text x="218" y="200" font-size="11" font-weight="bold" fill="#c0392b">Hiperbol</text>
  <text x="218" y="215" font-size="11" font-weight="bold" fill="#c0392b">A-B</text>
  <text x="218" y="230" font-size="10" fill="#c0392b">|SA|-|SB|=&#x394;d</text>

  <!-- ===== HIPERBOL A-C (yesil) ===== -->
  <!-- Odaklar A(0,0) C(4,5), kaynak tarafinda -->
  <path d="M 460 430 C 450 400, 438 370, 430 345 C 423 322, 418 295, 415 268 C 412 240, 412 210, 415 182 C 418 158, 424 132, 433 108"
        fill="none" stroke="#1a8a3a" stroke-width="2.5"/>
  <!-- Diger kol (kesikli) -->
  <path d="M 220 430 C 228 405, 242 375, 255 350 C 265 328, 276 300, 288 270 C 298 243, 312 212, 330 182 C 342 160, 360 130, 383 108"
        fill="none" stroke="#1a8a3a" stroke-width="2.5" stroke-dasharray="6,4"/>
  <!-- Etiket A-C yesil -->
  <text x="468" y="350" font-size="11" font-weight="bold" fill="#1a8a3a">Hiperbol</text>
  <text x="468" y="365" font-size="11" font-weight="bold" fill="#1a8a3a">A-C</text>
  <text x="468" y="380" font-size="10" fill="#1a8a3a">|SA|-|SC|=&#x394;d'</text>

  <!-- ===== KAYNAK NOKTASI ===== -->
  <!-- Kesisim noktasi ~(4.8, 2.5) normalize -> piksel ~(456, 255) -->
  <circle cx="456" cy="248" r="10" fill="#ff8f00" stroke="#1a2b40" stroke-width="1.5"/>
  <text x="468" y="243" font-size="12" font-weight="bold" fill="#1a2b40">S</text>
  <text x="468" y="258" font-size="10" fill="#4a5a70">KAYNAK</text>
  <text x="468" y="271" font-size="10" fill="#4a5a70">(kesisim)</text>

  <!-- ===== HATA ELIPSI ===== -->
  <ellipse cx="456" cy="248" rx="28" ry="18" fill="none" stroke="#ff8f00" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.8"/>
  <text x="492" y="262" font-size="10" fill="#ff8f00">hata elipsi</text>

  <!-- ===== MESAFE CIZGILERI (ok ile) ===== -->
  <line x1="164" y1="374" x2="448" y2="256" stroke="#6b7a90" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrowGray)"/>
  <text x="275" y="300" font-size="10" fill="#6b7a90">|SA|</text>

  <line x1="673" y1="374" x2="464" y2="256" stroke="#6b7a90" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrowGray)"/>
  <text x="578" y="298" font-size="10" fill="#6b7a90">|SB|</text>

  <line x1="430" y1="114" x2="456" y2="239" stroke="#6b7a90" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrowGray)"/>
  <text x="442" y="182" font-size="10" fill="#6b7a90">|SC|</text>

  <!-- ===== ALTI PANEL: FORMUL ACIKLAMASI ===== -->
  <rect x="40" y="428" width="780" height="30" fill="#f4f7fb" rx="2"/>
  <text x="55" y="447" font-size="11" fill="#1a2b40" font-weight="bold">TDOA prensibi:</text>
  <text x="160" y="447" font-size="11" fill="#36506e">&#x394;t&#x2090;&#x2083; = (|SA|&#x2212;|SB|)/c   &#x2192;   |SA|&#x2212;|SB| = c&#xB7;&#x394;t = sabit  &#x2192;  <tspan font-weight="bold">Hiperbol</tspan> (A,B odak).  2 hiperbol kesisince KAYNAK belirlenir.</text>

  <!-- Baslik cizgisi -->
  <line x1="20" y1="38" x2="840" y2="38" stroke="#9fb3c8" stroke-width="0.8"/>

  <!-- Alici label cerceve -->
  <rect x="30" y="56" width="132" height="62" fill="#f4f7fb" stroke="#9fb3c8" stroke-width="1" rx="2"/>
  <text x="40" y="73" font-size="11" font-weight="bold" fill="#1a2b40">Alicilar</text>
  <circle cx="52" cy="88" r="5" fill="#1565c0"/>
  <text x="62" y="92" font-size="11" fill="#4a5a70">A, B, C</text>
  <circle cx="52" cy="106" r="7" fill="#ff8f00" stroke="#1a2b40" stroke-width="1"/>
  <text x="62" y="110" font-size="11" fill="#4a5a70">S = kaynak</text>

  <!-- Hiperbol aciklamasi cerceve -->
  <rect x="170" y="56" width="165" height="62" fill="#f4f7fb" stroke="#9fb3c8" stroke-width="1" rx="2"/>
  <line x1="180" y1="73" x2="200" y2="73" stroke="#c0392b" stroke-width="2.5"/>
  <text x="207" y="77" font-size="11" fill="#4a5a70">Hiperbol A-B (kirmizi)</text>
  <line x1="180" y1="91" x2="200" y2="91" stroke="#1a8a3a" stroke-width="2.5"/>
  <text x="207" y="95" font-size="11" fill="#4a5a70">Hiperbol A-C (yesil)</text>
  <line x1="180" y1="109" x2="200" y2="109" stroke="#ff8f00" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="207" y="113" font-size="11" fill="#4a5a70">Hata elipsi</text>

  <!-- Senkronizasyon notu -->
  <rect x="560" y="56" width="272" height="62" fill="#f4f7fb" stroke="#9fb3c8" stroke-width="1" rx="2"/>
  <text x="572" y="73" font-size="11" font-weight="bold" fill="#1a2b40">Senkronizasyon esigi</text>
  <text x="572" y="89" font-size="10" fill="#36506e">1 ns hata &#x2248; 0,3 m konum hatasi</text>
  <text x="572" y="104" font-size="10" fill="#36506e">Genis bantli sinyal = keskin korelasyon</text>
  <text x="572" y="118" font-size="10" fill="#36506e">= daha iyi &#x394;t &#x2192; daha kucuk hata elipsi</text>
</svg>
