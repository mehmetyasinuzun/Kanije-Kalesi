<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" font-family="Segoe UI, Arial, sans-serif">
  <rect width="860" height="500" fill="#f4f7fb"/>
  <text x="430" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a2b40">Saldiri Vektörü Taksonomisi: Bes Ana Kol + Birincil Savunma</text>

  <!-- Merkez dugüm -->
  <rect x="355" y="55" width="150" height="52" rx="8" fill="#1a2b40" stroke="#0d1f33" stroke-width="1.5"/>
  <text x="430" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Kablosuz</text>
  <text x="430" y="92" text-anchor="middle" font-size="11" fill="#9fb3c8">Saldiri Yüzeyi</text>

  <!-- 5 kol çizgileri -->
  <!-- Sol üst: Erisim -->
  <line x1="370" y1="75" x2="150" y2="142" stroke="#9fb3c8" stroke-width="1.5"/>
  <!-- Sag üst: Gizlilik -->
  <line x1="490" y1="75" x2="710" y2="142" stroke="#9fb3c8" stroke-width="1.5"/>
  <!-- Sol orta: Butünlük -->
  <line x1="365" y1="107" x2="95" y2="255" stroke="#9fb3c8" stroke-width="1.5"/>
  <!-- Sag orta: Kimlik -->
  <line x1="495" y1="107" x2="765" y2="255" stroke="#9fb3c8" stroke-width="1.5"/>
  <!-- Alt orta: Erisilebilirlik -->
  <line x1="430" y1="107" x2="430" y2="192" stroke="#9fb3c8" stroke-width="1.5"/>

  <!-- KOL 1: ERİSİM (sol üst) -->
  <rect x="55" y="142" width="190" height="100" rx="7" fill="#c0392b" fill-opacity="0.12" stroke="#c0392b" stroke-width="1.5"/>
  <text x="150" y="163" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">ERİSİM</text>
  <text x="150" y="179" text-anchor="middle" font-size="9" fill="#4a5a70">Yetkisiz WiFi baglanma</text>
  <text x="150" y="192" text-anchor="middle" font-size="9" fill="#4a5a70">Parola zaafı istismarı</text>
  <text x="150" y="205" text-anchor="middle" font-size="9" fill="#4a5a70">Açık ag sızma</text>
  <line x1="65" y1="215" x2="235" y2="215" stroke="#d3dde8" stroke-width="1"/>
  <text x="150" y="228" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a8a3a">Savunma: WPA3-SAE + güçlü parola</text>
  <text x="150" y="240" text-anchor="middle" font-size="9" fill="#1a8a3a">+ istemci envanteri + kota izleme</text>

  <!-- KOL 2: GİZLİLİK (sag üst) -->
  <rect x="615" y="142" width="190" height="100" rx="7" fill="#1565c0" fill-opacity="0.12" stroke="#1565c0" stroke-width="1.5"/>
  <text x="710" y="163" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">GİZLİLİK</text>
  <text x="710" y="179" text-anchor="middle" font-size="9" fill="#4a5a70">Pasif dinleme</text>
  <text x="710" y="192" text-anchor="middle" font-size="9" fill="#4a5a70">El-sıksma yakalama</text>
  <text x="710" y="205" text-anchor="middle" font-size="9" fill="#4a5a70">MitM trafik okuma</text>
  <line x1="625" y1="215" x2="795" y2="215" stroke="#d3dde8" stroke-width="1"/>
  <text x="710" y="228" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a8a3a">Savunma: WPA3 + TLS uçtan uca</text>
  <text x="710" y="240" text-anchor="middle" font-size="9" fill="#1a8a3a">+ VPN + sertifika dogrulama</text>

  <!-- KOL 3: BÜTÜNLÜK (sol orta) -->
  <rect x="15" y="255" width="160" height="105" rx="7" fill="#ff8f00" fill-opacity="0.12" stroke="#ff8f00" stroke-width="1.5"/>
  <text x="95" y="276" text-anchor="middle" font-size="12" font-weight="bold" fill="#b36200">BÜTÜNLÜK</text>
  <text x="95" y="292" text-anchor="middle" font-size="9" fill="#4a5a70">Paket enjeksiyonu</text>
  <text x="95" y="305" text-anchor="middle" font-size="9" fill="#4a5a70">Replay (tekrar)</text>
  <text x="95" y="318" text-anchor="middle" font-size="9" fill="#4a5a70">İçerik degistirme</text>
  <line x1="25" y1="328" x2="165" y2="328" stroke="#d3dde8" stroke-width="1"/>
  <text x="95" y="341" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a8a3a">Savunma: MIC + nonce</text>
  <text x="95" y="354" text-anchor="middle" font-size="9" fill="#1a8a3a">+ sayaç + sifreleme</text>

  <!-- KOL 4: KİMLİK (sag orta) -->
  <rect x="685" y="255" width="160" height="105" rx="7" fill="#1a8a3a" fill-opacity="0.12" stroke="#1a8a3a" stroke-width="1.5"/>
  <text x="765" y="276" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a8a3a">KİMLİK</text>
  <text x="765" y="292" text-anchor="middle" font-size="9" fill="#4a5a70">Evil twin / Rogue AP</text>
  <text x="765" y="305" text-anchor="middle" font-size="9" fill="#4a5a70">MAC / SSID spoofing</text>
  <text x="765" y="318" text-anchor="middle" font-size="9" fill="#4a5a70">Sahte baz istasyonu</text>
  <line x1="695" y1="328" x2="835" y2="328" stroke="#d3dde8" stroke-width="1"/>
  <text x="765" y="341" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a8a3a">Savunma: 802.1X karsilikli</text>
  <text x="765" y="354" text-anchor="middle" font-size="9" fill="#1a8a3a">dogrulama + PMF + VPN</text>

  <!-- KOL 5: ERİSİLEBİLİRLİK (alt orta) - genis -->
  <rect x="260" y="192" width="340" height="120" rx="7" fill="#6b7a90" fill-opacity="0.12" stroke="#6b7a90" stroke-width="1.5"/>
  <text x="430" y="213" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a6b80">ERİSİLEBİLİRLİK (DoS)</text>
  <text x="320" y="230" text-anchor="middle" font-size="9" fill="#4a5a70">Deauth/disassoc seli</text>
  <text x="320" y="243" text-anchor="middle" font-size="9" fill="#4a5a70">RF kariştirma</text>
  <text x="320" y="256" text-anchor="middle" font-size="9" fill="#4a5a70">DHCP havuzu tüketme</text>
  <text x="540" y="230" text-anchor="middle" font-size="9" fill="#4a5a70">Uyku yoksunlugu (IoT)</text>
  <text x="540" y="243" text-anchor="middle" font-size="9" fill="#4a5a70">Kota/bulut tüketme</text>
  <text x="540" y="256" text-anchor="middle" font-size="9" fill="#4a5a70">ARP / tablo doldurma</text>
  <line x1="270" y1="266" x2="590" y2="266" stroke="#d3dde8" stroke-width="1"/>
  <text x="430" y="280" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a8a3a">Savunma: 802.11w/PMF + DHCP snooping</text>
  <text x="430" y="293" text-anchor="middle" font-size="9" fill="#1a8a3a">+ oran sınırlama + segmentasyon + izleme</text>
  <text x="430" y="306" text-anchor="middle" font-size="9" fill="#1a8a3a">Kariştirma: spektrum izleme + yetkili otoriteye bildir (yasal sinir)</text>

  <!-- Savunma katmanlari tablosu (alt) -->
  <rect x="15" y="385" width="830" height="95" rx="6" fill="#ffffff" stroke="#9fb3c8" stroke-width="1"/>
  <text x="430" y="403" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2b40">Üç-Eksen Sınıflandırma: Her Saldiri Bir Koordinattır</text>
  <line x1="25" y1="410" x2="835" y2="410" stroke="#d3dde8" stroke-width="1"/>

  <!-- 3 sütun -->
  <text x="175" y="425" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565c0">Hedef Ekseni (ne bozulur)</text>
  <text x="175" y="439" text-anchor="middle" font-size="9" fill="#4a5a70">Erisim · Gizlilik · Bütünlük</text>
  <text x="175" y="452" text-anchor="middle" font-size="9" fill="#4a5a70">Erisilebilirlik · Kimlik</text>
  <text x="175" y="465" text-anchor="middle" font-size="9" fill="#6b7a90">BESINF eksenin dogal çıkarımıdır</text>

  <line x1="360" y1="415" x2="360" y2="475" stroke="#d3dde8" stroke-width="1"/>
  <text x="505" y="425" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">Zincir Ekseni (hangi asama)</text>
  <text x="505" y="439" text-anchor="middle" font-size="9" fill="#4a5a70">Kesif → Erisim → Kalıcılık</text>
  <text x="505" y="452" text-anchor="middle" font-size="9" fill="#4a5a70">→ Amaç (DoS/MitM/veri)</text>
  <text x="505" y="465" text-anchor="middle" font-size="9" fill="#6b7a90">Savunma zinciri solda keser</text>

  <line x1="650" y1="415" x2="650" y2="475" stroke="#d3dde8" stroke-width="1"/>
  <text x="745" y="425" text-anchor="middle" font-size="10" font-weight="bold" fill="#ff8f00">Katman Ekseni (nerede)</text>
  <text x="745" y="439" text-anchor="middle" font-size="9" fill="#4a5a70">RF/Fiziksel · Baglantı/MAC</text>
  <text x="745" y="452" text-anchor="middle" font-size="9" fill="#4a5a70">Ag · Uygulama/Bulut</text>
  <text x="745" y="465" text-anchor="middle" font-size="9" fill="#6b7a90">Kontrol sinif düzeyinde seçilir</text>

  <line x1="10" y1="492" x2="850" y2="492" stroke="#d3dde8" stroke-width="1"/>
  <text x="430" y="490" text-anchor="middle" font-size="9" fill="#7a8aa0">SIGINT El Kitabı — Bölüm 23: Kablosuz Saldiri Vektörleri Taksonomisi (Savunma Odaklı)</text>
</svg>
