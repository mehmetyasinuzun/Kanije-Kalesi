<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" font-family="Segoe UI, Arial, sans-serif">
  <rect width="820" height="500" fill="#f4f7fb"/>
  <text x="410" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a2b40">Gelecek Spektrum Katmanlari: ELF'ten Optik'e Dikey Mimari</text>

  <!-- Merkez dikey eksen -->
  <line x1="410" y1="50" x2="410" y2="460" stroke="#d3dde8" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Katman 1: ELF/VLF - Denizalti (en altta) -->
  <rect x="30" y="415" width="760" height="50" rx="6" fill="#1565c0" fill-opacity="0.15" stroke="#1565c0" stroke-width="1.5"/>
  <text x="200" y="436" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">ELF / VLF  (3 Hz – 30 kHz)</text>
  <text x="200" y="452" text-anchor="middle" font-size="10" fill="#1565c0">Denizalti haberlesme · Derin su nüfuz · Devasa anten · Çok düsük veri hızı</text>
  <text x="650" y="444" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565c0">Denizalti / Navigasyon</text>
  <!-- Küçük denizalti simgesi -->
  <ellipse cx="730" cy="440" rx="30" ry="10" fill="#1565c0" fill-opacity="0.3"/>
  <text x="730" y="443" text-anchor="middle" font-size="8" fill="#1565c0">denizalti</text>

  <!-- Katman 2: HF - Iyonosfer/NVIS -->
  <rect x="30" y="345" width="760" height="64" rx="6" fill="#c0392b" fill-opacity="0.13" stroke="#c0392b" stroke-width="1.5"/>
  <text x="200" y="366" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">HF  (3 – 30 MHz)</text>
  <text x="200" y="381" text-anchor="middle" font-size="10" fill="#c0392b">Iyonosfer sky-wave · NVIS bölgesel · Gri-çizgi · Afet haberlesme</text>
  <text x="200" y="396" text-anchor="middle" font-size="9" fill="#c0392b">Güneş döngüsüne bagli · MUF/LUF penceresi · SIGINT tarihi kökleri</text>
  <text x="660" y="376" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">Iyonosfer / NVIS</text>
  <!-- Iyonosfer yayi -->
  <path d="M 600 398 Q 660 358 720 398" stroke="#c0392b" stroke-width="1.5" fill="none"/>

  <!-- Katman 3: VHF/UHF - LEO Konstellasyon / Uydu-IoT -->
  <rect x="30" y="263" width="760" height="76" rx="6" fill="#1a8a3a" fill-opacity="0.13" stroke="#1a8a3a" stroke-width="1.5"/>
  <text x="210" y="284" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a8a3a">VHF / UHF  (30 MHz – 3 GHz)</text>
  <text x="210" y="299" text-anchor="middle" font-size="10" fill="#1a8a3a">LEO mega-konstellasyon (Starlink/OneWeb/Kuiper) · Uydu-IoT</text>
  <text x="210" y="314" text-anchor="middle" font-size="10" fill="#1a8a3a">Dogrudan-cihaza uydu · Doppler imzasi · Faz dizili anten</text>
  <text x="210" y="329" text-anchor="middle" font-size="9" fill="#1a8a3a">Meteor scatter · Aurora · Sporadic-E (egzotik mod)</text>
  <text x="660" y="296" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a8a3a">LEO Uydu / IoT</text>
  <!-- Uydu noktaları -->
  <circle cx="620" cy="285" r="4" fill="#1a8a3a"/>
  <circle cx="640" cy="275" r="4" fill="#1a8a3a"/>
  <circle cx="660" cy="268" r="4" fill="#1a8a3a"/>
  <circle cx="680" cy="277" r="4" fill="#1a8a3a"/>
  <text x="650" y="330" text-anchor="middle" font-size="9" fill="#1a8a3a">Konstelasyon</text>

  <!-- Katman 4: SHF/mmWave - 5G kısa menzil -->
  <rect x="30" y="193" width="760" height="64" rx="6" fill="#ff8f00" fill-opacity="0.13" stroke="#ff8f00" stroke-width="1.5"/>
  <text x="210" y="214" text-anchor="middle" font-size="11" font-weight="bold" fill="#b36200">mmWave  (24 – 300 GHz)</text>
  <text x="210" y="229" text-anchor="middle" font-size="10" fill="#b36200">5G yüksek kapasite · Çok geniş bant · Kısa menzil · Engele duyarlı</text>
  <text x="210" y="244" text-anchor="middle" font-size="10" fill="#b36200">Massive MIMO + Beamforming · Kentsel yogun kullanim</text>
  <text x="660" y="224" text-anchor="middle" font-size="10" font-weight="bold" fill="#b36200">5G Kısa Menzil</text>
  <!-- Hücre kulesi simgesi -->
  <line x1="700" y1="248" x2="700" y2="225" stroke="#b36200" stroke-width="2"/>
  <line x1="690" y1="230" x2="710" y2="230" stroke="#b36200" stroke-width="1.5"/>
  <line x1="685" y1="238" x2="715" y2="238" stroke="#b36200" stroke-width="1"/>

  <!-- Katman 5: THz - Arastirma -->
  <rect x="30" y="123" width="760" height="64" rx="6" fill="#6b7a90" fill-opacity="0.13" stroke="#6b7a90" stroke-width="1.5"/>
  <text x="210" y="144" text-anchor="middle" font-size="11" font-weight="bold" fill="#5a6b80">THz  (0.1 – 10 THz)</text>
  <text x="210" y="159" text-anchor="middle" font-size="10" fill="#5a6b80">6G ve sonrasi arastirma · Muazzam bant genisligi · Çok kısa menzil</text>
  <text x="210" y="174" text-anchor="middle" font-size="10" fill="#5a6b80">Atmosferik sogurmaya duyarlı · Hâlâ laboratuvar/arastirma asamasında</text>
  <text x="650" y="154" text-anchor="middle" font-size="10" font-weight="bold" fill="#5a6b80">6G Arastirma</text>
  <text x="650" y="167" text-anchor="middle" font-size="9" fill="#5a6b80">(teyit edilmeli)</text>

  <!-- Katman 6: Optik/Lazer - Uzay -->
  <rect x="30" y="53" width="760" height="64" rx="6" fill="#1a2b40" fill-opacity="0.10" stroke="#1a2b40" stroke-width="1.5"/>
  <text x="210" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2b40">Optik / Lazer  (görünür ısık + kızılötesi)</text>
  <text x="210" y="89" text-anchor="middle" font-size="10" fill="#1a2b40">Uydu-arası lazer (Starlink) · Serbest-uzay optik (FSO) · Derin-uzay optik</text>
  <text x="210" y="104" text-anchor="middle" font-size="10" fill="#1a2b40">Li-Fi (oda içi) · Çok yüksek hız · Dar hüzme (gizlilik avantajı)</text>
  <text x="650" y="82" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a2b40">Uzay / Yüksek Hız</text>
  <!-- Lazer simgesi -->
  <line x1="605" y1="95" x2="770" y2="65" stroke="#1a2b40" stroke-width="1.5"/>
  <circle cx="605" cy="95" r="3" fill="#1a2b40"/>
  <circle cx="770" cy="65" r="3" fill="#1a2b40"/>

  <!-- Sag taraf: katman numaralari ve frekans yükseltme oku -->
  <line x1="795" y1="53" x2="795" y2="465" stroke="#9fb3c8" stroke-width="1.5"/>
  <polygon points="795,53 790,63 800,63" fill="#9fb3c8"/>
  <text x="808" y="260" text-anchor="middle" font-size="10" fill="#6b7a90" transform="rotate(90,808,260)">Frekans Artar →</text>

  <!-- Alt not -->
  <rect x="15" y="468" width="790" height="22" rx="4" fill="#ffffff" stroke="#d3dde8" stroke-width="1"/>
  <text x="410" y="482" text-anchor="middle" font-size="9" fill="#6b7a90">Mimari katmanlı: Alçak frekans → kapsama/dayanıklılık · Yüksek frekans → yogun kapasite/kısa menzil · Hepsini beamforming + dinamik spektrum baglar</text>

  <line x1="10" y1="493" x2="810" y2="493" stroke="#d3dde8" stroke-width="1"/>
  <text x="410" y="491" text-anchor="middle" font-size="9" fill="#7a8aa0">SIGINT El Kitabı — Bölüm 22: Gelecek Spektrum Mimarisi</text>
</svg>
