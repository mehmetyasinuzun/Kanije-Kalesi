<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="820" height="420" fill="#f4f7fb"/>
  <text x="410" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a2b40">Dagitim Kaymasi — RF-ML'in Bir Numarali Tehlikesi</text>
  <text x="410" y="46" text-anchor="middle" font-size="11" fill="#6b7a90">Egitim dagitimi (dar/sentetik) vs gercek saha dagitimi (genis/cok-kanallu)</text>

  <!-- Sol panel: egitim dagitimi -->
  <rect x="20" y="64" width="360" height="300" rx="4" fill="#ffffff" stroke="#9fb3c8" stroke-width="1"/>
  <text x="200" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565c0">Egitim Dagitimi</text>
  <text x="200" y="100" text-anchor="middle" font-size="10" fill="#6b7a90">(dar, kontrollü, homojen)</text>

  <!-- Eksen -->
  <line x1="50" y1="300" x2="360" y2="300" stroke="#4a5a70" stroke-width="1.5"/>
  <line x1="50" y1="130" x2="50" y2="310" stroke="#4a5a70" stroke-width="1.5"/>
  <text x="200" y="318" text-anchor="middle" font-size="10" fill="#6b7a90">Sinyal özelligi uzayi (SNR, kanal, SDR modeli...)</text>
  <text x="38" y="215" text-anchor="middle" font-size="9" fill="#6b7a90" transform="rotate(-90,38,215)">Yogunluk</text>

  <!-- Dar egitim Gauss egrisi (mavi) -->
  <path d="M 80,300 Q 100,295 120,280 Q 140,240 160,170 Q 180,110 200,95 Q 220,110 240,170 Q 260,240 280,280 Q 300,295 320,300" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <!-- Egitim dagitim etiketleri -->
  <text x="200" y="130" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565c0">Egitim</text>
  <line x1="200" y1="133" x2="200" y2="300" stroke="#1565c0" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Egitim icindekileri listele -->
  <text x="55" y="200" font-size="9" fill="#4a5a70">• Sentetik / tek SDR</text>
  <text x="55" y="215" font-size="9" fill="#4a5a70">• Tek gün / tek kanal</text>
  <text x="55" y="230" font-size="9" fill="#4a5a70">• Temiz AWGN gurultu</text>
  <text x="55" y="245" font-size="9" fill="#4a5a70">• Sabit sicaklik/konum</text>
  <text x="55" y="260" font-size="9" fill="#4a5a70">• Sinirli modulasyon</text>
  <text x="55" y="275" font-size="9" fill="#4a5a70">• Kontrollü SNR</text>

  <!-- Sag panel: gercek dagitim -->
  <rect x="400" y="64" width="400" height="300" rx="4" fill="#ffffff" stroke="#9fb3c8" stroke-width="1"/>
  <text x="600" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Gercek Saha Dagitimi</text>
  <text x="600" y="100" text-anchor="middle" font-size="10" fill="#6b7a90">(genis, heterojen, degisken)</text>

  <!-- Eksen -->
  <line x1="420" y1="300" x2="790" y2="300" stroke="#4a5a70" stroke-width="1.5"/>
  <line x1="420" y1="130" x2="420" y2="310" stroke="#4a5a70" stroke-width="1.5"/>
  <text x="600" y="318" text-anchor="middle" font-size="10" fill="#6b7a90">Sinyal özelligi uzayi (SNR, kanal, SDR modeli...)</text>

  <!-- Genis gercek Gauss egrisi (kirmizi, daha yassi ve genis) -->
  <path d="M 425,300 Q 440,298 460,290 Q 480,270 510,240 Q 540,215 570,205 Q 600,200 630,205 Q 660,215 690,240 Q 720,270 750,290 Q 770,298 790,300" fill="#fce4e4" stroke="#c0392b" stroke-width="2.5"/>
  <!-- Gercek dagitim ortalamasi -->
  <text x="600" y="190" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">Saha</text>
  <line x1="600" y1="193" x2="600" y2="300" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Gercek icindekileri listele -->
  <text x="425" y="170" font-size="9" fill="#4a5a70">• Farkli SDR / antennler</text>
  <text x="425" y="184" font-size="9" fill="#4a5a70">• Cok gun/ay/yil</text>
  <text x="425" y="198" font-size="9" fill="#4a5a70">• Gercekci kanal bozulmasi</text>
  <text x="425" y="212" font-size="9" fill="#4a5a70">• Degisen sicaklik/konum</text>
  <text x="425" y="226" font-size="9" fill="#4a5a70">• Bilinmeyen modulasyon</text>
  <text x="425" y="240" font-size="9" fill="#4a5a70">• Genis SNR arali§i</text>

  <!-- Ortusmeyen bolge vurgusu - altta bagli alan -->
  <rect x="20" y="375" width="780" height="36" rx="4" fill="#fff3e0" stroke="#ff8f00" stroke-width="1.5"/>
  <text x="410" y="388" text-anchor="middle" font-size="11" font-weight="bold" fill="#ff8f00">Modelin Sessizce Yanildigı Alan (Dagitim Kaymasi)</text>
  <text x="410" y="404" text-anchor="middle" font-size="10" fill="#4a5a70">Model egitim dagitiminda ogrendigi → saha dagitiminda kaymasi → yuksek guvenle yanlis sinif tahmin eder</text>

  <!-- Ortusmeyen bolgeler vurgulari: diyagramda solda ve sagda -->
  <!-- Sol ucak - sadece sahada var, egitimde yok -->
  <path d="M 420,300 Q 430,298 440,290 Q 450,275 455,262" fill="none" stroke="#ff8f00" stroke-width="2" stroke-dasharray="4,2"/>
  <!-- Sag ucak -->
  <path d="M 770,298 Q 780,299 785,298 Q 790,297 790,300" fill="none" stroke="#ff8f00" stroke-width="2" stroke-dasharray="4,2"/>
  <!-- Vurgu metin -->
  <text x="440" y="255" font-size="9" fill="#ff8f00">← Egitimde gorulmemis</text>
  <text x="440" y="267" font-size="9" fill="#ff8f00">    bolgeler; sessiz hata</text>

  <!-- Ortak kesim bolgesi (oldukca kucuk) -->
  <!-- merkez yakin bir bolgede kucuk bir ortusme gostergesi -->
  <text x="200" y="350" text-anchor="middle" font-size="9" fill="#1565c0">Dar egitim bant</text>
  <text x="600" y="350" text-anchor="middle" font-size="9" fill="#c0392b">Genis gercek saha bant</text>
  <line x1="200" y1="354" x2="600" y2="354" stroke="#ff8f00" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrd)"/>
  <defs>
    <marker id="arrd" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#ff8f00"/>
    </marker>
  </defs>
  <text x="400" y="350" text-anchor="middle" font-size="9" fill="#ff8f00">≠ Fark</text>
</svg>
