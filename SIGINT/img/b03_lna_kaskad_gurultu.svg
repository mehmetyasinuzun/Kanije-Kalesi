<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="820" height="460" fill="#f4f7fb"/>
  <text x="410" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a2b40">Friis Gurultu: LNA Konumu Kritiktir</text>

  <!-- Ayrac: ust panel KOTU, alt panel IYI -->
  <line x1="30" y1="235" x2="790" y2="235" stroke="#d3dde8" stroke-width="1.2"/>

  <!-- ===== UST PANEL: KOTU zincir ===== -->
  <rect x="30" y="50" width="760" height="175" fill="#ffffff" stroke="#9fb3c8" stroke-width="1"/>
  <!-- Baslik -->
  <text x="50" y="75" font-size="13" font-weight="bold" fill="#c0392b">KOTU: ANTEN → uzun kablo (−6 dB) → LNA → SDR</text>

  <!-- defs: ok markeri -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#7a8aa0"/>
    </marker>
    <marker id="arr_r" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#c0392b"/>
    </marker>
    <marker id="arr_g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#1a8a3a"/>
    </marker>
  </defs>

  <!-- Bloklar: KOTU zincir -->
  <!-- ANTEN -->
  <rect x="55" y="100" width="80" height="50" rx="4" fill="#eef2f8" stroke="#9fb3c8" stroke-width="1.2"/>
  <text x="95" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2b40">ANTEN</text>
  <text x="95" y="138" text-anchor="middle" font-size="10" fill="#4a5a70">sinyal</text>

  <!-- ok -->
  <line x1="135" y1="125" x2="165" y2="125" stroke="#7a8aa0" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- UZUN KABLO (kirmizi - kayip) -->
  <rect x="165" y="100" width="130" height="50" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="230" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Uzun Kablo</text>
  <text x="230" y="135" text-anchor="middle" font-size="11" fill="#c0392b">Kayip: −6 dB</text>
  <text x="230" y="148" text-anchor="middle" font-size="10" fill="#c0392b">NF=6 dB (F=4)</text>

  <!-- ok -->
  <line x1="295" y1="125" x2="325" y2="125" stroke="#7a8aa0" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- LNA -->
  <rect x="325" y="100" width="110" height="50" rx="4" fill="#eef2f8" stroke="#9fb3c8" stroke-width="1.2"/>
  <text x="380" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2b40">LNA</text>
  <text x="380" y="135" text-anchor="middle" font-size="11" fill="#36506e">NF=1 dB, G=20 dB</text>
  <text x="380" y="148" text-anchor="middle" font-size="10" fill="#4a5a70">F=1.26, G=100×</text>

  <!-- ok -->
  <line x1="435" y1="125" x2="465" y2="125" stroke="#7a8aa0" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- SDR -->
  <rect x="465" y="100" width="100" height="50" rx="4" fill="#eef2f8" stroke="#9fb3c8" stroke-width="1.2"/>
  <text x="515" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2b40">SDR</text>
  <text x="515" y="138" text-anchor="middle" font-size="10" fill="#4a5a70">NF=10 dB</text>

  <!-- Hesap sonucu kutusu - KOTU -->
  <rect x="600" y="88" width="175" height="75" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="687" y="107" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Sistem NF (Friis):</text>
  <text x="687" y="124" text-anchor="middle" font-size="11" fill="#c0392b">F_top = 4 + (1.26−1)/4</text>
  <text x="687" y="140" text-anchor="middle" font-size="11" fill="#c0392b">F_top ≈ 4.065</text>
  <text x="687" y="156" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">NF_top ≈ 6.1 dB</text>

  <!-- "ilk kat kablo" etiketi -->
  <text x="230" y="185" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#c0392b">↑ ilk kat! kablonun 6 dB kaybi</text>
  <text x="230" y="197" text-anchor="middle" font-size="10.5" fill="#c0392b">sistemi mahveder</text>

  <!-- ===== ALT PANEL: IYI zincir ===== -->
  <rect x="30" y="245" width="760" height="175" fill="#ffffff" stroke="#9fb3c8" stroke-width="1"/>
  <text x="50" y="270" font-size="13" font-weight="bold" fill="#1a8a3a">IYI: ANTEN → LNA → uzun kablo (−6 dB) → SDR</text>

  <!-- ANTEN -->
  <rect x="55" y="295" width="80" height="50" rx="4" fill="#eef2f8" stroke="#9fb3c8" stroke-width="1.2"/>
  <text x="95" y="317" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2b40">ANTEN</text>
  <text x="95" y="333" text-anchor="middle" font-size="10" fill="#4a5a70">sinyal</text>

  <!-- ok -->
  <line x1="135" y1="320" x2="165" y2="320" stroke="#7a8aa0" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- LNA (yesil - ilk kat duzgun) -->
  <rect x="165" y="295" width="130" height="50" rx="4" fill="#e8f5e9" stroke="#1a8a3a" stroke-width="1.5"/>
  <text x="230" y="315" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a8a3a">LNA (antende)</text>
  <text x="230" y="330" text-anchor="middle" font-size="11" fill="#1a8a3a">NF=1 dB, G=20 dB</text>
  <text x="230" y="343" text-anchor="middle" font-size="10" fill="#1a8a3a">F=1.26, G=100×</text>

  <!-- ok -->
  <line x1="295" y1="320" x2="325" y2="320" stroke="#7a8aa0" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- UZUN KABLO -->
  <rect x="325" y="295" width="110" height="50" rx="4" fill="#eef2f8" stroke="#9fb3c8" stroke-width="1.2"/>
  <text x="380" y="315" text-anchor="middle" font-size="11" font-weight="bold" fill="#36506e">Uzun Kablo</text>
  <text x="380" y="330" text-anchor="middle" font-size="11" fill="#4a5a70">Kayip: −6 dB</text>
  <text x="380" y="343" text-anchor="middle" font-size="10" fill="#4a5a70">F=4, G=1/4</text>

  <!-- ok -->
  <line x1="435" y1="320" x2="465" y2="320" stroke="#7a8aa0" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- SDR -->
  <rect x="465" y="295" width="100" height="50" rx="4" fill="#eef2f8" stroke="#9fb3c8" stroke-width="1.2"/>
  <text x="515" y="317" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2b40">SDR</text>
  <text x="515" y="333" text-anchor="middle" font-size="10" fill="#4a5a70">NF=10 dB</text>

  <!-- Hesap sonucu kutusu - IYI -->
  <rect x="600" y="283" width="175" height="75" rx="5" fill="#e8f5e9" stroke="#1a8a3a" stroke-width="1.5"/>
  <text x="687" y="302" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a8a3a">Sistem NF (Friis):</text>
  <text x="687" y="319" text-anchor="middle" font-size="11" fill="#1a8a3a">F_top = 1.26 + (4−1)/100</text>
  <text x="687" y="335" text-anchor="middle" font-size="11" fill="#1a8a3a">F_top ≈ 1.29</text>
  <text x="687" y="351" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a8a3a">NF_top ≈ 1.1 dB</text>

  <!-- "ilk kat LNA" etiketi -->
  <text x="230" y="380" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a8a3a">↑ ilk kat LNA: sonraki kablonun</text>
  <text x="230" y="392" text-anchor="middle" font-size="10.5" fill="#1a8a3a">gurultusu ÷100 → gorunmez</text>

  <!-- Alt formul bandi -->
  <rect x="30" y="425" width="760" height="30" fill="#eef2f8" stroke="none"/>
  <text x="410" y="445" text-anchor="middle" font-size="11" fill="#36506e">
    Friis: F_top = F₁ + (F₂−1)/G₁ + (F₃−1)/(G₁·G₂) + ...  |  IYI zincir: 6.1 dB → 1.1 dB = 5 dB kazanim; LNA antende olmali
  </text>
</svg>
