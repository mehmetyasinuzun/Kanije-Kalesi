<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="860" height="480" fill="#f4f7fb"/>
  <text x="430" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a2b40">Uydu Link Butcesi: EIRP → FSPL → G/T → C/N0</text>
  <line x1="20" y1="38" x2="840" y2="38" stroke="#9fb3c8" stroke-width="0.8"/>

  <!-- Ana panel -->
  <rect x="20" y="44" width="820" height="398" fill="#ffffff" stroke="#9fb3c8" stroke-width="1" rx="3"/>

  <!-- Ok tanimlamalari -->
  <defs>
    <marker id="arrW" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <polygon points="0,0 9,3.5 0,7" fill="#1a2b40"/>
    </marker>
    <marker id="arrBlue2" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <polygon points="0,0 9,3.5 0,7" fill="#1565c0"/>
    </marker>
    <marker id="arrRed2" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <polygon points="0,0 9,3.5 0,7" fill="#c0392b"/>
    </marker>
    <marker id="arrGreen2" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <polygon points="0,0 9,3.5 0,7" fill="#1a8a3a"/>
    </marker>
    <marker id="arrOrange2" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <polygon points="0,0 9,3.5 0,7" fill="#ff8f00"/>
    </marker>
  </defs>

  <!-- ====== ZINCIR: Soldan saga ====== -->
  <!-- EIRP kutu -->
  <rect x="36" y="105" width="120" height="68" fill="#1565c0" fill-opacity="0.12" stroke="#1565c0" stroke-width="2" rx="5"/>
  <text x="96" y="127" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">EIRP</text>
  <text x="96" y="143" text-anchor="middle" font-size="10" fill="#1565c0">Uydu vericisi</text>
  <text x="96" y="157" text-anchor="middle" font-size="10" fill="#1565c0">≈ +50 dBW (Ku)</text>
  <text x="96" y="170" text-anchor="middle" font-size="9" fill="#36506e">HPA + anten kazan.</text>

  <!-- → FSPL -->
  <line x1="158" y1="139" x2="218" y2="139" stroke="#c0392b" stroke-width="3" marker-end="url(#arrRed2)"/>
  <text x="188" y="132" text-anchor="middle" font-size="9" fill="#c0392b">−</text>

  <!-- FSPL kutu -->
  <rect x="220" y="95" width="130" height="88" fill="#c0392b" fill-opacity="0.10" stroke="#c0392b" stroke-width="2" rx="5"/>
  <text x="285" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">FSPL</text>
  <text x="285" y="134" text-anchor="middle" font-size="10" fill="#c0392b">Serbest Uzay</text>
  <text x="285" y="148" text-anchor="middle" font-size="10" fill="#c0392b">Yol Kaybi</text>
  <text x="285" y="164" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">≈ −205 dB</text>
  <text x="285" y="178" text-anchor="middle" font-size="9" fill="#36506e">GEO + Ku (36000 km)</text>

  <!-- → diger kayiplar -->
  <line x1="352" y1="139" x2="412" y2="139" stroke="#7a8aa0" stroke-width="2.5" marker-end="url(#arrW)"/>
  <text x="382" y="132" text-anchor="middle" font-size="9" fill="#6b7a90">−</text>

  <!-- Diger kayiplar kutu -->
  <rect x="414" y="98" width="120" height="82" fill="#7a8aa0" fill-opacity="0.10" stroke="#7a8aa0" stroke-width="1.5" rx="5"/>
  <text x="474" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6b7a90">Diger Kayiplar</text>
  <text x="474" y="131" text-anchor="middle" font-size="9" fill="#36506e">atmosfer: ~0.3 dB</text>
  <text x="474" y="144" text-anchor="middle" font-size="9" fill="#36506e">yagmur: 0..30 dB</text>
  <text x="474" y="157" text-anchor="middle" font-size="9" fill="#36506e">anten yanlis hiz.</text>
  <text x="474" y="170" text-anchor="middle" font-size="9" fill="#c0392b">Ka'da kritik!</text>

  <!-- → G/T -->
  <line x1="536" y1="139" x2="596" y2="139" stroke="#1a8a3a" stroke-width="3" marker-end="url(#arrGreen2)"/>
  <text x="566" y="132" text-anchor="middle" font-size="9" fill="#1a8a3a">+</text>

  <!-- G/T kutu -->
  <rect x="598" y="105" width="120" height="68" fill="#1a8a3a" fill-opacity="0.10" stroke="#1a8a3a" stroke-width="2" rx="5"/>
  <text x="658" y="127" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a8a3a">G/T</text>
  <text x="658" y="143" text-anchor="middle" font-size="10" fill="#1a8a3a">Alıcı iyilik fakt.</text>
  <text x="658" y="157" text-anchor="middle" font-size="10" fill="#1a8a3a">≈ +12 dB/K</text>
  <text x="658" y="170" text-anchor="middle" font-size="9" fill="#36506e">canak + LNB</text>

  <!-- → C/N0 -->
  <line x1="720" y1="139" x2="780" y2="139" stroke="#ff8f00" stroke-width="3" marker-end="url(#arrOrange2)"/>
  <text x="750" y="132" text-anchor="middle" font-size="9" fill="#ff8f00">=</text>

  <!-- C/N0 kutu -->
  <rect x="782" y="105" width="52" height="68" fill="#ff8f00" fill-opacity="0.15" stroke="#ff8f00" stroke-width="2" rx="5"/>
  <text x="808" y="127" text-anchor="middle" font-size="11" font-weight="bold" fill="#ff8f00">C/N0</text>
  <text x="808" y="143" text-anchor="middle" font-size="9" fill="#ff8f00">dB-Hz</text>
  <text x="808" y="157" text-anchor="middle" font-size="9" fill="#ff8f00">link</text>
  <text x="808" y="170" text-anchor="middle" font-size="9" fill="#ff8f00">kalite</text>

  <!-- ====== dBW GRAFIĞI (bar chart) ====== -->
  <!-- Eksen -->
  <line x1="70" y1="390" x2="830" y2="390" stroke="#6b7a90" stroke-width="1.2"/>
  <line x1="70" y1="390" x2="70" y2="218" stroke="#6b7a90" stroke-width="1.2"/>

  <!-- Referans: 0 dBW = y=390 hizasi, 1 dB = ~0.9px -->
  <!-- EIRP +50 dBW: yukseklik = 50*1.8 = 90px -->
  <!-- Bar 1: EIRP (mavi, pozitif) -->
  <rect x="100" y="300" width="70" height="90" fill="#1565c0" fill-opacity="0.7" rx="2"/>
  <text x="135" y="295" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565c0">+50 dBW</text>
  <text x="135" y="408" text-anchor="middle" font-size="9" fill="#4a5a70">EIRP</text>

  <!-- Bar 2: FSPL (kirmizi, negatif cok buyuk - gorsellestirilmis) -->
  <!-- −205 dB: normalde cok buyuk, küçültelim: 205 * 0.55 = 113px -->
  <rect x="220" y="248" width="70" height="142" fill="#c0392b" fill-opacity="0.65" rx="2"/>
  <text x="255" y="244" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">−205 dB</text>
  <text x="255" y="408" text-anchor="middle" font-size="9" fill="#4a5a70">FSPL</text>
  <!-- Kesik cizgi gercek olcek icin -->
  <text x="255" y="255" text-anchor="middle" font-size="8" fill="#c0392b">(olceklenmis)</text>

  <!-- Bar 3: Kayiplar (gri, negatif) -->
  <rect x="340" y="350" width="70" height="40" fill="#7a8aa0" fill-opacity="0.6" rx="2"/>
  <text x="375" y="346" text-anchor="middle" font-size="10" fill="#6b7a90">−2..−30 dB</text>
  <text x="375" y="408" text-anchor="middle" font-size="9" fill="#4a5a70">Kayiplar</text>

  <!-- Bar 4: G/T (yesil, pozitif) -->
  <rect x="460" y="347" width="70" height="43" fill="#1a8a3a" fill-opacity="0.65" rx="2"/>
  <text x="495" y="343" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a8a3a">+12 dB/K</text>
  <text x="495" y="408" text-anchor="middle" font-size="9" fill="#4a5a70">G/T</text>

  <!-- Boltzmann + -->
  <rect x="580" y="332" width="70" height="58" fill="#ff8f00" fill-opacity="0.18" stroke="#ff8f00" stroke-width="1" rx="2"/>
  <text x="615" y="348" text-anchor="middle" font-size="9" fill="#ff8f00">+228.6</text>
  <text x="615" y="361" text-anchor="middle" font-size="8" fill="#ff8f00">dBW/K/Hz</text>
  <text x="615" y="374" text-anchor="middle" font-size="8" fill="#ff8f00">(Boltzmann)</text>
  <text x="615" y="408" text-anchor="middle" font-size="9" fill="#4a5a70">−k</text>

  <!-- C/N0 Sonuc -->
  <rect x="700" y="325" width="90" height="65" fill="#ff8f00" fill-opacity="0.20" stroke="#ff8f00" stroke-width="1.8" rx="4"/>
  <text x="745" y="343" text-anchor="middle" font-size="11" font-weight="bold" fill="#ff8f00">C/N0</text>
  <text x="745" y="359" text-anchor="middle" font-size="10" fill="#ff8f00">≈ 85 dB-Hz</text>
  <text x="745" y="374" text-anchor="middle" font-size="9" fill="#36506e">(tipik Ku DTH)</text>
  <text x="745" y="408" text-anchor="middle" font-size="10" font-weight="bold" fill="#ff8f00">= C/N0</text>

  <!-- Link butcesi formulu kutusu -->
  <rect x="36" y="228" width="780" height="58" fill="#f4f7fb" stroke="#d3dde8" stroke-width="1" rx="3"/>
  <text x="426" y="247" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2b40">Link Denklemi (dB):</text>
  <text x="426" y="265" text-anchor="middle" font-size="12" fill="#1a2b40">C/N0  =  EIRP  −  FSPL  −  L_diger  +  G/T  +  228.6</text>
  <text x="426" y="280" text-anchor="middle" font-size="10" fill="#36506e">Uydunun sorumluluğu: EIRP  |  Doganın vergisi: FSPL  |  Alıcının kalitesi: G/T</text>

  <!-- Alt aciklama -->
  <rect x="20" y="446" width="820" height="32" fill="#f4f7fb"/>
  <line x1="20" y1="446" x2="840" y2="446" stroke="#d3dde8" stroke-width="0.8"/>
  <text x="430" y="461" text-anchor="middle" font-size="10" fill="#1a2b40">
    <tspan font-weight="bold">Sezgi:</tspan> 205 dB FSPL → gücu 10^20 kendiyle böler. Bu yüzden büyük canak (G artar) + iyi LNB (T duser) zorunludur. G/T link'in alıcı tarafının tek sayısıdır.
  </text>
</svg>
