<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="860" height="380" fill="#f4f7fb"/>
  <text x="430" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a2b40">Koordineli Zafiyet Aciklama (CVD) Yasam Dongusu</text>

  <defs>
    <marker id="arrowCVD" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#1565c0"/>
    </marker>
    <marker id="arrowCVDred" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- ASAMA KUTULARI: 7 asama yatay zincir -->
  <!-- Asama 1: Kesif -->
  <rect x="15" y="80" width="100" height="80" rx="5" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
  <rect x="15" y="80" width="100" height="22" rx="5" fill="#1565c0"/>
  <rect x="15" y="94" width="100" height="8" fill="#1565c0"/>
  <text x="65" y="93" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">1. KEŞİF</text>
  <text x="65" y="117" text-anchor="middle" font-size="9" fill="#4a5a70">Arastirmaci</text>
  <text x="65" y="130" text-anchor="middle" font-size="9" fill="#4a5a70">zafiyet bulur</text>
  <!-- Sure etiketi -->
  <rect x="25" y="162" width="80" height="18" rx="3" fill="#e3f0fd" stroke="#1565c0" stroke-width="1"/>
  <text x="65" y="175" text-anchor="middle" font-size="8.5" fill="#1565c0">Gun 0</text>

  <!-- ok -->
  <line x1="115" y1="120" x2="132" y2="120" stroke="#1565c0" stroke-width="1.8" marker-end="url(#arrowCVD)"/>

  <!-- Asama 2: Ozel Bildirim -->
  <rect x="132" y="80" width="106" height="80" rx="5" fill="#ffffff" stroke="#1a8a3a" stroke-width="2"/>
  <rect x="132" y="80" width="106" height="22" rx="5" fill="#1a8a3a"/>
  <rect x="132" y="94" width="106" height="8" fill="#1a8a3a"/>
  <text x="185" y="93" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">2. OZEL BİLDİRİM</text>
  <text x="185" y="117" text-anchor="middle" font-size="9" fill="#4a5a70">Uretici /</text>
  <text x="185" y="130" text-anchor="middle" font-size="9" fill="#4a5a70">sorumlu tarafa ilet</text>
  <rect x="142" y="162" width="86" height="18" rx="3" fill="#e8f5e9" stroke="#1a8a3a" stroke-width="1"/>
  <text x="185" y="175" text-anchor="middle" font-size="8.5" fill="#1a8a3a">Gun 1-7</text>

  <!-- ok -->
  <line x1="238" y1="120" x2="255" y2="120" stroke="#1565c0" stroke-width="1.8" marker-end="url(#arrowCVD)"/>

  <!-- Asama 3: Uretici Dogrulama -->
  <rect x="255" y="80" width="110" height="80" rx="5" fill="#ffffff" stroke="#ff8f00" stroke-width="2"/>
  <rect x="255" y="80" width="110" height="22" rx="5" fill="#ff8f00"/>
  <rect x="255" y="94" width="110" height="8" fill="#ff8f00"/>
  <text x="310" y="93" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">3. URETİCİ DOGRULAMA</text>
  <text x="310" y="117" text-anchor="middle" font-size="9" fill="#4a5a70">Kabul, ret veya</text>
  <text x="310" y="130" text-anchor="middle" font-size="9" fill="#4a5a70">ek bilgi istegi</text>
  <rect x="265" y="162" width="90" height="18" rx="3" fill="#fff3e0" stroke="#ff8f00" stroke-width="1"/>
  <text x="310" y="175" text-anchor="middle" font-size="8.5" fill="#ff8f00">~1-4 hafta</text>

  <!-- ok -->
  <line x1="365" y1="120" x2="382" y2="120" stroke="#1565c0" stroke-width="1.8" marker-end="url(#arrowCVD)"/>

  <!-- Asama 4: Yama Gelistirme -->
  <rect x="382" y="80" width="108" height="80" rx="5" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
  <rect x="382" y="80" width="108" height="22" rx="5" fill="#1565c0"/>
  <rect x="382" y="94" width="108" height="8" fill="#1565c0"/>
  <text x="436" y="93" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">4. YAMA GELİŞTİRME</text>
  <text x="436" y="117" text-anchor="middle" font-size="9" fill="#4a5a70">Uretici yamayı</text>
  <text x="436" y="130" text-anchor="middle" font-size="9" fill="#4a5a70">hazirlayıp test eder</text>
  <rect x="392" y="162" width="88" height="18" rx="3" fill="#e3f0fd" stroke="#1565c0" stroke-width="1"/>
  <text x="436" y="175" text-anchor="middle" font-size="8.5" fill="#1565c0">~30-90 gun</text>

  <!-- ok -->
  <line x1="490" y1="120" x2="507" y2="120" stroke="#1565c0" stroke-width="1.8" marker-end="url(#arrowCVD)"/>

  <!-- Asama 5: Kamuya Aciklama + CVE -->
  <rect x="507" y="80" width="110" height="80" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <rect x="507" y="80" width="110" height="22" rx="5" fill="#c0392b"/>
  <rect x="507" y="94" width="110" height="8" fill="#c0392b"/>
  <text x="562" y="93" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">5. KAMUYA ACIKLAMA</text>
  <text x="562" y="113" text-anchor="middle" font-size="9" fill="#4a5a70">CVE-YIL-NUMARA</text>
  <text x="562" y="127" text-anchor="middle" font-size="9" fill="#4a5a70">atanir, advisory</text>
  <text x="562" y="141" text-anchor="middle" font-size="9" fill="#4a5a70">yayimlanir</text>
  <rect x="517" y="162" width="90" height="18" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="562" y="175" text-anchor="middle" font-size="8.5" fill="#c0392b">Gun X (kararlasildi)</text>

  <!-- ok -->
  <line x1="617" y1="120" x2="634" y2="120" stroke="#1565c0" stroke-width="1.8" marker-end="url(#arrowCVD)"/>

  <!-- Asama 6: Operator Yama Dagitimu -->
  <rect x="634" y="80" width="108" height="80" rx="5" fill="#ffffff" stroke="#6b7a90" stroke-width="2"/>
  <rect x="634" y="80" width="108" height="22" rx="5" fill="#6b7a90"/>
  <rect x="634" y="94" width="108" height="8" fill="#6b7a90"/>
  <text x="688" y="93" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">6. OPERATOR YAMA</text>
  <text x="688" y="117" text-anchor="middle" font-size="9" fill="#4a5a70">Operatorler / sistem</text>
  <text x="688" y="130" text-anchor="middle" font-size="9" fill="#4a5a70">sahipleri yamali</text>
  <text x="688" y="143" text-anchor="middle" font-size="9" fill="#4a5a70">surumu dagitiyor</text>
  <rect x="644" y="162" width="88" height="18" rx="3" fill="#e8f0fb" stroke="#6b7a90" stroke-width="1"/>
  <text x="688" y="175" text-anchor="middle" font-size="8.5" fill="#6b7a90">Haftalar - Aylar</text>

  <!-- ok -->
  <line x1="742" y1="120" x2="759" y2="120" stroke="#1565c0" stroke-width="1.8" marker-end="url(#arrowCVD)"/>

  <!-- Asama 7: Cihaz Guncelleme -->
  <rect x="753" y="80" width="96" height="80" rx="5" fill="#ffffff" stroke="#1a8a3a" stroke-width="2"/>
  <rect x="753" y="80" width="96" height="22" rx="5" fill="#1a8a3a"/>
  <rect x="753" y="94" width="96" height="8" fill="#1a8a3a"/>
  <text x="801" y="89" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">7. CİHAZ</text>
  <text x="801" y="101" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">GUNCELLEME</text>
  <text x="801" y="124" text-anchor="middle" font-size="9" fill="#4a5a70">Son kullanici</text>
  <text x="801" y="137" text-anchor="middle" font-size="9" fill="#4a5a70">cihazini guncelliyor</text>
  <rect x="763" y="162" width="76" height="18" rx="3" fill="#e8f5e9" stroke="#1a8a3a" stroke-width="1"/>
  <text x="801" y="175" text-anchor="middle" font-size="8.5" fill="#1a8a3a">Aylar - Yillar</text>

  <!-- ALT NOT: En yavas halka -->
  <rect x="634" y="205" width="209" height="48" rx="5" fill="#fff3e0" stroke="#ff8f00" stroke-width="1.5"/>
  <text x="738" y="222" text-anchor="middle" font-size="9" font-weight="bold" fill="#ff8f00">Sahada kapatilma en yavas halka:</text>
  <text x="738" y="237" text-anchor="middle" font-size="9" fill="#36506e">Operator dagitimi + cihaz guncellemesi</text>
  <text x="738" y="250" text-anchor="middle" font-size="9" fill="#36506e">aylar hatta yillar surebilir.</text>
  <line x1="738" y1="205" x2="738" y2="182" stroke="#ff8f00" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Telekom ozel notu -->
  <rect x="382" y="205" width="245" height="48" rx="5" fill="#e8f0fb" stroke="#6b7a90" stroke-width="1"/>
  <text x="504" y="222" text-anchor="middle" font-size="9" font-weight="bold" fill="#36506e">Telekom ozeli (GSMA CVD / 3GPP SA3):</text>
  <text x="504" y="237" text-anchor="middle" font-size="9" fill="#6b7a90">Standart → Uretici → Operator → Cihaz</text>
  <text x="504" y="250" text-anchor="middle" font-size="9" fill="#6b7a90">her katman ayri zaman alir.</text>

  <!-- Zaman ekseni alt -->
  <line x1="15" y1="275" x2="843" y2="275" stroke="#d3dde8" stroke-width="1.5"/>
  <text x="10" y="272" font-size="9" fill="#6b7a90">t:</text>
  <text x="65" y="290" text-anchor="middle" font-size="9" fill="#1565c0">Gun 0</text>
  <text x="185" y="290" text-anchor="middle" font-size="9" fill="#1a8a3a">~1 Hafta</text>
  <text x="310" y="290" text-anchor="middle" font-size="9" fill="#ff8f00">~Haftalarca</text>
  <text x="436" y="290" text-anchor="middle" font-size="9" fill="#1565c0">~30-90 Gun</text>
  <text x="562" y="290" text-anchor="middle" font-size="9" fill="#c0392b">Kararlasildi</text>
  <text x="688" y="290" text-anchor="middle" font-size="9" fill="#6b7a90">Aylar</text>
  <text x="801" y="290" text-anchor="middle" font-size="9" fill="#1a8a3a">Aylar-Yillar</text>

  <!-- CVD etigi notu -->
  <rect x="15" y="305" width="830" height="24" rx="4" fill="#e3f0fd" stroke="#1565c0" stroke-width="1"/>
  <text x="430" y="321" text-anchor="middle" font-size="10" fill="#36506e">CVD Etigi: Once uretici/sorumlu tarafa ozel bildir, makul sure taninir, yama hazir olduktan sonra kamuya acikla. Tam ifsa: yama olmadan aciklama (son care olarak).</text>

  <line x1="15" y1="338" x2="845" y2="338" stroke="#d3dde8" stroke-width="1"/>
  <text x="430" y="353" text-anchor="middle" font-size="10" fill="#6b7a90">Bolum 14 — Zafiyet ekosistemi: CVE/NVD/uretici advisory/CISA KEV katmanlari; telekom zincirine gore en yavas halka sahada kapatilmadir.</text>
</svg>
