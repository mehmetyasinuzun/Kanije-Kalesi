<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="820" height="400" fill="#f4f7fb"/>
  <text x="410" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a2b40">Nyquist'in Iki Yuzu: Gercek ve Karmasik Ornekleme</text>
  <text x="410" y="46" text-anchor="middle" font-size="11" fill="#6b7a90">Gercek orneklemede f_s/2 bant — Karmasik (IQ) orneklemede tam f_s bant kullanilabilir</text>

  <!-- Sol panel: Gercek ornekleme -->
  <rect x="20" y="60" width="380" height="300" rx="4" fill="#ffffff" stroke="#9fb3c8" stroke-width="1"/>
  <text x="210" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Gercek (Real) Ornekleme</text>
  <text x="210" y="96" text-anchor="middle" font-size="10" fill="#6b7a90">Kullanilabilir bant = f_s / 2</text>

  <!-- Eksen -->
  <line x1="40" y1="220" x2="390" y2="220" stroke="#4a5a70" stroke-width="1.5"/>
  <line x1="210" y1="115" x2="210" y2="330" stroke="#4a5a70" stroke-width="1.5" stroke-dasharray="4,2"/>
  <!-- Eksen etiketleri -->
  <text x="210" y="240" text-anchor="middle" font-size="10" fill="#1a2b40">0 (DC)</text>
  <text x="40" y="240" text-anchor="middle" font-size="10" fill="#c0392b">−f_s/2</text>
  <text x="385" y="240" text-anchor="middle" font-size="10" fill="#c0392b">+f_s/2</text>
  <!-- Nyquist duvarlari -->
  <line x1="40" y1="115" x2="40" y2="330" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="380" y1="115" x2="380" y2="330" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="40" y="110" text-anchor="middle" font-size="9" fill="#c0392b">Nyquist</text>
  <text x="380" y="110" text-anchor="middle" font-size="9" fill="#c0392b">Nyquist</text>

  <!-- Gercek sinyalin simetrik spektrumu: pozitif ve negatif esit -->
  <!-- Negatif frekans lobu -->
  <path d="M 60,220 Q 85,140 110,220" fill="#fce4e4" stroke="#c0392b" stroke-width="2"/>
  <!-- DC yaninda kucuk lob -->
  <path d="M 130,220 Q 170,150 210,220" fill="#fce4e4" stroke="#c0392b" stroke-width="2"/>
  <!-- Pozitif frekans (simetrik ayna) -->
  <path d="M 210,220 Q 250,150 290,220" fill="#fce4e4" stroke="#c0392b" stroke-width="2"/>
  <path d="M 300,220 Q 325,140 350,220" fill="#fce4e4" stroke="#c0392b" stroke-width="2"/>

  <!-- Simetri oku ve etiket -->
  <line x1="120" y1="168" x2="290" y2="168" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="210" y="164" text-anchor="middle" font-size="9" fill="#c0392b">Hermitsel simetri: X(−f) = X*(f)</text>

  <!-- Bant genisligi vurgusu -->
  <rect x="40" y="280" width="340" height="18" rx="2" fill="#fce4e4" stroke="#c0392b" stroke-width="1"/>
  <text x="210" y="293" text-anchor="middle" font-size="10" fill="#c0392b">Toplam kullanilabilir bant = f_s / 2</text>
  <!-- Aciklama -->
  <text x="210" y="318" text-anchor="middle" font-size="9" fill="#4a5a70">Her frekans 2 kez temsil edilir (±f simetrik)</text>
  <text x="210" y="332" text-anchor="middle" font-size="9" fill="#4a5a70">Negatif frekans yeni bilgi tasimaz</text>
  <text x="210" y="346" text-anchor="middle" font-size="9" fill="#4a5a70">Sadece tek kanal (I) yeterli → bant = f_s/2</text>

  <!-- Sag panel: Karmasik (IQ) ornekleme -->
  <rect x="420" y="60" width="380" height="300" rx="4" fill="#ffffff" stroke="#9fb3c8" stroke-width="1"/>
  <text x="610" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565c0">Karmasik (IQ) Ornekleme</text>
  <text x="610" y="96" text-anchor="middle" font-size="10" fill="#6b7a90">Kullanilabilir bant = f_s (TAM BANT)</text>

  <!-- Eksen -->
  <line x1="440" y1="220" x2="790" y2="220" stroke="#4a5a70" stroke-width="1.5"/>
  <line x1="610" y1="115" x2="610" y2="330" stroke="#4a5a70" stroke-width="1.5" stroke-dasharray="4,2"/>
  <!-- Eksen etiketleri -->
  <text x="610" y="240" text-anchor="middle" font-size="10" fill="#1a2b40">0 (DC = f_c)</text>
  <text x="440" y="240" text-anchor="middle" font-size="10" fill="#1565c0">−f_s/2</text>
  <text x="785" y="240" text-anchor="middle" font-size="10" fill="#1565c0">+f_s/2</text>
  <!-- Nyquist duvarlari -->
  <line x1="440" y1="115" x2="440" y2="330" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="780" y1="115" x2="780" y2="330" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="440" y="110" text-anchor="middle" font-size="9" fill="#1565c0">−f_s/2</text>
  <text x="780" y="110" text-anchor="middle" font-size="9" fill="#1565c0">+f_s/2</text>

  <!-- IQ spektrum: asimetrik olabilir, sol farkli sag farkli -->
  <!-- Sol: negatif frekans, f_c'nin altindaki yayinlar -->
  <path d="M 455,220 Q 490,145 525,220" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="490" y="157" text-anchor="middle" font-size="9" fill="#1565c0">Yayin B</text>
  <text x="490" y="168" text-anchor="middle" font-size="9" fill="#1565c0">(f_c altinda)</text>

  <!-- Sag: pozitif frekans, f_c'nin ustundeki yayinlar -->
  <path d="M 665,220 Q 715,130 760,220" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="715" y="142" text-anchor="middle" font-size="9" fill="#1565c0">Yayin A</text>
  <text x="715" y="153" text-anchor="middle" font-size="9" fill="#1565c0">(f_c ustunde)</text>

  <!-- Kucuk sinyal ortada -->
  <path d="M 570,220 Q 595,172 620,220" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="595" y="180" text-anchor="middle" font-size="9" fill="#4a5a70">DC'ye yakin</text>

  <!-- IQ ASIMETRI vurgusu -->
  <text x="610" y="258" text-anchor="middle" font-size="9" fill="#1565c0">Yayin A ≠ Yayin B: asimetrik olabilir</text>
  <text x="610" y="272" text-anchor="middle" font-size="9" fill="#1565c0">Pozitif ve negatif frekanslar bagimsiz!</text>

  <!-- Bant genisligi vurgusu -->
  <rect x="440" y="280" width="340" height="18" rx="2" fill="#e3f2fd" stroke="#1565c0" stroke-width="1"/>
  <text x="610" y="293" text-anchor="middle" font-size="10" fill="#1565c0">Toplam kullanilabilir bant = f_s (TAM)</text>
  <!-- Aciklamalar -->
  <text x="610" y="318" text-anchor="middle" font-size="9" fill="#4a5a70">IQ: 2 kanal (I ve Q) → 2× bilgi kapasitesi</text>
  <text x="610" y="332" text-anchor="middle" font-size="9" fill="#4a5a70">z[n] = I[n] + jQ[n]: karmasik spektrum asimetrik</text>
  <text x="610" y="346" text-anchor="middle" font-size="9" fill="#4a5a70">SDR bant = f_s (orneksel olarak)</text>

  <!-- Alt: karsilastirma ozet -->
  <rect x="20" y="370" width="780" height="24" rx="3" fill="#f0f4ff" stroke="#9fb3c8" stroke-width="1"/>
  <text x="210" y="382" text-anchor="middle" font-size="9" fill="#c0392b">Gercek: 2.4 MS/s → ~2.4 MHz'in YARISI = ~1.2 MHz gozlenebilir bant</text>
  <line x1="410" y1="370" x2="410" y2="394" stroke="#d3dde8" stroke-width="1"/>
  <text x="610" y="382" text-anchor="middle" font-size="9" fill="#1565c0">Karmasik (IQ): 2.4 MS/s → ~2.4 MHz bant (tam) gozlenebilir</text>
</svg>
