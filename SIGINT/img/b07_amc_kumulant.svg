<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="860" height="480" fill="#f4f7fb"/>
  <text x="430" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a2b40">Otomatik Modulasyon Tanima (AMC) — Takimyildiz + 4. Derece Kumulant</text>

  <!-- === BPSK paneli === -->
  <rect x="20" y="45" width="260" height="400" fill="#ffffff" stroke="#9fb3c8" stroke-width="1"/>
  <text x="150" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565c0">BPSK</text>
  <text x="150" y="80" text-anchor="middle" font-size="10" fill="#4a5a70">2 nokta, tek eksen</text>

  <!-- BPSK ikon takimyildiz -->
  <line x1="50" y1="160" x2="250" y2="160" stroke="#d3dde8" stroke-width="1"/>
  <line x1="150" y1="100" x2="150" y2="220" stroke="#d3dde8" stroke-width="1"/>
  <circle cx="90"  cy="160" r="9" fill="#1565c0"/>
  <circle cx="210" cy="160" r="9" fill="#1565c0"/>
  <text x="90"  y="178" text-anchor="middle" font-size="9" fill="#6b7a90">(-1,0)</text>
  <text x="210" y="178" text-anchor="middle" font-size="9" fill="#6b7a90">(+1,0)</text>
  <text x="150" y="97" text-anchor="middle" font-size="9" fill="#6b7a90">Q</text>
  <text x="253" y="163" font-size="9" fill="#6b7a90">I</text>

  <!-- BPSK kumulant bolge -->
  <rect x="35" y="235" width="230" height="80" fill="#e8f0fb" stroke="#1565c0" stroke-width="1.5" rx="4"/>
  <text x="150" y="254" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">4. Derece Kumulant (C40)</text>
  <text x="150" y="272" text-anchor="middle" font-size="13" fill="#1565c0">C40 ≈ −2</text>
  <text x="150" y="290" text-anchor="middle" font-size="10" fill="#4a5a70">C42 ≈ −1</text>
  <text x="150" y="305" text-anchor="middle" font-size="9" fill="#4a5a70">(iki-nokta, tek eksen geometrisi)</text>

  <!-- BPSK kumulant uzay konum -->
  <rect x="35" y="328" width="230" height="80" fill="#f4f7fb" stroke="#9fb3c8" stroke-width="1" rx="3"/>
  <text x="150" y="347" text-anchor="middle" font-size="10" font-weight="bold" fill="#36506e">Kumulant Uzayinda Konum</text>
  <text x="150" y="363" text-anchor="middle" font-size="10" fill="#4a5a70">|C40| ~ 2.0  →  BPSK bolgesi</text>
  <text x="150" y="378" text-anchor="middle" font-size="10" fill="#4a5a70">Karar: 2 sembol, 180° aralik</text>
  <text x="150" y="393" text-anchor="middle" font-size="9" fill="#1565c0">KARAR → BPSK</text>

  <!-- === QPSK paneli === -->
  <rect x="300" y="45" width="260" height="400" fill="#ffffff" stroke="#9fb3c8" stroke-width="1"/>
  <text x="430" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a8a3a">QPSK</text>
  <text x="430" y="80" text-anchor="middle" font-size="10" fill="#4a5a70">4 nokta, 90° aralikli</text>

  <!-- QPSK takimyildiz -->
  <line x1="330" y1="160" x2="530" y2="160" stroke="#d3dde8" stroke-width="1"/>
  <line x1="430" y1="100" x2="430" y2="220" stroke="#d3dde8" stroke-width="1"/>
  <circle cx="385" cy="115" r="9" fill="#1a8a3a"/>
  <circle cx="475" cy="115" r="9" fill="#1a8a3a"/>
  <circle cx="385" cy="205" r="9" fill="#1a8a3a"/>
  <circle cx="475" cy="205" r="9" fill="#1a8a3a"/>
  <text x="365" y="111" font-size="8" fill="#6b7a90">(-1,+1)</text>
  <text x="477" y="111" font-size="8" fill="#6b7a90">(+1,+1)</text>
  <text x="365" y="218" font-size="8" fill="#6b7a90">(-1,-1)</text>
  <text x="477" y="218" font-size="8" fill="#6b7a90">(+1,-1)</text>
  <text x="430" y="97" text-anchor="middle" font-size="9" fill="#6b7a90">Q</text>
  <text x="533" y="163" font-size="9" fill="#6b7a90">I</text>

  <!-- QPSK kumulant -->
  <rect x="315" y="235" width="230" height="80" fill="#e8f4e8" stroke="#1a8a3a" stroke-width="1.5" rx="4"/>
  <text x="430" y="254" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a8a3a">4. Derece Kumulant (C40)</text>
  <text x="430" y="272" text-anchor="middle" font-size="13" fill="#1a8a3a">C40 ≈ −1</text>
  <text x="430" y="290" text-anchor="middle" font-size="10" fill="#4a5a70">C42 ≈ −1</text>
  <text x="430" y="305" text-anchor="middle" font-size="9" fill="#4a5a70">(dört-nokta, simetrik geometri)</text>

  <rect x="315" y="328" width="230" height="80" fill="#f4f7fb" stroke="#9fb3c8" stroke-width="1" rx="3"/>
  <text x="430" y="347" text-anchor="middle" font-size="10" font-weight="bold" fill="#36506e">Kumulant Uzayinda Konum</text>
  <text x="430" y="363" text-anchor="middle" font-size="10" fill="#4a5a70">|C40| ~ 1.0  →  QPSK bolgesi</text>
  <text x="430" y="378" text-anchor="middle" font-size="10" fill="#4a5a70">BPSK'dan daha kucuk |C40|</text>
  <text x="430" y="393" text-anchor="middle" font-size="9" fill="#1a8a3a">KARAR → QPSK</text>

  <!-- === 16-QAM paneli === -->
  <rect x="580" y="45" width="260" height="400" fill="#ffffff" stroke="#9fb3c8" stroke-width="1"/>
  <text x="710" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">16-QAM</text>
  <text x="710" y="80" text-anchor="middle" font-size="10" fill="#4a5a70">16 nokta, 4x4 izgara</text>

  <!-- 16-QAM takimyildiz (4x4) -->
  <line x1="605" y1="160" x2="815" y2="160" stroke="#d3dde8" stroke-width="1"/>
  <line x1="710" y1="100" x2="710" y2="225" stroke="#d3dde8" stroke-width="1"/>
  <!-- 4x4 = 16 nokta, simetrik -->
  <defs>
    <symbol id="qp" viewBox="-5 -5 10 10"><circle cx="0" cy="0" r="4.5" fill="#c0392b"/></symbol>
  </defs>
  <!-- satirlar: y=110,135,183,207 sutunlar: x=643,675,743,775 -->
  <use href="#qp" x="638" y="105"/>
  <use href="#qp" x="670" y="105"/>
  <use href="#qp" x="738" y="105"/>
  <use href="#qp" x="770" y="105"/>
  <use href="#qp" x="638" y="130"/>
  <use href="#qp" x="670" y="130"/>
  <use href="#qp" x="738" y="130"/>
  <use href="#qp" x="770" y="130"/>
  <use href="#qp" x="638" y="178"/>
  <use href="#qp" x="670" y="178"/>
  <use href="#qp" x="738" y="178"/>
  <use href="#qp" x="770" y="178"/>
  <use href="#qp" x="638" y="204"/>
  <use href="#qp" x="670" y="204"/>
  <use href="#qp" x="738" y="204"/>
  <use href="#qp" x="770" y="204"/>
  <text x="710" y="97" text-anchor="middle" font-size="9" fill="#6b7a90">Q</text>
  <text x="819" y="163" font-size="9" fill="#6b7a90">I</text>

  <!-- 16-QAM kumulant -->
  <rect x="595" y="235" width="230" height="80" fill="#fce8e8" stroke="#c0392b" stroke-width="1.5" rx="4"/>
  <text x="710" y="254" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">4. Derece Kumulant (C40)</text>
  <text x="710" y="272" text-anchor="middle" font-size="13" fill="#c0392b">C40 ≈ −0.68</text>
  <text x="710" y="290" text-anchor="middle" font-size="10" fill="#4a5a70">C42 ≈ −0.32</text>
  <text x="710" y="305" text-anchor="middle" font-size="9" fill="#4a5a70">(çok seviyeli, genis dagilimli)</text>

  <rect x="595" y="328" width="230" height="80" fill="#f4f7fb" stroke="#9fb3c8" stroke-width="1" rx="3"/>
  <text x="710" y="347" text-anchor="middle" font-size="10" font-weight="bold" fill="#36506e">Kumulant Uzayinda Konum</text>
  <text x="710" y="363" text-anchor="middle" font-size="10" fill="#4a5a70">|C40| ~ 0.68  →  16-QAM bolgesi</text>
  <text x="710" y="378" text-anchor="middle" font-size="10" fill="#4a5a70">Cok seviyeli → kumulant kucur</text>
  <text x="710" y="393" text-anchor="middle" font-size="9" fill="#c0392b">KARAR → 16-QAM</text>

  <!-- Alt bilgi -->
  <line x1="20" y1="455" x2="840" y2="455" stroke="#d3dde8" stroke-width="1"/>
  <text x="430" y="468" text-anchor="middle" font-size="10" fill="#6b7a90">Kumulantlar faz/frekans kaymasi ve olceklemeye karsı dayaniklidir — kör modulasyon tanima icin guclu ayirac</text>
</svg>
