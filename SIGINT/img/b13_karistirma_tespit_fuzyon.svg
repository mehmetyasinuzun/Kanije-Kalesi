<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="Segoe UI, Arial, sans-serif">
  <rect width="820" height="440" fill="#f4f7fb"/>
  <text x="410" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a2b40">Karistirma Tespiti: Uc Katman Fuzyon Modeli</text>

  <!-- ZAMAN EKSENi -->
  <text x="24" y="52" font-size="10" fill="#6b7a90" font-weight="bold">zaman →</text>
  <line x1="20" y1="57" x2="760" y2="57" stroke="#d3dde8" stroke-width="1.5" marker-end="url(#arrowTime)"/>
  <defs>
    <marker id="arrowTime" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d3dde8"/>
    </marker>
    <marker id="arrowFuz" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#1a2b40"/>
    </marker>
  </defs>
  <!-- Zaman isaretleri -->
  <line x1="300" y1="53" x2="300" y2="62" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="300" y="72" text-anchor="middle" font-size="9" fill="#c0392b">karistirma basladi</text>

  <!-- ===== SERIT 1: Gurultu Tabani Izleme ===== -->
  <rect x="20" y="80" width="740" height="96" rx="5" fill="#ffffff" stroke="#9fb3c8" stroke-width="1"/>
  <!-- Etiket -->
  <rect x="20" y="80" width="150" height="22" rx="5" fill="#1565c0"/>
  <rect x="20" y="94" width="150" height="8" fill="#1565c0"/>
  <text x="95" y="95" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">1. Gurultu Tabani Izleme</text>

  <!-- Normal taban cizgisi -->
  <polyline points="175,140 195,138 215,141 235,139 255,140 275,138 295,140" fill="none" stroke="#1565c0" stroke-width="2"/>
  <!-- Karistirma sonrasi taban yukselmesi -->
  <polyline points="300,140 305,120 315,108 330,100 380,98 430,99 480,100 530,100 580,100 630,100 680,100 730,100 755,100" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <!-- Dolgu alan -->
  <polygon points="300,140 300,100 755,100 755,165 300,165" fill="#fdecea" opacity="0.4"/>
  <!-- Normal bolge dolgusu -->
  <polygon points="175,165 175,138 295,140 295,165" fill="#e3f0fd" opacity="0.4"/>

  <text x="230" y="160" text-anchor="middle" font-size="9" fill="#1565c0">normal taban (~dalgali)</text>
  <text x="540" y="95" text-anchor="middle" font-size="9" fill="#c0392b" font-weight="bold">yukselmis taban (karistirma)</text>
  <!-- Esik cizgisi -->
  <line x1="175" y1="118" x2="755" y2="118" stroke="#ff8f00" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="760" y="122" font-size="9" fill="#ff8f00">esik</text>
  <!-- Guc ekseni -->
  <text x="22" y="100" font-size="9" fill="#6b7a90">dBm</text>
  <text x="22" y="155" font-size="9" fill="#6b7a90">▲</text>

  <!-- ===== SERIT 2: Spektral Anomali Sekli ===== -->
  <rect x="20" y="190" width="740" height="96" rx="5" fill="#ffffff" stroke="#9fb3c8" stroke-width="1"/>
  <rect x="20" y="190" width="180" height="22" rx="5" fill="#1a8a3a"/>
  <rect x="20" y="204" width="180" height="8" fill="#1a8a3a"/>
  <text x="110" y="205" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">2. Spektral Anomali Sekli</text>

  <!-- Normal spektrum -->
  <polyline points="205,258 225,256 250,257 275,258 295,257" fill="none" stroke="#1a8a3a" stroke-width="1.5"/>
  <!-- Beklenmez dar tepe (spot benzeri) -->
  <polygon points="330,258 340,230 350,210 360,208 370,210 380,230 390,258" fill="#e8f5e9" stroke="#1a8a3a" stroke-width="1.5"/>
  <text x="360" y="217" text-anchor="middle" font-size="8" fill="#1a8a3a">dar tepe</text>
  <!-- Genis taban kalkma (barrage) -->
  <polygon points="460,258 462,240 480,228 520,225 560,228 578,240 580,258" fill="#e8f5e9" stroke="#1a8a3a" stroke-width="1.5" opacity="0.7"/>
  <text x="520" y="230" text-anchor="middle" font-size="8" fill="#1a8a3a">genis kalkma</text>
  <!-- Gezen tepe (sweep) -->
  <polygon points="630,258 634,240 642,225 650,222 658,225 666,240 668,258" fill="#e8f5e9" stroke="#ff8f00" stroke-width="1.5"/>
  <polygon points="650,258 654,245 662,235 668,233 674,235 680,245 682,258" fill="#fff3e0" stroke="#ff8f00" stroke-width="1" opacity="0.6"/>
  <text x="656" y="228" text-anchor="middle" font-size="8" fill="#ff8f00">gezen</text>
  <!-- Frekans ekseni -->
  <line x1="200" y1="260" x2="750" y2="260" stroke="#d3dde8" stroke-width="1"/>
  <text x="200" y="272" font-size="8" fill="#6b7a90">f→</text>
  <text x="22" y="250" font-size="9" fill="#6b7a90">Guc</text>
  <text x="22" y="263" font-size="9" fill="#6b7a90">▲</text>
  <line x1="300" y1="192" x2="300" y2="285" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- ===== SERIT 3: Sistem Kalitesi Cokusu ===== -->
  <rect x="20" y="300" width="740" height="96" rx="5" fill="#ffffff" stroke="#9fb3c8" stroke-width="1"/>
  <rect x="20" y="300" width="190" height="22" rx="5" fill="#6b7a90"/>
  <rect x="20" y="314" width="190" height="8" fill="#6b7a90"/>
  <text x="115" y="315" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">3. Sistem Kalitesi Cokusu (C/N0 / RSRP)</text>

  <!-- Yuksek kalite cizgisi -->
  <polyline points="215,340 240,338 265,340 285,339 295,340" fill="none" stroke="#1a8a3a" stroke-width="2"/>
  <!-- Cokus -->
  <polyline points="300,340 310,345 325,352 345,358 365,365 395,372 430,375 480,376 530,377 580,377 630,377 680,377 730,377 755,377" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <!-- Alan dolgu -->
  <polygon points="215,385 215,340 295,340 300,340 755,377 755,385" fill="#e8f5e9" opacity="0.3"/>
  <polygon points="300,385 300,340 755,377 755,385" fill="#fdecea" opacity="0.35"/>

  <text x="250" y="378" text-anchor="middle" font-size="9" fill="#1a8a3a">iyi C/N0</text>
  <text x="540" y="373" text-anchor="middle" font-size="9" fill="#c0392b" font-weight="bold">dusuk C/N0 / RSRP (karistirma etkisi)</text>
  <text x="22" y="360" font-size="9" fill="#6b7a90">dB</text>
  <text x="22" y="373" font-size="9" fill="#6b7a90">▲</text>
  <line x1="300" y1="302" x2="300" y2="395" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- FUZYON KESMESI -->
  <defs>
    <marker id="arrowFuzD" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#1a2b40"/>
    </marker>
  </defs>
  <!-- Uc serit birlesim oklarla -->
  <line x1="755" y1="130" x2="800" y2="130" stroke="#7a8aa0" stroke-width="1.3" stroke-dasharray="4,3"/>
  <line x1="755" y1="238" x2="800" y2="238" stroke="#7a8aa0" stroke-width="1.3" stroke-dasharray="4,3"/>
  <line x1="755" y1="348" x2="800" y2="348" stroke="#7a8aa0" stroke-width="1.3" stroke-dasharray="4,3"/>
  <line x1="800" y1="130" x2="800" y2="348" stroke="#7a8aa0" stroke-width="1.5"/>
  <!-- Karar kutusu -->
  <rect x="760" y="390" width="0" height="0"/>

  <!-- Tespit Karari Kutusu (sag) - yeniden konumlandiriyorum sol-alt olarak -->
  <rect x="270" y="400" width="280" height="32" rx="6" fill="#1a2b40"/>
  <text x="410" y="422" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">TESPIT KARARI: Karistirma Onaylandi</text>

  <!-- Uc seridden ok -->
  <line x1="410" y1="128" x2="410" y2="400" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.5"/>

  <!-- Fuzyon notu -->
  <rect x="20" y="400" width="245" height="32" rx="5" fill="#e3f0fd" stroke="#1565c0" stroke-width="1"/>
  <text x="143" y="413" text-anchor="middle" font-size="9" fill="#1565c0">Fuzyon: Uc katman da ayni anda</text>
  <text x="143" y="426" text-anchor="middle" font-size="9" fill="#36506e">isaret ederse tespit gucu yukselir.</text>

  <rect x="558" y="400" width="242" height="32" rx="5" fill="#e8f5e9" stroke="#1a8a3a" stroke-width="1"/>
  <text x="679" y="413" text-anchor="middle" font-size="9" fill="#1a8a3a">Yalnizca biri = suphe;</text>
  <text x="679" y="426" text-anchor="middle" font-size="9" fill="#36506e">Uc katman birlikte = guclu tespit.</text>
</svg>
