<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="880" height="360" fill="#f4f7fb"/>
  <text x="440" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a2b40">SIGINT Tarihi Zaman Seridi</text>

  <!-- Yatay zaman çizgisi -->
  <line x1="30" y1="165" x2="850" y2="165" stroke="#9fb3c8" stroke-width="2.5"/>
  <!-- Ok ucu -->
  <polygon points="850,165 840,160 840,170" fill="#9fb3c8"/>

  <!-- Dönemler: 6 dugüm -->
  <!-- Dugüm koordinatlari: x = 70, 210, 350, 490, 630, 780 -->

  <!-- Dugüm 1: Telgraf / Marconi (1890s-1914) -->
  <circle cx="70" cy="165" r="11" fill="#1565c0" stroke="#0d47a1" stroke-width="1.5"/>
  <text x="70" y="169" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">1</text>

  <rect x="10" y="50" width="120" height="90" rx="6" fill="#ffffff" stroke="#9fb3c8" stroke-width="1"/>
  <text x="70" y="68" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565c0">1880'ler–1914</text>
  <text x="70" y="82" text-anchor="middle" font-size="9" fill="#4a5a70">Telgraf + Telsiz</text>
  <text x="70" y="95" text-anchor="middle" font-size="9" fill="#4a5a70">Marconi yayılı</text>
  <text x="70" y="108" text-anchor="middle" font-size="9" fill="#4a5a70">spektrum</text>
  <text x="70" y="124" text-anchor="middle" font-size="9" font-style="italic" fill="#6b7a90">Baskin yetenek:</text>
  <text x="70" y="137" text-anchor="middle" font-size="9" fill="#1565c0">Telgraf dinleme</text>
  <line x1="70" y1="140" x2="70" y2="154" stroke="#9fb3c8" stroke-width="1"/>

  <!-- Dugüm 2: I.DS - Room 40 -->
  <circle cx="210" cy="165" r="11" fill="#1565c0" stroke="#0d47a1" stroke-width="1.5"/>
  <text x="210" y="169" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">2</text>

  <rect x="150" y="185" width="120" height="90" rx="6" fill="#ffffff" stroke="#9fb3c8" stroke-width="1"/>
  <text x="210" y="203" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565c0">I. DS 1914–18</text>
  <text x="210" y="217" text-anchor="middle" font-size="9" fill="#4a5a70">Room 40 (UK)</text>
  <text x="210" y="230" text-anchor="middle" font-size="9" fill="#4a5a70">Zimmermann</text>
  <text x="210" y="243" text-anchor="middle" font-size="9" fill="#4a5a70">Telgraf (1917)</text>
  <text x="210" y="259" text-anchor="middle" font-size="9" font-style="italic" fill="#6b7a90">Baskin yetenek:</text>
  <text x="210" y="272" text-anchor="middle" font-size="9" fill="#1565c0">Kriptanaliz + DF</text>
  <line x1="210" y1="176" x2="210" y2="185" stroke="#9fb3c8" stroke-width="1"/>

  <!-- Dugüm 3: II.DS - Bletchley -->
  <circle cx="350" cy="165" r="11" fill="#c0392b" stroke="#922b21" stroke-width="1.5"/>
  <text x="350" y="169" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">3</text>

  <rect x="290" y="50" width="120" height="90" rx="6" fill="#ffffff" stroke="#9fb3c8" stroke-width="1"/>
  <text x="350" y="68" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">II. DS 1939–45</text>
  <text x="350" y="82" text-anchor="middle" font-size="9" fill="#4a5a70">Enigma / Ultra</text>
  <text x="350" y="95" text-anchor="middle" font-size="9" fill="#4a5a70">Bletchley Park</text>
  <text x="350" y="108" text-anchor="middle" font-size="9" fill="#4a5a70">Colossus</text>
  <text x="350" y="124" text-anchor="middle" font-size="9" font-style="italic" fill="#6b7a90">Baskin yetenek:</text>
  <text x="350" y="137" text-anchor="middle" font-size="9" fill="#c0392b">Mekanik hesaplama</text>
  <line x1="350" y1="140" x2="350" y2="154" stroke="#9fb3c8" stroke-width="1"/>

  <!-- Dugüm 4: Soguk Savas ELINT -->
  <circle cx="490" cy="165" r="11" fill="#ff8f00" stroke="#b36200" stroke-width="1.5"/>
  <text x="490" y="169" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">4</text>

  <rect x="430" y="185" width="120" height="90" rx="6" fill="#ffffff" stroke="#9fb3c8" stroke-width="1"/>
  <text x="490" y="203" text-anchor="middle" font-size="10" font-weight="bold" fill="#ff8f00">1950–90 Soguk S.</text>
  <text x="490" y="217" text-anchor="middle" font-size="9" fill="#4a5a70">ELINT radar</text>
  <text x="490" y="230" text-anchor="middle" font-size="9" fill="#4a5a70">istihbarati</text>
  <text x="490" y="243" text-anchor="middle" font-size="9" fill="#4a5a70">Uydu SIGINT</text>
  <text x="490" y="259" text-anchor="middle" font-size="9" font-style="italic" fill="#6b7a90">Baskin yetenek:</text>
  <text x="490" y="272" text-anchor="middle" font-size="9" fill="#ff8f00">ELINT + uzay plt.</text>
  <line x1="490" y1="176" x2="490" y2="185" stroke="#9fb3c8" stroke-width="1"/>

  <!-- Dugüm 5: Dijital/Sifreli -->
  <circle cx="630" cy="165" r="11" fill="#1a8a3a" stroke="#145e27" stroke-width="1.5"/>
  <text x="630" y="169" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">5</text>

  <rect x="570" y="50" width="120" height="90" rx="6" fill="#ffffff" stroke="#9fb3c8" stroke-width="1"/>
  <text x="630" y="68" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a8a3a">1990–2013</text>
  <text x="630" y="82" text-anchor="middle" font-size="9" fill="#4a5a70">Dijital/IP cagi</text>
  <text x="630" y="95" text-anchor="middle" font-size="9" fill="#4a5a70">ECHELON tart.</text>
  <text x="630" y="108" text-anchor="middle" font-size="9" fill="#4a5a70">TLS yaygınlasir</text>
  <text x="630" y="124" text-anchor="middle" font-size="9" font-style="italic" fill="#6b7a90">Baskin yetenek:</text>
  <text x="630" y="137" text-anchor="middle" font-size="9" fill="#1a8a3a">Paket yakalama</text>
  <line x1="630" y1="140" x2="630" y2="154" stroke="#9fb3c8" stroke-width="1"/>

  <!-- Dugüm 6: Meta-veri donemi -->
  <circle cx="780" cy="165" r="11" fill="#6b7a90" stroke="#4a5a70" stroke-width="1.5"/>
  <text x="780" y="169" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">6</text>

  <rect x="720" y="185" width="120" height="90" rx="6" fill="#ffffff" stroke="#9fb3c8" stroke-width="1"/>
  <text x="780" y="203" text-anchor="middle" font-size="10" font-weight="bold" fill="#6b7a90">2013–Günümüz</text>
  <text x="780" y="217" text-anchor="middle" font-size="9" fill="#4a5a70">Meta-veri donemi</text>
  <text x="780" y="230" text-anchor="middle" font-size="9" fill="#4a5a70">Snowden 2013</text>
  <text x="780" y="243" text-anchor="middle" font-size="9" fill="#4a5a70">Sifreli/mobil</text>
  <text x="780" y="259" text-anchor="middle" font-size="9" font-style="italic" fill="#6b7a90">Baskin yetenek:</text>
  <text x="780" y="272" text-anchor="middle" font-size="9" fill="#6b7a90">Trafik analizi</text>
  <line x1="780" y1="176" x2="780" y2="185" stroke="#9fb3c8" stroke-width="1"/>

  <!-- "Agirlik merkezi kayması" ok gostergesi -->
  <rect x="30" y="298" width="820" height="44" rx="5" fill="#ffffff" stroke="#d3dde8" stroke-width="1"/>
  <text x="440" y="315" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a2b40">Agirlik Merkezinin Kayması</text>
  <text x="440" y="333" text-anchor="middle" font-size="10" fill="#4a5a70">Kriptanaliz (içerik çöz)  →  ELINT + ölçek (her seyi topla)  →  Meta-veri + seçim (sifreli çagda trafik analizi öne geçti)</text>

  <!-- Alt çizgi -->
  <line x1="10" y1="352" x2="870" y2="352" stroke="#d3dde8" stroke-width="1"/>
  <text x="440" y="350" text-anchor="middle" font-size="9" fill="#7a8aa0">SIGINT El Kitabı — Bölüm 21: Tarih, Aktörler ve Elektronik Harp</text>
</svg>
