<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" font-family="Segoe UI, Arial, sans-serif">
  <rect width="860" height="480" fill="#f4f7fb"/>
  <text x="430" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a2b40">PoC Senaryo Izolasyon Matrisi (6 Senaryo)</text>

  <!-- Tablo arka plan -->
  <rect x="20" y="42" width="820" height="418" fill="#ffffff" stroke="#9fb3c8" stroke-width="1" rx="4"/>

  <!-- Baslik satiri -->
  <rect x="20" y="42" width="820" height="32" fill="#1a2b40" rx="4"/>
  <text x="115" y="63" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">SENARYO</text>
  <text x="270" y="63" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">TEKNOLOJI</text>
  <text x="415" y="63" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">TX GEREKLI?</text>
  <text x="560" y="63" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">IZOLASYON ZORUNLU?</text>
  <text x="725" y="63" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">ONERILEN YONTEM</text>

  <!-- Sutun ayrac cizgileri baslik -->
  <line x1="185" y1="42" x2="185" y2="460" stroke="#d3dde8" stroke-width="1"/>
  <line x1="348" y1="42" x2="348" y2="460" stroke="#d3dde8" stroke-width="1"/>
  <line x1="480" y1="42" x2="480" y2="460" stroke="#d3dde8" stroke-width="1"/>
  <line x1="630" y1="42" x2="630" y2="460" stroke="#d3dde8" stroke-width="1"/>

  <!-- Satir 1: WiFi -->
  <rect x="20" y="74" width="820" height="56" fill="#f8fafd"/>
  <line x1="20" y1="130" x2="840" y2="130" stroke="#d3dde8" stroke-width="1"/>

  <text x="115" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">S1 — WiFi</text>
  <text x="115" y="111" text-anchor="middle" font-size="10" fill="#4a5a70">WPA2 handshake</text>
  <text x="115" y="124" text-anchor="middle" font-size="10" fill="#4a5a70">yakalama + kirma</text>

  <text x="270" y="96" text-anchor="middle" font-size="11" fill="#4a5a70">802.11 WiFi</text>
  <text x="270" y="111" text-anchor="middle" font-size="10" fill="#6b7a90">2.4 / 5 GHz</text>
  <text x="270" y="124" text-anchor="middle" font-size="10" fill="#6b7a90">WPA2 / WPA3</text>

  <!-- TX: deauth opsiyonel -->
  <rect x="388" y="80" width="84" height="22" rx="4" fill="#fff8e1" stroke="#ff8f00" stroke-width="1.5"/>
  <text x="430" y="95" text-anchor="middle" font-size="10" fill="#ff8f00">Opsiyonel TX</text>
  <text x="415" y="115" text-anchor="middle" font-size="9" fill="#6b7a90">(deauth kendi</text>
  <text x="415" y="126" text-anchor="middle" font-size="9" fill="#6b7a90">cihazina)</text>

  <!-- Izolasyon: tavsiye edilir -->
  <rect x="490" y="80" width="130" height="22" rx="4" fill="#f0fff4" stroke="#1a8a3a" stroke-width="1.5"/>
  <text x="555" y="95" text-anchor="middle" font-size="10" fill="#1a8a3a">Tavsiye edilir</text>
  <text x="555" y="110" text-anchor="middle" font-size="9" fill="#6b7a90">(deneysel temizlik)</text>
  <text x="555" y="122" text-anchor="middle" font-size="9" fill="#6b7a90">TX varsa zorunlu</text>

  <!-- Yontem: Dusuk guclu AP / Faraday -->
  <rect x="638" y="80" width="188" height="42" rx="4" fill="#e8f0fb" stroke="#1565c0" stroke-width="1"/>
  <text x="732" y="97" text-anchor="middle" font-size="10" fill="#1565c0">Dusuk guclu izole AP</text>
  <text x="732" y="110" text-anchor="middle" font-size="10" fill="#1565c0">veya Faraday cadiri</text>
  <text x="732" y="122" text-anchor="middle" font-size="9" fill="#6b7a90">Ana agdan ayrı segment</text>

  <!-- Satir 2: BLE -->
  <rect x="20" y="130" width="820" height="56" fill="#ffffff"/>
  <line x1="20" y1="186" x2="840" y2="186" stroke="#d3dde8" stroke-width="1"/>

  <text x="115" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a8a3a">S2 — BLE</text>
  <text x="115" y="167" text-anchor="middle" font-size="10" fill="#4a5a70">Sniffle sniff,</text>
  <text x="115" y="180" text-anchor="middle" font-size="10" fill="#4a5a70">GATT kestif</text>

  <text x="270" y="152" text-anchor="middle" font-size="11" fill="#4a5a70">Bluetooth LE</text>
  <text x="270" y="167" text-anchor="middle" font-size="10" fill="#6b7a90">2.4 GHz</text>
  <text x="270" y="180" text-anchor="middle" font-size="10" fill="#6b7a90">Legacy / LESC</text>

  <rect x="388" y="138" width="84" height="22" rx="4" fill="#f0fff4" stroke="#1a8a3a" stroke-width="1.5"/>
  <text x="430" y="153" text-anchor="middle" font-size="10" fill="#1a8a3a">Hayir (RX-only)</text>
  <text x="415" y="168" text-anchor="middle" font-size="9" fill="#6b7a90">Pasif sniff</text>
  <text x="415" y="180" text-anchor="middle" font-size="9" fill="#6b7a90">yeterli</text>

  <rect x="490" y="138" width="130" height="22" rx="4" fill="#f0fff4" stroke="#1a8a3a" stroke-width="1.5"/>
  <text x="555" y="153" text-anchor="middle" font-size="10" fill="#1a8a3a">Zorunlu degil</text>
  <text x="555" y="168" text-anchor="middle" font-size="9" fill="#6b7a90">Temizlik icin</text>
  <text x="555" y="180" text-anchor="middle" font-size="9" fill="#6b7a90">sakin ortam yeterli</text>

  <rect x="638" y="138" width="188" height="40" rx="4" fill="#f0fff4" stroke="#1a8a3a" stroke-width="1"/>
  <text x="732" y="155" text-anchor="middle" font-size="10" fill="#1a8a3a">Kendi cihazin yakininda</text>
  <text x="732" y="168" text-anchor="middle" font-size="10" fill="#1a8a3a">Sniffle + RTL-SDR</text>
  <text x="732" y="180" text-anchor="middle" font-size="9" fill="#6b7a90">(Faraday gerek yok)</text>

  <!-- Satir 3: Sub-GHz -->
  <rect x="20" y="186" width="820" height="56" fill="#f8fafd"/>
  <line x1="20" y1="242" x2="840" y2="242" stroke="#d3dde8" stroke-width="1"/>

  <text x="115" y="208" text-anchor="middle" font-size="11" font-weight="bold" fill="#ff8f00">S3 — Sub-GHz</text>
  <text x="115" y="223" text-anchor="middle" font-size="10" fill="#4a5a70">URH analiz,</text>
  <text x="115" y="236" text-anchor="middle" font-size="10" fill="#4a5a70">sabit/rolling kod</text>

  <text x="270" y="208" text-anchor="middle" font-size="11" fill="#4a5a70">433 / 315 MHz</text>
  <text x="270" y="223" text-anchor="middle" font-size="10" fill="#6b7a90">OOK/ASK</text>
  <text x="270" y="236" text-anchor="middle" font-size="10" fill="#6b7a90">Garaj/kapi/zil</text>

  <rect x="388" y="193" width="84" height="22" rx="4" fill="#fdf0f0" stroke="#c0392b" stroke-width="1.5"/>
  <text x="430" y="208" text-anchor="middle" font-size="10" fill="#c0392b">Opsiyonel TX</text>
  <text x="415" y="223" text-anchor="middle" font-size="9" fill="#6b7a90">kendi aliciya</text>
  <text x="415" y="236" text-anchor="middle" font-size="9" fill="#c0392b">geri gonderi</text>

  <!-- TX varsa zorunlu: kırmızı -->
  <rect x="490" y="193" width="130" height="22" rx="4" fill="#fdf0f0" stroke="#c0392b" stroke-width="2"/>
  <text x="555" y="208" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">TX ise ZORUNLU</text>
  <text x="555" y="223" text-anchor="middle" font-size="9" fill="#6b7a90">RX-only: gerek yok</text>
  <text x="555" y="236" text-anchor="middle" font-size="9" fill="#6b7a90">TX: kablo+ATT sart</text>

  <rect x="638" y="193" width="188" height="40" rx="4" fill="#fdf0f0" stroke="#c0392b" stroke-width="1.5"/>
  <text x="732" y="210" text-anchor="middle" font-size="10" fill="#c0392b" font-weight="bold">Kablolu + Attenuator</text>
  <text x="732" y="223" text-anchor="middle" font-size="10" fill="#36506e">(TX→ATT→RX, havaya yok)</text>
  <text x="732" y="236" text-anchor="middle" font-size="9" fill="#6b7a90">veya dummy-load yakin-alan</text>

  <!-- Satir 4: RFID -->
  <rect x="20" y="242" width="820" height="56" fill="#ffffff"/>
  <line x1="20" y1="298" x2="840" y2="298" stroke="#d3dde8" stroke-width="1"/>

  <text x="115" y="264" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">S4 — RFID</text>
  <text x="115" y="279" text-anchor="middle" font-size="10" fill="#4a5a70">Kart okuma,</text>
  <text x="115" y="292" text-anchor="middle" font-size="10" fill="#4a5a70">klonlama</text>

  <text x="270" y="264" text-anchor="middle" font-size="11" fill="#4a5a70">125 kHz / 13.56 MHz</text>
  <text x="270" y="279" text-anchor="middle" font-size="10" fill="#6b7a90">EM4100 / MIFARE</text>
  <text x="270" y="292" text-anchor="middle" font-size="10" fill="#6b7a90">DESFire</text>

  <rect x="388" y="248" width="84" height="22" rx="4" fill="#fff8e1" stroke="#ff8f00" stroke-width="1.5"/>
  <text x="430" y="263" text-anchor="middle" font-size="10" fill="#ff8f00">Okuyucu TX</text>
  <text x="415" y="278" text-anchor="middle" font-size="9" fill="#6b7a90">Proxmark/</text>
  <text x="415" y="290" text-anchor="middle" font-size="9" fill="#6b7a90">Flipper Zero</text>

  <rect x="490" y="248" width="130" height="22" rx="4" fill="#fff8e1" stroke="#ff8f00" stroke-width="1.5"/>
  <text x="555" y="263" text-anchor="middle" font-size="10" fill="#ff8f00">Tavsiye edilir</text>
  <text x="555" y="278" text-anchor="middle" font-size="9" fill="#6b7a90">Yakin-alan, zayif</text>
  <text x="555" y="290" text-anchor="middle" font-size="9" fill="#6b7a90">yayilim naturel</text>

  <rect x="638" y="248" width="188" height="40" rx="4" fill="#e8f0fb" stroke="#1565c0" stroke-width="1"/>
  <text x="732" y="265" text-anchor="middle" font-size="10" fill="#1565c0">Yakin-alan kuplaj yeterli</text>
  <text x="732" y="278" text-anchor="middle" font-size="10" fill="#1565c0">Kart okuyucuya cm mesafe</text>
  <text x="732" y="290" text-anchor="middle" font-size="9" fill="#6b7a90">(kablo/ATT gerekmez)</text>

  <!-- Satir 5: GNSS -->
  <rect x="20" y="298" width="820" height="56" fill="#f8fafd"/>
  <line x1="20" y1="354" x2="840" y2="354" stroke="#d3dde8" stroke-width="1"/>

  <text x="115" y="320" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">S5 — GNSS</text>
  <text x="115" y="335" text-anchor="middle" font-size="10" fill="#4a5a70">Kendi senaryo</text>
  <text x="115" y="348" text-anchor="middle" font-size="10" fill="#4a5a70">gps-sdr-sim</text>

  <text x="270" y="320" text-anchor="middle" font-size="11" fill="#4a5a70">GPS L1 1575.42 MHz</text>
  <text x="270" y="335" text-anchor="middle" font-size="10" fill="#6b7a90">Kendi GPS alicin</text>
  <text x="270" y="348" text-anchor="middle" font-size="10" fill="#6b7a90">spoofing tespiti</text>

  <!-- TX: ZORUNLU -->
  <rect x="385" y="304" width="90" height="22" rx="4" fill="#fdf0f0" stroke="#c0392b" stroke-width="2"/>
  <text x="430" y="319" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">EVET — TX sart</text>
  <text x="415" y="334" text-anchor="middle" font-size="9" fill="#c0392b">gps-sdr-sim</text>
  <text x="415" y="347" text-anchor="middle" font-size="9" fill="#c0392b">HackRF TX</text>

  <rect x="490" y="304" width="130" height="22" rx="4" fill="#fdf0f0" stroke="#c0392b" stroke-width="2.5"/>
  <text x="555" y="319" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">ZORUNLU</text>
  <text x="555" y="334" text-anchor="middle" font-size="9" fill="#c0392b">GPS: kritik bant</text>
  <text x="555" y="347" text-anchor="middle" font-size="9" fill="#c0392b">cikis = suç riski!</text>

  <rect x="638" y="304" width="188" height="42" rx="4" fill="#fdf0f0" stroke="#c0392b" stroke-width="2"/>
  <text x="732" y="320" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">Kablolu + ATT (birincil)</text>
  <text x="732" y="333" text-anchor="middle" font-size="10" fill="#36506e">TX → ATT zincir → kendi GPS</text>
  <text x="732" y="346" text-anchor="middle" font-size="10" fill="#36506e">Faraday: yedek hat</text>

  <!-- Satir 6: Hucresel -->
  <rect x="20" y="354" width="820" height="56" fill="#ffffff"/>
  <line x1="20" y1="410" x2="840" y2="410" stroke="#d3dde8" stroke-width="1"/>

  <text x="115" y="376" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">S6 — Hucresel</text>
  <text x="115" y="391" text-anchor="middle" font-size="10" fill="#4a5a70">srsRAN ozel hucre</text>
  <text x="115" y="404" text-anchor="middle" font-size="10" fill="#4a5a70">SUCI inceleme</text>

  <text x="270" y="376" text-anchor="middle" font-size="11" fill="#4a5a70">LTE / NR</text>
  <text x="270" y="391" text-anchor="middle" font-size="10" fill="#6b7a90">Kendi test SIM</text>
  <text x="270" y="404" text-anchor="middle" font-size="10" fill="#6b7a90">Open5GS</text>

  <rect x="385" y="360" width="90" height="22" rx="4" fill="#fdf0f0" stroke="#c0392b" stroke-width="2"/>
  <text x="430" y="375" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">EVET — TX sart</text>
  <text x="415" y="390" text-anchor="middle" font-size="9" fill="#c0392b">srsRAN baz</text>
  <text x="415" y="403" text-anchor="middle" font-size="9" fill="#c0392b">istasyonu TX</text>

  <rect x="490" y="360" width="130" height="22" rx="4" fill="#fdf0f0" stroke="#c0392b" stroke-width="2.5"/>
  <text x="555" y="375" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">ZORUNLU</text>
  <text x="555" y="390" text-anchor="middle" font-size="9" fill="#c0392b">LTE baz: operatör</text>
  <text x="555" y="403" text-anchor="middle" font-size="9" fill="#c0392b">banti = suc riski!</text>

  <rect x="638" y="360" width="188" height="42" rx="4" fill="#fdf0f0" stroke="#c0392b" stroke-width="2"/>
  <text x="732" y="376" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">Kablolu + ATT (birincil)</text>
  <text x="732" y="389" text-anchor="middle" font-size="10" fill="#36506e">srsRAN → ATT → UE</text>
  <text x="732" y="402" text-anchor="middle" font-size="10" fill="#36506e">Faraday: ek guvence</text>

  <!-- Alt ozet satiri -->
  <rect x="20" y="410" width="820" height="30" rx="3" fill="#1a2b40" fill-opacity="0.06"/>
  <text x="300" y="430" text-anchor="middle" font-size="10" fill="#1a8a3a">RX-only (S1 analiz, S2, S4): izolasyon tavsiye</text>
  <text x="620" y="430" text-anchor="middle" font-size="10" fill="#c0392b">TX zorunlu (S3 TX, S5, S6): KABLO+ATT birincil — Faraday yedek</text>

</svg>
