<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="860" height="480" fill="#f4f7fb"/>
  <text x="430" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a2b40">Modulasyon ve Kodlama: QPSK / 8PSK / 16APSK / 32APSK</text>
  <line x1="20" y1="38" x2="840" y2="38" stroke="#9fb3c8" stroke-width="0.8"/>

  <!-- Sol panel: Konstelasyon diyagramlari -->
  <rect x="20" y="44" width="470" height="400" fill="#ffffff" stroke="#9fb3c8" stroke-width="1" rx="3"/>
  <text x="255" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a5a70">Konstelasyon Diyagramlari</text>

  <!-- QPSK (sol ust) -->
  <rect x="30" y="72" width="210" height="165" fill="#f9f9fb" stroke="#d3dde8" stroke-width="0.8" rx="2"/>
  <text x="135" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">QPSK — 2 bit/sembol</text>

  <!-- Koordinat eksenleri QPSK -->
  <line x1="55" y1="155" x2="225" y2="155" stroke="#d3dde8" stroke-width="1"/>
  <line x1="135" y1="96" x2="135" y2="228" stroke="#d3dde8" stroke-width="1"/>

  <!-- QPSK noktalar (4 nokta) -->
  <circle cx="100" cy="120" r="7" fill="#1565c0"/>
  <circle cx="170" cy="120" r="7" fill="#1565c0"/>
  <circle cx="100" cy="190" r="7" fill="#1565c0"/>
  <circle cx="170" cy="190" r="7" fill="#1565c0"/>
  <!-- Etiketler -->
  <text x="86" y="113" font-size="8" fill="#1565c0">00</text>
  <text x="174" y="113" font-size="8" fill="#1565c0">01</text>
  <text x="86" y="197" font-size="8" fill="#1565c0">10</text>
  <text x="174" y="197" font-size="8" fill="#1565c0">11</text>
  <!-- Cevre daire -->
  <circle cx="135" cy="155" r="48" fill="none" stroke="#1565c0" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
  <text x="135" y="238" text-anchor="middle" font-size="9" fill="#1565c0">4 nokta, 1 halka, en dayanikli</text>

  <!-- 8PSK (sag ust) -->
  <rect x="250" y="72" width="228" height="165" fill="#f9f9fb" stroke="#d3dde8" stroke-width="0.8" rx="2"/>
  <text x="364" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#ff8f00">8PSK — 3 bit/sembol</text>

  <!-- Koordinat eksenleri 8PSK -->
  <line x1="275" y1="155" x2="460" y2="155" stroke="#d3dde8" stroke-width="1"/>
  <line x1="364" y1="96" x2="364" y2="228" stroke="#d3dde8" stroke-width="1"/>

  <!-- 8PSK noktalar (8 nokta, cember uzerinde) -->
  <!-- 45 derecede bir: 0, 45, 90, 135, 180, 225, 270, 315 -->
  <circle cx="414" cy="155" r="6" fill="#ff8f00"/>
  <circle cx="399" cy="120" r="6" fill="#ff8f00"/>
  <circle cx="364" cy="105" r="6" fill="#ff8f00"/>
  <circle cx="329" cy="120" r="6" fill="#ff8f00"/>
  <circle cx="314" cy="155" r="6" fill="#ff8f00"/>
  <circle cx="329" cy="190" r="6" fill="#ff8f00"/>
  <circle cx="364" cy="205" r="6" fill="#ff8f00"/>
  <circle cx="399" cy="190" r="6" fill="#ff8f00"/>
  <circle cx="364" cy="155" r="50" fill="none" stroke="#ff8f00" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
  <text x="364" y="238" text-anchor="middle" font-size="9" fill="#ff8f00">8 nokta, 1 halka, daha verimli</text>

  <!-- 16APSK (sol alt) -->
  <rect x="30" y="248" width="210" height="175" fill="#f9f9fb" stroke="#d3dde8" stroke-width="0.8" rx="2"/>
  <text x="135" y="265" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a8a3a">16APSK — 4 bit/sembol</text>

  <!-- Koordinat eksenleri 16APSK -->
  <line x1="55" y1="330" x2="225" y2="330" stroke="#d3dde8" stroke-width="1"/>
  <line x1="135" y1="270" x2="135" y2="408" stroke="#d3dde8" stroke-width="1"/>

  <!-- 16APSK: ic halka 4 nokta, dis halka 12 nokta -->
  <!-- Ic halka (kucuk r=18): 4 nokta -->
  <circle cx="153" cy="312" r="5" fill="#1a8a3a"/>
  <circle cx="117" cy="312" r="5" fill="#1a8a3a"/>
  <circle cx="153" cy="348" r="5" fill="#1a8a3a"/>
  <circle cx="117" cy="348" r="5" fill="#1a8a3a"/>
  <circle cx="135" cy="330" r="18" fill="none" stroke="#1a8a3a" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.5"/>
  <!-- Dis halka (buyuk r=38): 12 nokta, her 30 derece -->
  <circle cx="173" cy="330" r="4" fill="#1a8a3a"/>
  <circle cx="168" cy="311" r="4" fill="#1a8a3a"/>
  <circle cx="154" cy="297" r="4" fill="#1a8a3a"/>
  <circle cx="135" cy="292" r="4" fill="#1a8a3a"/>
  <circle cx="116" cy="297" r="4" fill="#1a8a3a"/>
  <circle cx="102" cy="311" r="4" fill="#1a8a3a"/>
  <circle cx="97" cy="330" r="4" fill="#1a8a3a"/>
  <circle cx="102" cy="349" r="4" fill="#1a8a3a"/>
  <circle cx="116" cy="363" r="4" fill="#1a8a3a"/>
  <circle cx="135" cy="368" r="4" fill="#1a8a3a"/>
  <circle cx="154" cy="363" r="4" fill="#1a8a3a"/>
  <circle cx="168" cy="349" r="4" fill="#1a8a3a"/>
  <circle cx="135" cy="330" r="38" fill="none" stroke="#1a8a3a" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.5"/>
  <text x="135" y="418" text-anchor="middle" font-size="9" fill="#1a8a3a">2 halka (4+12), nonlineer HPA uyumlu</text>

  <!-- 32APSK (sag alt) -->
  <rect x="250" y="248" width="228" height="175" fill="#f9f9fb" stroke="#d3dde8" stroke-width="0.8" rx="2"/>
  <text x="364" y="265" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">32APSK — 5 bit/sembol</text>

  <!-- 32APSK: 3 halka -->
  <line x1="275" y1="330" x2="460" y2="330" stroke="#d3dde8" stroke-width="1"/>
  <line x1="364" y1="270" x2="364" y2="408" stroke="#d3dde8" stroke-width="1"/>
  <!-- Ic halka 4 -->
  <circle cx="382" cy="312" r="4" fill="#c0392b"/>
  <circle cx="346" cy="312" r="4" fill="#c0392b"/>
  <circle cx="382" cy="348" r="4" fill="#c0392b"/>
  <circle cx="346" cy="348" r="4" fill="#c0392b"/>
  <circle cx="364" cy="330" r="18" fill="none" stroke="#c0392b" stroke-width="0.7" stroke-dasharray="3,2" opacity="0.5"/>
  <!-- Orta halka 12 -->
  <circle cx="403" cy="330" r="3.5" fill="#c0392b"/>
  <circle cx="397" cy="311" r="3.5" fill="#c0392b"/>
  <circle cx="383" cy="297" r="3.5" fill="#c0392b"/>
  <circle cx="364" cy="292" r="3.5" fill="#c0392b"/>
  <circle cx="345" cy="297" r="3.5" fill="#c0392b"/>
  <circle cx="331" cy="311" r="3.5" fill="#c0392b"/>
  <circle cx="325" cy="330" r="3.5" fill="#c0392b"/>
  <circle cx="331" cy="349" r="3.5" fill="#c0392b"/>
  <circle cx="345" cy="363" r="3.5" fill="#c0392b"/>
  <circle cx="364" cy="368" r="3.5" fill="#c0392b"/>
  <circle cx="383" cy="363" r="3.5" fill="#c0392b"/>
  <circle cx="397" cy="349" r="3.5" fill="#c0392b"/>
  <circle cx="364" cy="330" r="39" fill="none" stroke="#c0392b" stroke-width="0.7" stroke-dasharray="3,2" opacity="0.5"/>
  <!-- Dis halka 16 (her 22.5 derece) -->
  <!-- sadece bir kismini goster -->
  <circle cx="420" cy="330" r="3" fill="#c0392b" opacity="0.7"/>
  <circle cx="414" cy="305" r="3" fill="#c0392b" opacity="0.7"/>
  <circle cx="396" cy="286" r="3" fill="#c0392b" opacity="0.7"/>
  <circle cx="372" cy="274" r="3" fill="#c0392b" opacity="0.7"/>
  <circle cx="347" cy="277" r="3" fill="#c0392b" opacity="0.7"/>
  <circle cx="329" cy="293" r="3" fill="#c0392b" opacity="0.7"/>
  <circle cx="318" cy="314" r="3" fill="#c0392b" opacity="0.7"/>
  <circle cx="318" cy="346" r="3" fill="#c0392b" opacity="0.7"/>
  <circle cx="329" cy="367" r="3" fill="#c0392b" opacity="0.7"/>
  <circle cx="347" cy="383" r="3" fill="#c0392b" opacity="0.7"/>
  <circle cx="372" cy="386" r="3" fill="#c0392b" opacity="0.7"/>
  <circle cx="396" cy="374" r="3" fill="#c0392b" opacity="0.7"/>
  <circle cx="414" cy="355" r="3" fill="#c0392b" opacity="0.7"/>
  <circle cx="420" cy="330" r="56" fill="none" stroke="#c0392b" stroke-width="0.7" stroke-dasharray="3,2" opacity="0.4"/>
  <text x="364" y="418" text-anchor="middle" font-size="9" fill="#c0392b">3 halka, en verimli, yuksek SNR gerekir</text>

  <!-- ===== SAG PANEL: Verim-Dayaniklilik ====== -->
  <rect x="500" y="44" width="340" height="400" fill="#ffffff" stroke="#9fb3c8" stroke-width="1" rx="3"/>
  <text x="670" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a5a70">Spektral Verim vs SNR Gerekliligi</text>

  <!-- Eksenler -->
  <line x1="530" y1="370" x2="825" y2="370" stroke="#6b7a90" stroke-width="1.5"/>
  <line x1="530" y1="370" x2="530" y2="90" stroke="#6b7a90" stroke-width="1.5"/>
  <polygon points="822,366 830,370 822,374" fill="#6b7a90"/>
  <polygon points="526,92 530,85 534,92" fill="#6b7a90"/>
  <text x="832" y="374" font-size="10" fill="#4a5a70">SNR</text>
  <text x="505" y="88" font-size="10" fill="#4a5a70">bit/Hz</text>

  <!-- Eksen degerleri -->
  <line x1="528" y1="330" x2="532" y2="330" stroke="#6b7a90" stroke-width="1"/>
  <text x="510" y="334" font-size="8" fill="#4a5a70">1</text>
  <line x1="528" y1="275" x2="532" y2="275" stroke="#6b7a90" stroke-width="1"/>
  <text x="510" y="279" font-size="8" fill="#4a5a70">2</text>
  <line x1="528" y1="220" x2="532" y2="220" stroke="#6b7a90" stroke-width="1"/>
  <text x="510" y="224" font-size="8" fill="#4a5a70">3</text>
  <line x1="528" y1="165" x2="532" y2="165" stroke="#6b7a90" stroke-width="1"/>
  <text x="510" y="169" font-size="8" fill="#4a5a70">4</text>
  <line x1="528" y1="110" x2="532" y2="110" stroke="#6b7a90" stroke-width="1"/>
  <text x="510" y="114" font-size="8" fill="#4a5a70">5</text>

  <!-- SNR ekseni isaretleri -->
  <line x1="580" y1="368" x2="580" y2="372" stroke="#6b7a90" stroke-width="1"/>
  <text x="567" y="384" font-size="8" fill="#4a5a70">5 dB</text>
  <line x1="640" y1="368" x2="640" y2="372" stroke="#6b7a90" stroke-width="1"/>
  <text x="627" y="384" font-size="8" fill="#4a5a70">10 dB</text>
  <line x1="700" y1="368" x2="700" y2="372" stroke="#6b7a90" stroke-width="1"/>
  <text x="687" y="384" font-size="8" fill="#4a5a70">15 dB</text>
  <line x1="760" y1="368" x2="760" y2="372" stroke="#6b7a90" stroke-width="1"/>
  <text x="747" y="384" font-size="8" fill="#4a5a70">20 dB</text>
  <line x1="810" y1="368" x2="810" y2="372" stroke="#6b7a90" stroke-width="1"/>
  <text x="797" y="384" font-size="8" fill="#4a5a70">25 dB</text>

  <!-- QPSK nokta (dusuk SNR, dusuk verim) -->
  <circle cx="580" cy="275" r="10" fill="#1565c0" opacity="0.85"/>
  <text x="545" y="271" font-size="9" font-weight="bold" fill="#1565c0">QPSK</text>
  <text x="545" y="283" font-size="8" fill="#1565c0">2 bit/Hz</text>

  <!-- 8PSK -->
  <circle cx="650" cy="220" r="10" fill="#ff8f00" opacity="0.85"/>
  <text x="665" y="216" font-size="9" font-weight="bold" fill="#ff8f00">8PSK</text>
  <text x="665" y="228" font-size="8" fill="#ff8f00">3 bit/Hz</text>

  <!-- 16APSK -->
  <circle cx="720" cy="165" r="10" fill="#1a8a3a" opacity="0.85"/>
  <text x="735" y="161" font-size="9" font-weight="bold" fill="#1a8a3a">16APSK</text>
  <text x="735" y="173" font-size="8" fill="#1a8a3a">4 bit/Hz</text>

  <!-- 32APSK -->
  <circle cx="795" cy="110" r="10" fill="#c0392b" opacity="0.85"/>
  <text x="765" y="104" font-size="9" font-weight="bold" fill="#c0392b">32APSK</text>
  <text x="765" y="116" font-size="8" fill="#c0392b">5 bit/Hz</text>

  <!-- Egrinin altindaki bolge - dayaniklilik -->
  <path d="M 530 370 Q 580 275 650 220 Q 720 165 795 110" fill="none" stroke="#6b7a90" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Ok: daha verimli -->
  <line x1="590" y1="135" x2="790" y2="135" stroke="#c0392b" stroke-width="1.5"/>
  <polygon points="788,131 796,135 788,139" fill="#c0392b"/>
  <text x="680" y="130" text-anchor="middle" font-size="9" fill="#c0392b">daha verimli →</text>

  <!-- Ok: daha dayanikli -->
  <line x1="545" y1="330" x2="545" y2="130" stroke="#1565c0" stroke-width="1.5"/>
  <polygon points="541,132 545,124 549,132" fill="#1565c0"/>
  <text x="545" y="402" text-anchor="middle" font-size="8" fill="#1565c0" transform="rotate(-90,545,270)">← daha dayanikli</text>

  <!-- ACM ok ve aciklama -->
  <rect x="540" y="190" width="145" height="55" fill="#fff8e6" stroke="#ff8f00" stroke-width="1" rx="2"/>
  <text x="613" y="207" text-anchor="middle" font-size="9" font-weight="bold" fill="#ff8f00">DVB-S2 ACM</text>
  <text x="613" y="220" text-anchor="middle" font-size="8" fill="#36506e">Yagmurda: QPSK ↓</text>
  <text x="613" y="233" font-size="8" fill="#36506e">Açık havada: 32APSK ↑</text>
  <text x="613" y="245" text-anchor="middle" font-size="8" fill="#36506e">Otomatik vites secimi</text>

  <!-- Alt aciklama -->
  <rect x="20" y="448" width="820" height="30" fill="#f4f7fb"/>
  <line x1="20" y1="448" x2="840" y2="448" stroke="#d3dde8" stroke-width="0.8"/>
  <text x="430" y="463" text-anchor="middle" font-size="10" fill="#1a2b40">
    <tspan font-weight="bold">Uydu sezgisi:</tspan> HPA doygunlukta calısır → genlik bilgisini sıkıstırır. Bu yüzden uydu "halka" yapılı APSK'yı sever. Yüksek SNR = yüksek vites (32APSK); düsük SNR / yagmur = düsük vites (QPSK).
  </text>
</svg>
