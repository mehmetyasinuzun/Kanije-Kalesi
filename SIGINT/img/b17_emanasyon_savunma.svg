<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" font-family="Segoe UI, Arial, sans-serif">
  <rect width="860" height="480" fill="#f4f7fb"/>
  <text x="430" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a2b40">Emanasyon Turleri ve Savunma Eslestirmesi</text>

  <!-- Panel -->
  <rect x="30" y="44" width="800" height="410" fill="#fff" stroke="#9fb3c8" stroke-width="1"/>

  <!-- Merkez: cihaz silueti -->
  <rect x="360" y="160" width="140" height="110" rx="10" fill="#1565c0" opacity="0.14" stroke="#1565c0" stroke-width="2"/>
  <text x="430" y="192" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">CIHAZ</text>
  <text x="430" y="208" text-anchor="middle" font-size="10" fill="#1565c0">(bilgisayar /</text>
  <text x="430" y="222" text-anchor="middle" font-size="10" fill="#1565c0">kripto cihaz /</text>
  <text x="430" y="236" text-anchor="middle" font-size="10" fill="#1565c0">akilli kart)</text>
  <text x="430" y="254" text-anchor="middle" font-size="9" fill="#1565c0">&#9679; calisirken istem</text>
  <text x="430" y="265" text-anchor="middle" font-size="9" fill="#1565c0">&#9679; disiz yayar</text>

  <!-- 5 kanal: tanimlar -->
  <!-- 1: Yayilan EM - sol ust -->
  <rect x="44" y="60" width="190" height="78" fill="#c0392b" opacity="0.10" stroke="#c0392b" stroke-width="1.5" rx="5"/>
  <text x="139" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Yayilan EM</text>
  <text x="139" y="96" text-anchor="middle" font-size="9.5" fill="#4a5a70">Kablo/iz/veri yolundan</text>
  <text x="139" y="110" text-anchor="middle" font-size="9.5" fill="#4a5a70">havaya yayilan RF</text>
  <text x="139" y="124" text-anchor="middle" font-size="9.5" fill="#6b7a90">(ekran kablosu, bus)</text>

  <!-- Ok 1 -->
  <line x1="234" y1="120" x2="360" y2="180" stroke="#c0392b" stroke-width="2"/>
  <defs>
    <marker id="rm1" markerWidth="7" markerHeight="7" refX="1" refY="3" orient="auto">
      <polygon points="7,0 0,3 7,6" fill="#c0392b"/>
    </marker>
  </defs>
  <line x1="360" y1="180" x2="234" y2="120" stroke="#c0392b" stroke-width="2" marker-end="url(#rm1)"/>

  <!-- 2: Iletilen EM - sol alt -->
  <rect x="44" y="200" width="190" height="78" fill="#ff8f00" opacity="0.10" stroke="#ff8f00" stroke-width="1.5" rx="5"/>
  <text x="139" y="220" text-anchor="middle" font-size="11" font-weight="bold" fill="#ff8f00">Iletilen EM</text>
  <text x="139" y="236" text-anchor="middle" font-size="9.5" fill="#4a5a70">Guc/topraklama</text>
  <text x="139" y="250" text-anchor="middle" font-size="9.5" fill="#4a5a70">hatti uzerinden</text>
  <text x="139" y="264" text-anchor="middle" font-size="9.5" fill="#6b7a90">(guc kablosu, toprak)</text>
  <defs>
    <marker id="or1" markerWidth="7" markerHeight="7" refX="1" refY="3" orient="auto">
      <polygon points="7,0 0,3 7,6" fill="#ff8f00"/>
    </marker>
  </defs>
  <line x1="234" y1="230" x2="360" y2="215" stroke="#ff8f00" stroke-width="2" marker-end="url(#or1)"/>

  <!-- 3: Akustik - sol alt 2 -->
  <rect x="44" y="330" width="190" height="78" fill="#6b7a90" opacity="0.12" stroke="#6b7a90" stroke-width="1.5" rx="5"/>
  <text x="139" y="350" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b7a90">Akustik</text>
  <text x="139" y="366" text-anchor="middle" font-size="9.5" fill="#4a5a70">Bobin cizirtisi,</text>
  <text x="139" y="380" text-anchor="middle" font-size="9.5" fill="#4a5a70">klavye, fan sesi</text>
  <text x="139" y="394" text-anchor="middle" font-size="9.5" fill="#6b7a90">(ses dalgas)</text>
  <defs>
    <marker id="gr1" markerWidth="7" markerHeight="7" refX="1" refY="3" orient="auto">
      <polygon points="7,0 0,3 7,6" fill="#6b7a90"/>
    </marker>
  </defs>
  <line x1="234" y1="350" x2="360" y2="260" stroke="#6b7a90" stroke-width="2" marker-end="url(#gr1)"/>

  <!-- 4: Guc tuketime (sag taraf) -->
  <rect x="626" y="200" width="190" height="78" fill="#1a8a3a" opacity="0.10" stroke="#1a8a3a" stroke-width="1.5" rx="5"/>
  <text x="721" y="220" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a8a3a">Guc Tuketimi</text>
  <text x="721" y="236" text-anchor="middle" font-size="9.5" fill="#4a5a70">Anlik akım degisimleri</text>
  <text x="721" y="250" text-anchor="middle" font-size="9.5" fill="#4a5a70">isleme baglidır</text>
  <text x="721" y="264" text-anchor="middle" font-size="9.5" fill="#6b7a90">(SPA/DPA hedefi)</text>
  <defs>
    <marker id="gn1" markerWidth="7" markerHeight="7" refX="1" refY="3" orient="auto">
      <polygon points="7,0 0,3 7,6" fill="#1a8a3a"/>
    </marker>
  </defs>
  <line x1="500" y1="215" x2="626" y2="230" stroke="#1a8a3a" stroke-width="2" marker-end="url(#gn1)"/>

  <!-- 5: Optik (sag ust) -->
  <rect x="626" y="60" width="190" height="78" fill="#1565c0" opacity="0.10" stroke="#1565c0" stroke-width="1.5" rx="5"/>
  <text x="721" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">Optik</text>
  <text x="721" y="96" text-anchor="middle" font-size="9.5" fill="#4a5a70">LED goстергелeri,</text>
  <text x="721" y="110" text-anchor="middle" font-size="9.5" fill="#4a5a70">ekran parlak yans.</text>
  <text x="721" y="124" text-anchor="middle" font-size="9.5" fill="#6b7a90">(gorsel kanal)</text>
  <defs>
    <marker id="bl1" markerWidth="7" markerHeight="7" refX="1" refY="3" orient="auto">
      <polygon points="7,0 0,3 7,6" fill="#1565c0"/>
    </marker>
  </defs>
  <line x1="500" y1="180" x2="626" y2="120" stroke="#1565c0" stroke-width="2" marker-end="url(#bl1)"/>

  <!-- Savunma tablosu altta -->
  <rect x="44" y="424" width="772" height="24" fill="#f4f7fb" stroke="#d3dde8" stroke-width="1" rx="3"/>
  <text x="430" y="441" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a2b40">Savunma:</text>

  <!-- 5 savunma bilgisi satirlari -->
  <rect x="44" y="326" width="0" height="0"/><!-- bos, yer kapla -->

  <!-- Savunma tablosu: 5 sutun -->
  <rect x="44" y="450" width="150" height="22" fill="#c0392b" opacity="0.10" stroke="#c0392b" stroke-width="1" rx="2"/>
  <text x="119" y="465" text-anchor="middle" font-size="9" fill="#c0392b">Ekranlama + Mesafe</text>

  <rect x="200" y="450" width="150" height="22" fill="#ff8f00" opacity="0.10" stroke="#ff8f00" stroke-width="1" rx="2"/>
  <text x="275" y="465" text-anchor="middle" font-size="9" fill="#ff8f00">Hat Filtreleri + Ferrit</text>

  <rect x="356" y="450" width="150" height="22" fill="#6b7a90" opacity="0.12" stroke="#6b7a90" stroke-width="1" rx="2"/>
  <text x="431" y="465" text-anchor="middle" font-size="9" fill="#6b7a90">Ses Yalitim + Maskeleme</text>

  <rect x="512" y="450" width="150" height="22" fill="#1a8a3a" opacity="0.10" stroke="#1a8a3a" stroke-width="1" rx="2"/>
  <text x="587" y="465" text-anchor="middle" font-size="9" fill="#1a8a3a">Sabit-guc + Gürültu</text>

  <rect x="668" y="450" width="148" height="22" fill="#1565c0" opacity="0.10" stroke="#1565c0" stroke-width="1" rx="2"/>
  <text x="742" y="465" text-anchor="middle" font-size="9" fill="#1565c0">LED Maskeleme + Perde</text>
</svg>
