<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrB" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#1565c0"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#c0392b"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#1a8a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#ff8f00"/>
    </marker>
  </defs>

  <rect width="860" height="480" fill="#f4f7fb"/>
  <text x="430" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a2b40">PKES: Normal Calisma + Relay Saldirisi Prensibi + UWB Savunma</text>

  <!-- SOL PANEL: Normal PKES -->
  <rect x="20" y="44" width="380" height="380" rx="6" fill="#ffffff" stroke="#9fb3c8" stroke-width="1"/>
  <text x="210" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a8a3a">Normal PKES Calisma</text>

  <!-- Arac sol -->
  <rect x="40" y="90" width="140" height="80" rx="6" fill="#e8f4fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="110" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">ARAC</text>
  <text x="110" y="134" text-anchor="middle" font-size="10" fill="#4a5a70">LF Anten (125 kHz)</text>
  <text x="110" y="148" text-anchor="middle" font-size="9" fill="#6b7a90">~1-2 m kisa menzil</text>
  <text x="110" y="160" text-anchor="middle" font-size="9" fill="#6b7a90">UHF alici 315/433 MHz</text>

  <!-- Anahtar sol -->
  <rect x="230" y="100" width="100" height="60" rx="6" fill="#e8fde8" stroke="#1a8a3a" stroke-width="1.5"/>
  <text x="280" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a8a3a">ANAHTAR</text>
  <text x="280" y="138" text-anchor="middle" font-size="9" fill="#4a5a70">(cepte ~1m)</text>
  <text x="280" y="152" text-anchor="middle" font-size="9" fill="#6b7a90">pil, LF+UHF</text>

  <!-- LF ok: arac -> anahtar -->
  <line x1="180" y1="126" x2="228" y2="126" stroke="#1565c0" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="204" y="118" text-anchor="middle" font-size="9" fill="#1565c0" font-weight="bold">LF sorgu</text>
  <text x="204" y="127" text-anchor="middle" font-size="8" fill="#1565c0">125 kHz</text>
  <text x="204" y="136" text-anchor="middle" font-size="8" fill="#6b7a90">challenge</text>

  <!-- UHF ok: anahtar -> arac -->
  <line x1="228" y1="148" x2="180" y2="148" stroke="#1a8a3a" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="204" y="160" text-anchor="middle" font-size="9" fill="#1a8a3a" font-weight="bold">UHF yanit</text>
  <text x="204" y="169" text-anchor="middle" font-size="8" fill="#1a8a3a">315/433 MHz</text>
  <text x="204" y="178" text-anchor="middle" font-size="8" fill="#6b7a90">kripto response</text>

  <!-- Onay -->
  <rect x="40" y="196" width="330" height="42" rx="4" fill="#e8fde8" stroke="#1a8a3a" stroke-width="1"/>
  <text x="205" y="215" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a8a3a">Challenge-Response Gecerli</text>
  <text x="205" y="231" text-anchor="middle" font-size="10" fill="#4a5a70">Anahtar yakin + kriptografik onay → Kapi Acilir / Motor Calisir</text>

  <!-- Zayiflik notu -->
  <rect x="40" y="250" width="330" height="60" rx="4" fill="#fff8e1" stroke="#ff8f00" stroke-width="1"/>
  <text x="205" y="268" text-anchor="middle" font-size="11" font-weight="bold" fill="#ff8f00">Zayiflik: Mesafe OLCULMEZ</text>
  <text x="205" y="284" text-anchor="middle" font-size="9" fill="#5a6b80">"LF duyulabilmek = fiziksel yakin" VARSAYIMI</text>
  <text x="205" y="298" text-anchor="middle" font-size="9" fill="#5a6b80">LF menzili kisa → mesafe vekili (proxy) olarak kullanilir</text>
  <text x="205" y="312" text-anchor="middle" font-size="9" fill="#c0392b">Kriptografi gecerli, mesafe dogrulanmiyor → RELAY hedefi</text>

  <!-- UWB savunma -->
  <rect x="40" y="324" width="330" height="80" rx="4" fill="#e8f4fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="205" y="342" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">UWB Savunma: Gercek Mesafe Olcumu</text>
  <text x="205" y="358" text-anchor="middle" font-size="9" fill="#4a5a70">Time-of-Flight: giris-donus suresi → gercek fiziksel mesafe</text>
  <text x="205" y="372" text-anchor="middle" font-size="9" fill="#4a5a70">Relay'in ekledigı gecikme "uzak" sonuc verir → sistem reddeder</text>
  <text x="205" y="386" text-anchor="middle" font-size="9" fill="#1a8a3a" font-weight="bold">+ Hareket-sensörlu fob + Faraday kesesi (kullanici onlemi)</text>
  <text x="205" y="400" text-anchor="middle" font-size="9" fill="#1565c0" font-weight="bold">Yapısal cozum: "yakın gorünmek ≠ fiziksel yakin" farkı UWB ile ayirt edilir</text>

  <!-- AYIRICI -->
  <line x1="420" y1="44" x2="420" y2="424" stroke="#d3dde8" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="430" y="435" text-anchor="middle" font-size="10" fill="#6b7a90">SAVUNMA ▶</text>

  <!-- SAG PANEL: Relay Prensibi -->
  <rect x="440" y="44" width="400" height="380" rx="6" fill="#ffffff" stroke="#9fb3c8" stroke-width="1"/>
  <text x="640" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Relay Saldirisi — Yalnizca Prensip</text>

  <!-- Arac sag -->
  <rect x="460" y="82" width="120" height="72" rx="5" fill="#e8f4fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="520" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">ARAC</text>
  <text x="520" y="120" text-anchor="middle" font-size="9" fill="#4a5a70">(sokakta)</text>
  <text x="520" y="134" text-anchor="middle" font-size="9" fill="#6b7a90">LF yayar, UHF bekler</text>
  <text x="520" y="148" text-anchor="middle" font-size="9" fill="#c0392b">mesafe OLCMUYOR</text>

  <!-- Anahtar sag -->
  <rect x="700" y="82" width="110" height="72" rx="5" fill="#e8fde8" stroke="#1a8a3a" stroke-width="1.5"/>
  <text x="755" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a8a3a">ANAHTAR</text>
  <text x="755" y="120" text-anchor="middle" font-size="9" fill="#4a5a70">(evde, uzakta)</text>
  <text x="755" y="134" text-anchor="middle" font-size="9" fill="#6b7a90">LF duymaz</text>
  <text x="755" y="148" text-anchor="middle" font-size="9" fill="#1a8a3a">gercek kripto var</text>

  <!-- Cihaz A -->
  <rect x="460" y="196" width="100" height="52" rx="4" fill="#fce8e8" stroke="#c0392b" stroke-width="1.5"/>
  <text x="510" y="218" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Cihaz A</text>
  <text x="510" y="232" text-anchor="middle" font-size="9" fill="#5a6b80">(aracın yanında)</text>
  <text x="510" y="244" text-anchor="middle" font-size="9" fill="#5a6b80">LF alir, kanallar</text>

  <!-- Cihaz B -->
  <rect x="700" y="196" width="110" height="52" rx="4" fill="#fce8e8" stroke="#c0392b" stroke-width="1.5"/>
  <text x="755" y="218" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Cihaz B</text>
  <text x="755" y="232" text-anchor="middle" font-size="9" fill="#5a6b80">(anahtar yanında)</text>
  <text x="755" y="244" text-anchor="middle" font-size="9" fill="#5a6b80">LF yayar, UHF alir</text>

  <!-- LF: arac -> cihazA -->
  <line x1="520" y1="154" x2="510" y2="196" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrB)"/>
  <text x="498" y="178" font-size="9" fill="#1565c0">LF ↓</text>

  <!-- Kopru oku A->B -->
  <line x1="560" y1="222" x2="700" y2="222" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrR)"/>
  <text x="630" y="215" text-anchor="middle" font-size="9" fill="#c0392b" font-weight="bold">⇢⇢ uzun kopru (kablo/RF) ⇢⇢</text>

  <!-- LF: CihazB -> Anahtar -->
  <line x1="755" y1="196" x2="755" y2="154" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrB)"/>
  <text x="775" y="178" font-size="9" fill="#1565c0">LF ↑</text>
  <text x="775" y="190" font-size="9" fill="#6b7a90">(yapay)</text>

  <!-- UHF: Anahtar -> CihazB -->
  <line x1="730" y1="248" x2="730" y2="275" stroke="#1a8a3a" stroke-width="1.5" marker-end="url(#arrG)"/>

  <!-- UHF: CihazB -> CihazA -->
  <line x1="700" y1="270" x2="560" y2="270" stroke="#1a8a3a" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrG)"/>
  <text x="630" y="265" text-anchor="middle" font-size="9" fill="#1a8a3a" font-weight="bold">⇠⇠ UHF yanit kopru ⇠⇠</text>

  <!-- UHF: CihazA -> Arac -->
  <line x1="490" y1="248" x2="490" y2="275" stroke="#1a8a3a" stroke-width="1.5" marker-end="url(#arrG)"/>

  <!-- Sonuc -->
  <rect x="460" y="288" width="350" height="42" rx="4" fill="#fce8e8" stroke="#c0392b" stroke-width="1.5"/>
  <text x="635" y="306" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">Arac "anahtar yakin" sanir → Kapi Acilir</text>
  <text x="635" y="322" text-anchor="middle" font-size="9" fill="#5a6b80">Kripto kirilmaz | Yanit gercek ve gecerli | MESAFE yalanlanir</text>

  <!-- Anahtar neden hedef -->
  <rect x="460" y="342" width="350" height="72" rx="4" fill="#f4f7fb" stroke="#6b7a90" stroke-width="1"/>
  <text x="635" y="360" text-anchor="middle" font-size="11" font-weight="bold" fill="#36506e">Neden Mumkun?</text>
  <text x="635" y="376" text-anchor="middle" font-size="9" fill="#4a5a70">PKES mesafeyi dogrudan olcmez; LF menzili</text>
  <text x="635" y="390" text-anchor="middle" font-size="9" fill="#4a5a70">vekil olarak kullanilir → kopru bu vekili gecersiz kilar</text>
  <text x="635" y="404" text-anchor="middle" font-size="9" fill="#1565c0" font-weight="bold">UWB ToF → gercek mesafe → relay'in gecikmesi "uzak" yazar → RET</text>

  <!-- Alt bilgi -->
  <text x="430" y="460" text-anchor="middle" font-size="10" fill="#6b7a90">LF ~125 kHz (kisa menzil sorgu) + UHF ~315/433/868 MHz (kripto yanit) | Relay: kripto kirilmaz, MESAFE yalanlanir</text>
</svg>
