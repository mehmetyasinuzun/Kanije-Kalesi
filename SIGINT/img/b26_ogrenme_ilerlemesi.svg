  <text x="712" y="162" text-anchor="middle" font-size="9" fill="#6b7a90">Sure: ~1 saat</text>
  <text x="712" y="176" text-anchor="middle" font-size="9" fill="#1a8a3a">Yasal: Acik yayın RX</text>

