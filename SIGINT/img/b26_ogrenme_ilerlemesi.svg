<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" font-family="Segoe UI, Arial, sans-serif">
  <rect width="820" height="500" fill="#f4f7fb"/>
  <text x="410" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a2b40">Ogrenme Ilerlemesi: 11 Proje Merdiveni</text>
  <text x="410" y="46" text-anchor="middle" font-size="11" fill="#6b7a90">Basamak 1 (temel sezi) → Basamak 6 (ileri altyapı)</text>

  <defs>
    <marker id="nxt" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
    </marker>
    <marker id="nxtg" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1a8a3a"/>
    </marker>
    <marker id="nxto" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff8f00"/>
    </marker>
  </defs>

  <!-- Sol taraf: Merdiven (dikey, basamak 1-6) -->
  <!-- Her basamak: kutu, renk koyulasir -->

  <!-- BASAMAK 1 -->
  <rect x="20" y="60" width="380" height="52" rx="5" fill="#1565c0" opacity="0.9"/>
  <text x="30" y="80" font-size="11" font-weight="bold" fill="white">BASAMAK 1 — TEMEL DUYU (Zorunlu Baslangic)</text>
  <text x="30" y="98" font-size="10" fill="white">P1: FM/Airband → 4 temel ayar, waterfall, gain, demod sezgisi</text>
  <!-- Beceri etiketi -->
  <rect x="405" y="62" width="205" height="46" rx="4" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="507" y="80" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565c0">Kazanılan Beceri</text>
  <text x="507" y="96" text-anchor="middle" font-size="9" fill="#4a5a70">Merkez freq, BW, demod, gain</text>
  <text x="507" y="108" text-anchor="middle" font-size="9" fill="#4a5a70">Waterfall okuma · IQ kayit</text>
  <!-- Zorluk / sure -->
  <rect x="617" y="62" width="190" height="46" rx="4" fill="#ffffff" stroke="#6b7a90" stroke-width="1"/>
  <text x="712" y="80" text-anchor="middle" font-size="9" fill="#6b7a90">Zorluk: Baslangic</text>
  <text x="712" y="94" text-anchor="middle" font-size="9" fill="#6b7a90">Sure: ~30-60 dk</text>
  <text x="712" y="108" text-anchor="middle" font-size="9" fill="#1a8a3a">Yasal: Acik yayın RX</text>

  <line x1="210" y1="112" x2="210" y2="122" stroke="#1565c0" stroke-width="2" marker-end="url(#nxt)"/>

