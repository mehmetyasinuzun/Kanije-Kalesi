  <text x="30" y="366" font-size="11" font-weight="bold" fill="white">BASAMAK 5 — DERİNLESME</text>
  <text x="30" y="382" font-size="10" fill="white">P9: GNU Radio → akis-grafigi, ornk-hizi uyumu</text>
