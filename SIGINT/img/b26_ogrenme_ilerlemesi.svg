  <rect x="617" y="348" width="190" height="60" rx="4" fill="#ffffff" stroke="#6b7a90" stroke-width="1"/>
  <text x="712" y="370" text-anchor="middle" font-size="9" fill="#6b7a90">Zorluk: Orta</text>
  <text x="712" y="384" text-anchor="middle" font-size="9" fill="#6b7a90">Sure: ~2-3 saat</text>
  <text x="712" y="398" text-anchor="middle" font-size="9" fill="#ff8f00">Yasal: Kendi cihaz TX yok</text>

  <line x1="210" y1="412" x2="210" y2="422" stroke="#c0392b" stroke-width="2"/>

