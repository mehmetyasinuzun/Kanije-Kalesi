  <rect x="20" y="124" width="380" height="66" rx="5" fill="#1565c0" opacity="0.82"/>
  <text x="30" y="144" font-size="11" font-weight="bold" fill="white">BASAMAK 2 — COZUCU VE "VAY BE"</text>
  <text x="30" y="160" font-size="10" fill="white">P2: ADS-B uçak takip → anten/konum onemi, servis kavramı</text>
  <text x="30" y="176" font-size="10" fill="white">P4: rtl_433 sensör → RF→JSON→boru hattı, otomasyon</text>
  <rect x="405" y="126" width="205" height="60" rx="4" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
