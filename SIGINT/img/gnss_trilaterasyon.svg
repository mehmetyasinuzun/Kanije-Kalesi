<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="840" height="520" fill="#f4f7fb"/>
  <text x="420" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a2b40">GNSS Konum Kestirimi: Trilaterasyon ve Geometri (DOP)</text>

  <defs>
    <!-- uydu sembolu: govde + iki panel -->
    <g id="sat">
      <rect x="-7" y="-5" width="14" height="10" rx="2" fill="#37474f"/>
      <rect x="-20" y="-4" width="10" height="8" fill="#1565c0"/>
      <rect x="10" y="-4" width="10" height="8" fill="#1565c0"/>
      <line x1="0" y1="5" x2="0" y2="12" stroke="#37474f" stroke-width="1.5"/>
    </g>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6b7a90"/>
    </marker>
  </defs>

  <!-- ===================== ANA SAHNE (sol) ===================== -->
  <g>
    <rect x="20" y="50" width="470" height="450" fill="#ffffff" stroke="#9fb3c8" stroke-width="1"/>
    <text x="255" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a2b40">Uc uydudan mesafe daireleri tek noktada kesisir</text>

    <!-- mesafe daireleri (alici = (250,300) panel-icine offset: gercek koordinatlar asagida) -->
    <!-- Alici (250,300). Sat A (130,140) d=200 ; Sat B (390,145) d~209 ; Sat C (270,470) d~171 -->
    <g fill="none" stroke-width="1.6">
      <circle cx="130" cy="140" r="200" stroke="#1565c0" stroke-opacity="0.85"/>
      <circle cx="390" cy="145" r="208.9" stroke="#c0392b" stroke-opacity="0.85"/>
      <circle cx="270" cy="470" r="171.2" stroke="#1a8a3a" stroke-opacity="0.85"/>
    </g>

    <!-- mesafe (yaricap) cizgileri uydu->alici -->
    <g stroke="#6b7a90" stroke-width="1" stroke-dasharray="4 3">
      <line x1="130" y1="140" x2="250" y2="300"/>
      <line x1="390" y1="145" x2="250" y2="300"/>
      <line x1="270" y1="470" x2="250" y2="300"/>
    </g>
    <text x="172" y="208" font-size="10.5" fill="#5a6b80" transform="rotate(53 172 208)">mesafe = c.dt</text>

    <!-- uydular -->
    <use href="#sat" x="130" y="140"/>
    <use href="#sat" x="390" y="145"/>
    <use href="#sat" x="270" y="470"/>
    <text x="130" y="120" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#37474f">Uydu 1</text>
    <text x="390" y="125" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#37474f">Uydu 2</text>
    <text x="270" y="492" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#37474f">Uydu 3</text>

    <!-- alici konumu (kesisim) -->
    <circle cx="250" cy="300" r="6.5" fill="#ff8f00" stroke="#7a4a00" stroke-width="1.2"/>
    <text x="262" y="296" font-size="12.5" font-weight="bold" fill="#7a4a00">alici konumu</text>
    <text x="262" y="312" font-size="10.5" fill="#7a4a00">(dairelerin kesisimi)</text>

    <text x="36" y="486" font-size="10.5" fill="#4a5a70">4. uydu: alici saat hatasini cozer (3B konum + zaman).</text>
  </g>

  <!-- ===================== DOP KARSILASTIRMASI (sag) ===================== -->
  <g>
    <rect x="510" y="50" width="310" height="450" fill="#ffffff" stroke="#9fb3c8" stroke-width="1"/>
    <text x="665" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a2b40">Geometri kalitesi = DOP</text>

    <!-- IYI GEOMETRI: uydular genis yayilmis -> dar kesisim -> dusuk DOP -->
    <text x="665" y="100" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a8a3a">iyi geometri (dusuk DOP)</text>
    <!-- alici (665,185) -->
    <g fill="none" stroke-width="1.4">
      <!-- yayilmis uydulardan gelen daireler genis acilarla kesisir -->
      <circle cx="565" cy="135" r="111.8" stroke="#1565c0" stroke-opacity="0.8"/>
      <circle cx="770" cy="140" r="113.4" stroke="#c0392b" stroke-opacity="0.8"/>
      <circle cx="665" cy="265" r="80"  stroke="#1a8a3a" stroke-opacity="0.8"/>
    </g>
    <use href="#sat" x="565" y="135"/>
    <use href="#sat" x="770" y="140"/>
    <use href="#sat" x="665" y="265"/>
    <!-- kucuk hata bolgesi -->
    <ellipse cx="665" cy="185" rx="9" ry="9" fill="#1a8a3a" fill-opacity="0.25" stroke="#1a8a3a" stroke-width="1"/>
    <circle cx="665" cy="185" r="3.5" fill="#ff8f00" stroke="#7a4a00" stroke-width="1"/>
    <text x="678" y="208" font-size="10" fill="#0f5e26">kucuk hata alani</text>
    <text x="525" y="300" font-size="10.5" fill="#0f5e26">Uydular goge genis yayilmis -&gt; daireler</text>
    <text x="525" y="314" font-size="10.5" fill="#0f5e26">genis acilarla kesisir -&gt; keskin konum.</text>

    <!-- ayrac -->
    <line x1="525" y1="332" x2="805" y2="332" stroke="#d3dde8" stroke-width="1"/>

    <!-- KOTU GEOMETRI: uydular kumelenmis -> sig kesisim -> yuksek DOP -->
    <text x="665" y="356" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#c0392b">kotu geometri (yuksek DOP)</text>
    <!-- alici (665,430); kumelenmis uydular ust tarafta yakin -->
    <g fill="none" stroke-width="1.4">
      <circle cx="610" cy="378" r="76"   stroke="#1565c0" stroke-opacity="0.8"/>
      <circle cx="665" cy="372" r="58"   stroke="#c0392b" stroke-opacity="0.8"/>
      <circle cx="720" cy="378" r="76"   stroke="#1a8a3a" stroke-opacity="0.8"/>
    </g>
    <use href="#sat" x="610" y="378"/>
    <use href="#sat" x="665" y="372"/>
    <use href="#sat" x="720" y="378"/>
    <!-- buyuk/uzamis hata bolgesi (sig kesisim) -->
    <ellipse cx="665" cy="432" rx="40" ry="13" fill="#c0392b" fill-opacity="0.22" stroke="#c0392b" stroke-width="1"/>
    <circle cx="665" cy="432" r="3.5" fill="#ff8f00" stroke="#7a4a00" stroke-width="1"/>
    <text x="600" y="464" font-size="10" fill="#a3261b">buyuk/uzamis hata alani</text>
    <text x="525" y="482" font-size="10.5" fill="#a3261b">Uydular bir arada kumelenmis -&gt; daireler</text>
    <text x="525" y="496" font-size="10.5" fill="#a3261b">sig acilarla kesisir -&gt; konum belirsiz.</text>
  </g>
</svg>
