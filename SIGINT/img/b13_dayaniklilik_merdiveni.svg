  <text x="430" y="447" text-anchor="middle" font-size="10" fill="#6b7a90">Bolum 13 — Temel (auth) olmadan ust basamaklar tam koruma saglamaz; merdivenin tamami birlikte en gucludur.</text>
  <text x="430" y="462" text-anchor="middle" font-size="10" fill="#6b7a90">Spoof=sahte kimlik | Replay=eski mesaj | Manip.=icerik degisikl. | Relay=mesafe yaniltma | Karistirma=gurultu | Tek Nokta=tek bagimlilik</text>
