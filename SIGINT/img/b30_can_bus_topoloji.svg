<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrowB" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1565c0"/>
    </marker>
    <marker id="arrowG" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1a8a3a"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Zemin -->
  <rect width="860" height="520" fill="#f4f7fb"/>

  <!-- Baslik -->
  <text x="430" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a2b40">CAN Bus Topolojisi - Diferansiyel Hat, Sonlandirmalar ve ECU'lar</text>

  <!-- Arbitrasyon mini paneli - ust -->
  <rect x="20" y="44" width="820" height="100" rx="6" fill="#ffffff" stroke="#9fb3c8" stroke-width="1"/>
  <text x="36" y="64" font-size="12" font-weight="bold" fill="#1a2b40">Arbitrasyon Bit-Zaman Cizelgesi (Dominant/Resesif Cakisma Cozumu)</text>
  <!-- Zaman ekseni -->
  <line x1="36" y1="130" x2="820" y2="130" stroke="#d3dde8" stroke-width="1"/>
  <text x="36" y="143" font-size="10" fill="#6b7a90">t0</text>
  <text x="136" y="143" font-size="10" fill="#6b7a90">t1</text>
  <text x="236" y="143" font-size="10" fill="#6b7a90">t2</text>
  <text x="336" y="143" font-size="10" fill="#6b7a90">t3</text>
  <text x="436" y="143" font-size="10" fill="#6b7a90">t4</text>
  <text x="536" y="143" font-size="10" fill="#6b7a90">t5</text>
  <text x="636" y="143" font-size="10" fill="#6b7a90">t6</text>
  <text x="736" y="143" font-size="10" fill="#6b7a90">t7</text>

  <!-- Dugum A dalga bicimi (ID 0x100) -->
  <text x="36" y="80" font-size="10" fill="#1565c0" font-weight="bold">A(0x100):</text>
  <polyline points="100,72 136,72 136,85 236,85 236,72 336,72 336,85 436,85 436,72 536,72" fill="none" stroke="#1565c0" stroke-width="1.5"/>
  <text x="540" y="80" font-size="9" fill="#c0392b">← kaybeder (t4)</text>

  <!-- Dugum B dalga bicimi (ID 0x010) - kazanan -->
  <text x="36" y="97" font-size="10" fill="#1a8a3a" font-weight="bold">B(0x010):</text>
  <polyline points="100,90 136,90 136,103 236,103 236,90 336,90 336,103 536,103 536,90 736,90" fill="none" stroke="#1a8a3a" stroke-width="1.5"/>
  <text x="540" y="97" font-size="9" fill="#1a8a3a">← kazanir</text>

  <!-- Dugum C dalga bicimi (ID 0x301) -->
  <text x="36" y="114" font-size="10" fill="#ff8f00" font-weight="bold">C(0x301):</text>
  <polyline points="100,107 136,107 136,120 236,120 236,107" fill="none" stroke="#ff8f00" stroke-width="1.5"/>
  <text x="240" y="114" font-size="9" fill="#c0392b">← kaybeder (t2)</text>

  <!-- Veriyolu sonucu -->
  <text x="700" y="80" font-size="9" fill="#4a5a70">dominant</text>
  <text x="700" y="92" font-size="9" fill="#4a5a70">kazanir</text>

  <!-- Ana pano: CAN Bus ana hatti -->
  <rect x="20" y="156" width="820" height="340" rx="6" fill="#ffffff" stroke="#9fb3c8" stroke-width="1"/>

  <!-- CANH hatti -->
  <line x1="60" y1="226" x2="800" y2="226" stroke="#1565c0" stroke-width="3.5"/>
  <text x="36" y="222" font-size="12" font-weight="bold" fill="#1565c0">CANH</text>

  <!-- CANL hatti -->
  <line x1="60" y1="266" x2="800" y2="266" stroke="#c0392b" stroke-width="3.5"/>
  <text x="36" y="270" font-size="12" font-weight="bold" fill="#c0392b">CANL</text>

  <!-- Diferansiyel aciklamalari -->
  <text x="400" y="214" text-anchor="middle" font-size="10" fill="#6b7a90">+2,5V (resesif) / +3,5V (dominant)</text>
  <text x="400" y="282" text-anchor="middle" font-size="10" fill="#6b7a90">+2,5V (resesif) / +1,5V (dominant)</text>
  <text x="430" y="304" text-anchor="middle" font-size="11" fill="#36506e">V_diff = CANH - CANL: 0V (resesif) / +2V (dominant)</text>

  <!-- Sol sonlandirma direnci -->
  <rect x="60" y="213" width="4" height="66" fill="#ff8f00" stroke="#ff8f00" stroke-width="1" rx="2"/>
  <text x="30" y="240" font-size="10" fill="#ff8f00" font-weight="bold">120Ω</text>
  <text x="30" y="253" font-size="9" fill="#6b7a90">sonlandir.</text>

  <!-- Sag sonlandirma direnci -->
  <rect x="796" y="213" width="4" height="66" fill="#ff8f00" stroke="#ff8f00" stroke-width="1" rx="2"/>
  <text x="786" y="240" font-size="10" fill="#ff8f00" font-weight="bold">120Ω</text>
  <text x="786" y="253" font-size="9" fill="#6b7a90">sonlandir.</text>

  <!-- ECU 1: Motor ECU -->
  <rect x="85" y="316" width="130" height="70" rx="5" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="150" y="338" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">Motor ECU</text>
  <text x="150" y="354" text-anchor="middle" font-size="10" fill="#4a5a70">(ECM/PCM)</text>
  <text x="150" y="368" text-anchor="middle" font-size="9" fill="#6b7a90">devir, yakıt, ates.</text>
  <text x="150" y="380" text-anchor="middle" font-size="9" fill="#6b7a90">ID: 0x001–0x0FF</text>
  <!-- Baglanti hatlari -->
  <line x1="150" y1="226" x2="150" y2="316" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="150" y1="266" x2="150" y2="316" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- ECU 2: ABS/ESP -->
  <rect x="255" y="316" width="130" height="70" rx="5" fill="#ffffff" stroke="#1a8a3a" stroke-width="1.5"/>
  <text x="320" y="338" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a8a3a">ABS / ESP</text>
  <text x="320" y="354" text-anchor="middle" font-size="10" fill="#4a5a70">(Fren/Stabilite)</text>
  <text x="320" y="368" text-anchor="middle" font-size="9" fill="#6b7a90">tekerlek hizi, yaw</text>
  <text x="320" y="380" text-anchor="middle" font-size="9" fill="#6b7a90">ID: 0x100–0x1FF</text>
  <line x1="320" y1="226" x2="320" y2="316" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="320" y1="266" x2="320" y2="316" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- ECU 3: BCM -->
  <rect x="425" y="316" width="130" height="70" rx="5" fill="#ffffff" stroke="#ff8f00" stroke-width="1.5"/>
  <text x="490" y="338" text-anchor="middle" font-size="12" font-weight="bold" fill="#ff8f00">BCM</text>
  <text x="490" y="354" text-anchor="middle" font-size="10" fill="#4a5a70">(Govde Kontrol)</text>
  <text x="490" y="368" text-anchor="middle" font-size="9" fill="#6b7a90">kapilar, ısık, korna</text>
  <text x="490" y="380" text-anchor="middle" font-size="9" fill="#6b7a90">ID: 0x200–0x2FF</text>
  <line x1="490" y1="226" x2="490" y2="316" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="490" y1="266" x2="490" y2="316" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- ECU 4: Gateway -->
  <rect x="595" y="316" width="130" height="70" rx="5" fill="#ffffff" stroke="#6b7a90" stroke-width="1.5" stroke-dasharray="5,2"/>
  <text x="660" y="338" text-anchor="middle" font-size="12" font-weight="bold" fill="#36506e">Gateway</text>
  <text x="660" y="354" text-anchor="middle" font-size="10" fill="#4a5a70">(Yonlendirici)</text>
  <text x="660" y="368" text-anchor="middle" font-size="9" fill="#6b7a90">veriyolu arasi filtre</text>
  <text x="660" y="380" text-anchor="middle" font-size="9" fill="#6b7a90">segmentasyon hub</text>
  <line x1="660" y1="226" x2="660" y2="316" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="660" y1="266" x2="660" y2="316" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Cerceve yapisi mini -->
  <rect x="85" y="168" width="700" height="48" rx="4" fill="#f4f7fb" stroke="#d3dde8" stroke-width="1"/>
  <text x="430" y="183" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a2b40">CAN Cerceve: SOF | ID(11bit) | RTR | IDE | DLC(4b) | DATA(0-8B) | CRC(15b) | ACK | EOF</text>
  <text x="430" y="200" text-anchor="middle" font-size="9" fill="#6b7a90">ID = oncelik + mesaj turu (gonderen adresi YOK) | CRC = iletim butunlugu (kriptografik degil) | AUTH YOK</text>
  <text x="180" y="200" text-anchor="middle" font-size="9" fill="#c0392b" font-weight="bold">500 kbit/s (PT)</text>
  <text x="650" y="200" text-anchor="middle" font-size="9" fill="#1a8a3a" font-weight="bold">Broadcast: herkes gorur</text>

  <!-- Alt aciklamalar -->
  <text x="430" y="412" text-anchor="middle" font-size="10" fill="#36506e">Broadcast: her cerceve TUM dugumlere yayilir → kabul filtreleri ID'ye gore sec</text>
  <text x="430" y="428" text-anchor="middle" font-size="10" fill="#c0392b" font-weight="bold">Kaynak auth YOK: herhangi dugum herhangi ID ile cerceve yayabilir → SecOC (CAN-FD) + segmentasyon + IDS ile savunma</text>
  <text x="430" y="444" text-anchor="middle" font-size="10" fill="#4a5a70">Dusuk ID → Yuksek oncelik | 120Ω sonlandirma her iki ucta zorunlu (empedans eslesme)</text>

  <!-- Teknik etiketler alt kose -->
  <text x="36" y="480" font-size="10" fill="#6b7a90">Klasik CAN: 125–500 kbit/s | CAN-FD: 2–8 Mbit/s veri fazi | ISO 11898</text>
  <text x="600" y="480" font-size="10" fill="#1565c0">Bosch 1983 → ISO 1993</text>
</svg>
