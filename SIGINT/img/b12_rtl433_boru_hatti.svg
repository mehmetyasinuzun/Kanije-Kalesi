<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="780" height="360" fill="#f4f7fb"/>
  <text x="390" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a2b40">rtl_433 Boru Hatti: SDR → Cozum → JSON → Tuketim</text>

  <defs>
    <marker id="arrowPipe" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#36506e"/>
    </marker>
    <marker id="arrowPipeG" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#7a8aa0"/>
    </marker>
  </defs>

  <!-- ASAMA 1: SDR Cihaz -->
  <rect x="25" y="90" width="130" height="110" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
  <rect x="25" y="90" width="130" height="28" rx="6" fill="#1565c0"/>
  <rect x="25" y="110" width="130" height="8" fill="#1565c0"/>
  <text x="90" y="109" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">SDR Cihaz</text>
  <!-- Giris etiketi -->
  <rect x="33" y="64" width="114" height="20" rx="3" fill="#e3f0fd" stroke="#1565c0" stroke-width="1"/>
  <text x="90" y="77" text-anchor="middle" font-size="10" fill="#1565c0" font-weight="bold">Giris: RF Hava</text>
  <text x="90" y="131" text-anchor="middle" font-size="11" fill="#4a5a70">RTL-SDR</text>
  <text x="90" y="148" text-anchor="middle" font-size="11" fill="#4a5a70">433 / 868 / 915 MHz</text>
  <text x="90" y="165" text-anchor="middle" font-size="11" fill="#6b7a90">Ham IQ akisi</text>
  <!-- Cikis etiketi -->
  <rect x="33" y="203" width="114" height="20" rx="3" fill="#e8f0fb" stroke="#7a8aa0" stroke-width="1"/>
  <text x="90" y="216" text-anchor="middle" font-size="10" fill="#36506e">Cikis: IQ ornekleri</text>

  <!-- Ok 1 -->
  <line x1="155" y1="155" x2="195" y2="155" stroke="#36506e" stroke-width="2" marker-end="url(#arrowPipe)"/>
  <text x="175" y="148" text-anchor="middle" font-size="9" fill="#6b7a90">USB/SoapySDR</text>

  <!-- ASAMA 2: rtl_433 -->
  <rect x="195" y="90" width="150" height="110" rx="6" fill="#ffffff" stroke="#1a8a3a" stroke-width="2"/>
  <rect x="195" y="90" width="150" height="28" rx="6" fill="#1a8a3a"/>
  <rect x="195" y="110" width="150" height="8" fill="#1a8a3a"/>
  <text x="270" y="109" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">rtl_433</text>
  <rect x="203" y="64" width="134" height="20" rx="3" fill="#e8f5e9" stroke="#1a8a3a" stroke-width="1"/>
  <text x="270" y="77" text-anchor="middle" font-size="10" fill="#1a8a3a" font-weight="bold">Giris: IQ ornekleri</text>
  <text x="270" y="131" text-anchor="middle" font-size="11" fill="#4a5a70">OOK/FSK demod</text>
  <text x="270" y="148" text-anchor="middle" font-size="11" fill="#4a5a70">Protokol eglesme</text>
  <text x="270" y="165" text-anchor="middle" font-size="11" fill="#6b7a90">200+ cihaz protokolu</text>
  <rect x="203" y="203" width="134" height="20" rx="3" fill="#e8f0fb" stroke="#7a8aa0" stroke-width="1"/>
  <text x="270" y="216" text-anchor="middle" font-size="10" fill="#36506e">Cikis: JSON / metin</text>

  <!-- Ok 2 -->
  <line x1="345" y1="155" x2="385" y2="155" stroke="#36506e" stroke-width="2" marker-end="url(#arrowPipe)"/>
  <text x="365" y="148" text-anchor="middle" font-size="9" fill="#6b7a90">-F json</text>

  <!-- ASAMA 3: JSON Cikti -->
  <rect x="385" y="90" width="160" height="110" rx="6" fill="#ffffff" stroke="#ff8f00" stroke-width="2"/>
  <rect x="385" y="90" width="160" height="28" rx="6" fill="#ff8f00"/>
  <rect x="385" y="110" width="160" height="8" fill="#ff8f00"/>
  <text x="465" y="109" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">JSON Cikti</text>
  <rect x="393" y="64" width="144" height="20" rx="3" fill="#fff3e0" stroke="#ff8f00" stroke-width="1"/>
  <text x="465" y="77" text-anchor="middle" font-size="10" fill="#ff8f00" font-weight="bold">Giris: ham cihaz verisi</text>
  <text x="465" y="131" text-anchor="middle" font-size="10" fill="#4a5a70">{"model":"ABC","temp":21.5</text>
  <text x="465" y="147" text-anchor="middle" font-size="10" fill="#4a5a70"> "humidity":60,"time":"..."}</text>
  <text x="465" y="165" text-anchor="middle" font-size="11" fill="#6b7a90">Yapisal veri akisi</text>
  <rect x="393" y="203" width="144" height="20" rx="3" fill="#e8f0fb" stroke="#7a8aa0" stroke-width="1"/>
  <text x="465" y="216" text-anchor="middle" font-size="10" fill="#36506e">Cikis: JSON satirlari</text>

  <!-- Ok 3 -->
  <line x1="545" y1="155" x2="585" y2="155" stroke="#36506e" stroke-width="2" marker-end="url(#arrowPipe)"/>
  <text x="565" y="148" text-anchor="middle" font-size="9" fill="#6b7a90">stdout / dosya</text>

  <!-- ASAMA 4: Tuketim - uc kutu -->
  <!-- jq -->
  <rect x="585" y="70" width="155" height="56" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="663" y="89" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">jq (filtre/ayikla)</text>
  <text x="663" y="106" text-anchor="middle" font-size="10" fill="#4a5a70">select(.model==...) | {time,temp}</text>
  <text x="663" y="120" text-anchor="middle" font-size="9" fill="#6b7a90">Belirli cihaz + alan secimi</text>

  <!-- MQTT -->
  <rect x="585" y="140" width="155" height="56" rx="5" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="663" y="159" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">MQTT (mesaj) yayini</text>
  <text x="663" y="176" text-anchor="middle" font-size="10" fill="#4a5a70">-F mqtt:localhost/konu</text>
  <text x="663" y="190" text-anchor="middle" font-size="9" fill="#6b7a90">IoT entegrasyonu (Home Asst.)</text>

  <!-- Veritabani -->
  <rect x="585" y="210" width="155" height="56" rx="5" fill="#ffffff" stroke="#1a8a3a" stroke-width="1.5"/>
  <text x="663" y="229" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a8a3a">Veritabani / dosya</text>
  <text x="663" y="246" text-anchor="middle" font-size="10" fill="#4a5a70">-F json &gt; sensor.jsonl</text>
  <text x="663" y="260" text-anchor="middle" font-size="9" fill="#6b7a90">Uzun donem loglama</text>

  <!-- Uclugen oklar JSON -> tuketim -->
  <line x1="585" y1="125" x2="585" y2="98" stroke="#c0392b" stroke-width="1.3" marker-end="url(#arrowPipeG)" stroke-dasharray="4,3"/>
  <line x1="585" y1="155" x2="585" y2="168" stroke="#1565c0" stroke-width="1.3" stroke-dasharray="4,3"/>
  <line x1="585" y1="215" x2="585" y2="210" stroke="#1a8a3a" stroke-width="1.3" stroke-dasharray="4,3"/>

  <!-- Ornek komut -->
  <rect x="25" y="255" width="725" height="68" rx="6" fill="#1a2b40"/>
  <text x="43" y="273" font-size="10" fill="#7a8aa0">$ rtl_433 -f 433M -F json | jq 'select(.model=="Acurite-Tower") | {time:.time, temp:.temperature_C}'</text>
  <text x="43" y="291" font-size="10" fill="#7a8aa0">$ rtl_433 -F json -M time:iso &gt; log.jsonl                    # dosyaya surekli akis</text>
  <text x="43" y="307" font-size="10" fill="#7a8aa0">$ rtl_433 -f 868M -R 19 -F json                              # Avrupa bandi, tek protokol</text>

  <line x1="25" y1="335" x2="755" y2="335" stroke="#d3dde8" stroke-width="1"/>
  <text x="390" y="350" text-anchor="middle" font-size="10" fill="#6b7a90">Bolum 12 — rtl_433 boru hatti: ham RF → protokol esleme → JSON → filtre/MQTT/veritabani</text>
</svg>
