<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="860" height="480" fill="#f4f7fb"/>
  <text x="430" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a2b40">Hareketli Hedef Takibi — Kalman Filtresi</text>

  <!-- Ana panel -->
  <rect x="20" y="44" width="820" height="390" fill="#ffffff" stroke="#9fb3c8" stroke-width="1" rx="3"/>

  <!-- Ok tanimlari -->
  <defs>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#1565c0"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#c0392b"/>
    </marker>
    <marker id="arrOrange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#ff8f00"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#1a8a3a"/>
    </marker>
  </defs>

  <!-- Zaman ekseni -->
  <line x1="60" y1="380" x2="820" y2="380" stroke="#6b7a90" stroke-width="1.5" marker-end="url(#arrBlue)"/>
  <text x="828" y="384" font-size="11" fill="#1a2b40">zaman</text>
  <!-- Konum ekseni -->
  <line x1="60" y1="380" x2="60" y2="70" stroke="#6b7a90" stroke-width="1.5" marker-end="url(#arrBlue)"/>
  <text x="40" y="65" font-size="11" fill="#1a2b40">konum</text>

  <!-- Zaman isaretleri -->
  <line x1="150" y1="378" x2="150" y2="382" stroke="#6b7a90" stroke-width="1"/>
  <text x="143" y="394" font-size="10" fill="#4a5a70">t1</text>
  <line x1="255" y1="378" x2="255" y2="382" stroke="#6b7a90" stroke-width="1"/>
  <text x="248" y="394" font-size="10" fill="#4a5a70">t2</text>
  <line x1="360" y1="378" x2="360" y2="382" stroke="#6b7a90" stroke-width="1"/>
  <text x="353" y="394" font-size="10" fill="#4a5a70">t3</text>
  <line x1="465" y1="378" x2="465" y2="382" stroke="#6b7a90" stroke-width="1"/>
  <text x="458" y="394" font-size="10" fill="#4a5a70">t4</text>
  <line x1="570" y1="378" x2="570" y2="382" stroke="#6b7a90" stroke-width="1"/>
  <text x="563" y="394" font-size="10" fill="#4a5a70">t5</text>
  <line x1="675" y1="378" x2="675" y2="382" stroke="#6b7a90" stroke-width="1"/>
  <text x="668" y="394" font-size="10" fill="#4a5a70">t6</text>
  <line x1="780" y1="378" x2="780" y2="382" stroke="#6b7a90" stroke-width="1"/>
  <text x="773" y="394" font-size="10" fill="#4a5a70">t7</text>

  <!-- ===== GURULTULU HAM OLCUMLER (kirmizi daireler) ===== -->
  <!-- Gercek iz: yaklasik lineer artis, ortalama cizgi -->
  <!-- Ham olcumler gurultulu: rastgele sapma -->
  <circle cx="150" cy="298" r="5" fill="#c0392b" opacity="0.85"/>
  <circle cx="255" cy="255" r="5" fill="#c0392b" opacity="0.85"/>
  <circle cx="360" cy="228" r="5" fill="#c0392b" opacity="0.85"/>
  <circle cx="465" cy="195" r="5" fill="#c0392b" opacity="0.85"/>
  <circle cx="570" cy="172" r="5" fill="#c0392b" opacity="0.85"/>
  <circle cx="675" cy="148" r="5" fill="#c0392b" opacity="0.85"/>
  <circle cx="780" cy="128" r="5" fill="#c0392b" opacity="0.85"/>

  <!-- Ek gurultulu olcumler (etraf noktalari) -->
  <circle cx="148" cy="318" r="4" fill="#c0392b" opacity="0.5"/>
  <circle cx="258" cy="240" r="4" fill="#c0392b" opacity="0.5"/>
  <circle cx="365" cy="248" r="4" fill="#c0392b" opacity="0.5"/>
  <circle cx="460" cy="210" r="4" fill="#c0392b" opacity="0.5"/>
  <circle cx="572" cy="155" r="4" fill="#c0392b" opacity="0.5"/>
  <circle cx="680" cy="165" r="4" fill="#c0392b" opacity="0.5"/>
  <circle cx="775" cy="140" r="4" fill="#c0392b" opacity="0.5"/>
  <circle cx="153" cy="280" r="3" fill="#c0392b" opacity="0.4"/>
  <circle cx="250" cy="270" r="3" fill="#c0392b" opacity="0.4"/>
  <circle cx="358" cy="212" r="3" fill="#c0392b" opacity="0.4"/>
  <circle cx="470" cy="182" r="3" fill="#c0392b" opacity="0.4"/>
  <circle cx="568" cy="188" r="3" fill="#c0392b" opacity="0.4"/>
  <circle cx="672" cy="135" r="3" fill="#c0392b" opacity="0.4"/>
  <circle cx="782" cy="118" r="3" fill="#c0392b" opacity="0.4"/>

  <!-- ===== KALMAN PURUZLU IZ (mavi kalin) ===== -->
  <polyline points="150,300 255,258 360,232 465,198 570,176 675,152 780,130"
            fill="none" stroke="#1565c0" stroke-width="3" stroke-linejoin="round"/>
  <!-- Kalman iz noktalari -->
  <circle cx="150" cy="300" r="6" fill="#1565c0" stroke="white" stroke-width="1.5"/>
  <circle cx="255" cy="258" r="6" fill="#1565c0" stroke="white" stroke-width="1.5"/>
  <circle cx="360" cy="232" r="6" fill="#1565c0" stroke="white" stroke-width="1.5"/>
  <circle cx="465" cy="198" r="6" fill="#1565c0" stroke="white" stroke-width="1.5"/>
  <circle cx="570" cy="176" r="6" fill="#1565c0" stroke="white" stroke-width="1.5"/>
  <circle cx="675" cy="152" r="6" fill="#1565c0" stroke="white" stroke-width="1.5"/>
  <circle cx="780" cy="130" r="6" fill="#1565c0" stroke="white" stroke-width="1.5"/>

  <!-- ===== BELIRSIZLIK ELIPSLERI (kovaryans) ===== -->
  <!-- t1: buyuk belirsizlik (baslangic) -->
  <ellipse cx="150" cy="300" rx="22" ry="30" fill="#1565c0" fill-opacity="0.08" stroke="#1565c0" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- t2: olcumle kuculur -->
  <ellipse cx="255" cy="258" rx="16" ry="22" fill="#1565c0" fill-opacity="0.08" stroke="#1565c0" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- t3: biraz buyur (ongor) sonra olcumle tekrar kuculur -->
  <ellipse cx="360" cy="232" rx="14" ry="18" fill="#1565c0" fill-opacity="0.08" stroke="#1565c0" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- t4 -->
  <ellipse cx="465" cy="198" rx="13" ry="16" fill="#1565c0" fill-opacity="0.08" stroke="#1565c0" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- t5 -->
  <ellipse cx="570" cy="176" rx="12" ry="15" fill="#1565c0" fill-opacity="0.08" stroke="#1565c0" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- t6 -->
  <ellipse cx="675" cy="152" rx="12" ry="15" fill="#1565c0" fill-opacity="0.08" stroke="#1565c0" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- t7 -->
  <ellipse cx="780" cy="130" rx="11" ry="14" fill="#1565c0" fill-opacity="0.08" stroke="#1565c0" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- ===== ONGOR-DUZELT OKLARI ===== -->
  <!-- t2->t3 ongor (turuncu kesikli ok) -->
  <line x1="270" y1="250" x2="342" y2="224" stroke="#ff8f00" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrOrange)"/>
  <text x="285" y="232" font-size="9" fill="#ff8f00">ongor</text>

  <!-- t3 olcum -> t3 Kalman duzelt (yesil ok) -->
  <line x1="360" y1="228" x2="360" y2="235" stroke="#1a8a3a" stroke-width="1.8" marker-end="url(#arrGreen)"/>

  <!-- t4->t5 ongor -->
  <line x1="480" y1="190" x2="552" y2="170" stroke="#ff8f00" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrOrange)"/>
  <text x="493" y="175" font-size="9" fill="#ff8f00">ongor</text>

  <!-- ===== ACIKLAMA KUTUSU ===== -->
  <rect x="70" y="85" width="220" height="120" fill="#f4f7fb" stroke="#9fb3c8" stroke-width="1" rx="3"/>
  <text x="80" y="103" font-size="11" font-weight="bold" fill="#1a2b40">Kalman Filtresi Dongusu</text>
  <!-- ONGOR -->
  <rect x="80" y="110" width="90" height="28" fill="#ff8f00" fill-opacity="0.15" stroke="#ff8f00" stroke-width="1" rx="2"/>
  <text x="125" y="119" text-anchor="middle" font-size="10" font-weight="bold" fill="#ff8f00">ONGOR</text>
  <text x="125" y="133" text-anchor="middle" font-size="9" fill="#ff8f00">(predict)</text>
  <!-- ok -->
  <line x1="170" y1="124" x2="188" y2="124" stroke="#6b7a90" stroke-width="1.5" marker-end="url(#arrGreen)"/>
  <!-- DUZELT -->
  <rect x="190" y="110" width="90" height="28" fill="#1a8a3a" fill-opacity="0.12" stroke="#1a8a3a" stroke-width="1" rx="2"/>
  <text x="235" y="119" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a8a3a">DUZELT</text>
  <text x="235" y="133" text-anchor="middle" font-size="9" fill="#1a8a3a">(update)</text>
  <!-- Geri ok (dongu) -->
  <path d="M 280 138 Q 285 155, 135 155 Q 78 155, 80 138" fill="none" stroke="#6b7a90" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrBlue)"/>

  <text x="80" y="175" font-size="10" fill="#36506e">Durum: [x, y, vx, vy]</text>
  <text x="80" y="190" font-size="10" fill="#36506e">Kovaryans olcumle kuculur</text>
  <text x="80" y="205" font-size="10" fill="#36506e">Ongorle buyur, olcumle kuculur</text>

  <!-- Legand -->
  <rect x="600" y="85" width="225" height="95" fill="#f4f7fb" stroke="#9fb3c8" stroke-width="1" rx="3"/>
  <circle cx="618" cy="103" r="5" fill="#c0392b" opacity="0.85"/>
  <text x="628" y="107" font-size="11" fill="#4a5a70">Gurultulu ham olcumler</text>
  <line x1="610" y1="121" x2="635" y2="121" stroke="#1565c0" stroke-width="3"/>
  <circle cx="640" cy="121" r="5" fill="#1565c0" stroke="white" stroke-width="1.5"/>
  <text x="650" y="125" font-size="11" fill="#4a5a70">Kalman puruzlu izi</text>
  <ellipse cx="620" cy="142" rx="10" ry="7" fill="#1565c0" fill-opacity="0.1" stroke="#1565c0" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="636" y="146" font-size="11" fill="#4a5a70">Belirsizlik (kovaryans)</text>
  <line x1="610" y1="163" x2="635" y2="163" stroke="#ff8f00" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrOrange)"/>
  <text x="641" y="167" font-size="11" fill="#4a5a70">Ongor adimi</text>

  <!-- Alt panel aciklama -->
  <rect x="20" y="438" width="820" height="38" fill="#f4f7fb"/>
  <line x1="20" y1="438" x2="840" y2="438" stroke="#d3dde8" stroke-width="0.8"/>
  <text x="430" y="455" text-anchor="middle" font-size="11" fill="#1a2b40">
    <tspan font-weight="bold">Kalman sezgisi:</tspan> Olcum geldikce belirsizlik kuculur; olcum gecikmesinde model ile ileri tasinir (belirsizlik buyur).
  </text>
  <text x="430" y="470" text-anchor="middle" font-size="10" fill="#36506e">EKF / UKF — dogrusal olmayan hareketlerde kullanilir. Kalman kazanci: hangisi daha guvenilir, olcum mu yoksa model mi?</text>
</svg>
