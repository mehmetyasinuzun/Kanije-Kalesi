<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="860" height="480" fill="#f4f7fb"/>
  <text x="430" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a2b40">SDR Surucu Katman Mimarisi</text>

  <defs>
    <marker id="da" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#7a8aa0"/>
    </marker>
  </defs>

  <!-- Orta panel (uygulama katmani) -->
  <rect x="240" y="45" width="380" height="50" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="430" y="65" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">Uygulama / Arac</text>
  <text x="430" y="83" text-anchor="middle" font-size="11" fill="#1565c0">GQRX / SDR# / GNU Radio / rtl_433 / dump1090</text>

  <!-- ok asagi -->
  <line x1="430" y1="95" x2="430" y2="125" stroke="#7a8aa0" stroke-width="1.5" marker-end="url(#da)"/>
  <line x1="430" y1="155" x2="430" y2="125" stroke="#7a8aa0" stroke-width="1.5"/>

  <!-- SoapySDR katmani -->
  <rect x="240" y="125" width="380" height="50" rx="6" fill="#e8f5e9" stroke="#1a8a3a" stroke-width="1.5"/>
  <text x="430" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a8a3a">SoapySDR</text>
  <text x="430" y="162" text-anchor="middle" font-size="11" fill="#1a8a3a">evrensel soyutlama katmani — tek API, tum cihazlar</text>

  <!-- ok asagi -->
  <line x1="430" y1="175" x2="430" y2="205" stroke="#7a8aa0" stroke-width="1.5" marker-end="url(#da)"/>

  <!-- Cihaz kutuphane katmani -->
  <rect x="100" y="205" width="520" height="55" rx="6" fill="#fff3e0" stroke="#ff8f00" stroke-width="1.5"/>
  <text x="360" y="227" text-anchor="middle" font-size="12" font-weight="bold" fill="#ff8f00">Cihaz Kutuphanesi (Surucu)</text>
  <!-- alt kisim: kutucuklar -->
  <rect x="108" y="232" width="90" height="22" rx="3" fill="#ffe0b2" stroke="#ff8f00" stroke-width="1"/>
  <text x="153" y="247" text-anchor="middle" font-size="10" fill="#e65100">librtlsdr</text>
  <rect x="204" y="232" width="90" height="22" rx="3" fill="#ffe0b2" stroke="#ff8f00" stroke-width="1"/>
  <text x="249" y="247" text-anchor="middle" font-size="10" fill="#e65100">libhackrf</text>
  <rect x="300" y="232" width="90" height="22" rx="3" fill="#ffe0b2" stroke="#ff8f00" stroke-width="1"/>
  <text x="345" y="247" text-anchor="middle" font-size="10" fill="#e65100">libairspy</text>
  <rect x="396" y="232" width="100" height="22" rx="3" fill="#ffe0b2" stroke="#ff8f00" stroke-width="1"/>
  <text x="446" y="247" text-anchor="middle" font-size="10" fill="#e65100">libsdrplay</text>
  <rect x="502" y="232" width="110" height="22" rx="3" fill="#ffe0b2" stroke="#ff8f00" stroke-width="1"/>
  <text x="557" y="247" text-anchor="middle" font-size="10" fill="#e65100">LimeSuite...</text>

  <!-- ok asagi -->
  <line x1="430" y1="260" x2="430" y2="290" stroke="#7a8aa0" stroke-width="1.5" marker-end="url(#da)"/>

  <!-- Ayirici: Linux ve Windows kolonlari -->
  <!-- Dikey ayrac cizgisi -->
  <line x1="430" y1="295" x2="430" y2="390" stroke="#d3dde8" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Linux blogu -->
  <rect x="80" y="290" width="320" height="55" rx="6" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="1.5"/>
  <text x="175" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#5c6bc0">Linux: libusb</text>
  <text x="175" y="332" text-anchor="middle" font-size="11" fill="#5c6bc0">USB erişimi — çekirdek sürücü</text>
  <text x="175" y="345" text-anchor="middle" font-size="10" fill="#5c6bc0">apt install rtl-sdr → blacklist dvb_usb_rtl28xxu</text>

  <!-- Windows blogu -->
  <rect x="460" y="290" width="310" height="55" rx="6" fill="#fce4ec" stroke="#c0392b" stroke-width="1.5"/>
  <text x="615" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Windows: WinUSB</text>
  <text x="615" y="332" text-anchor="middle" font-size="11" fill="#c0392b">Zadig ile DVB-T → WinUSB degistir</text>
  <text x="615" y="345" text-anchor="middle" font-size="10" fill="#c0392b">Interface 0 seç → Replace Driver</text>

  <!-- Linux etiketi -->
  <rect x="125" y="348" width="100" height="22" rx="3" fill="#5c6bc0" stroke="none"/>
  <text x="175" y="363" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Linux</text>

  <!-- Windows etiketi -->
  <rect x="565" y="348" width="100" height="22" rx="3" fill="#c0392b" stroke="none"/>
  <text x="615" y="363" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Windows</text>

  <!-- Alt birlesme: donanim -->
  <line x1="240" y1="370" x2="240" y2="400" stroke="#7a8aa0" stroke-width="1.5"/>
  <line x1="620" y1="370" x2="620" y2="400" stroke="#7a8aa0" stroke-width="1.5"/>
  <line x1="240" y1="400" x2="620" y2="400" stroke="#7a8aa0" stroke-width="1.5"/>
  <line x1="430" y1="400" x2="430" y2="420" stroke="#7a8aa0" stroke-width="1.5" marker-end="url(#da)"/>

  <!-- Donanim blogu -->
  <rect x="270" y="420" width="320" height="50" rx="6" fill="#e0f2f1" stroke="#00796b" stroke-width="1.5"/>
  <text x="430" y="442" text-anchor="middle" font-size="12" font-weight="bold" fill="#00796b">SDR Donanimi</text>
  <text x="430" y="460" text-anchor="middle" font-size="11" fill="#00796b">RTL-SDR / HackRF / Airspy / SDRplay / LimeSDR</text>

  <!-- Aciklamalar -->
  <text x="430" y="15" text-anchor="middle" font-size="11" fill="#4a5a70">Katman mimarisi: uygulama → SoapySDR soyutlama → cihaz kutuphanesi → USB erisim → donanim</text>
</svg>
