<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" font-family="Segoe UI, Arial, sans-serif">
  <rect width="860" height="500" fill="#f4f7fb"/>
  <text x="430" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a2b40">Analog / Sayisal / Hibrit Beamforming Mimarileri</text>

  <defs>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#6b7a90"/>
    </marker>
    <marker id="arrB" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#1565c0"/>
    </marker>
    <marker id="arrO" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#ff8f00"/>
    </marker>
  </defs>

  <!-- === ANALOG BF (sol) === -->
  <rect x="15" y="45" width="257" height="420" fill="#ffffff" stroke="#9fb3c8" stroke-width="1" rx="4"/>
  <rect x="15" y="45" width="257" height="28" rx="4" fill="#1565c0" opacity="0.12"/>
  <text x="143" y="64" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565c0">ANALOG BF</text>

  <!-- 4 anten elemanı -->
  <!-- Her eleman y: 110, 170, 230, 290 -->
  <!-- Anten sembol: ucgen -->
  <polygon points="50,100 70,120 30,120" fill="#e8f0fb" stroke="#1565c0" stroke-width="1.5"/>
  <polygon points="50,160 70,180 30,180" fill="#e8f0fb" stroke="#1565c0" stroke-width="1.5"/>
  <polygon points="50,220 70,240 30,240" fill="#e8f0fb" stroke="#1565c0" stroke-width="1.5"/>
  <polygon points="50,280 70,300 30,300" fill="#e8f0fb" stroke="#1565c0" stroke-width="1.5"/>

  <!-- Her antenden RF fazlayici kutusuna -->
  <!-- RF fazlayici (faz kaydirici): daire -->
  <circle cx="110" cy="110" r="14" fill="#fff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="110" y="115" text-anchor="middle" font-size="11" fill="#1565c0">φ</text>
  <circle cx="110" cy="170" r="14" fill="#fff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="110" y="175" text-anchor="middle" font-size="11" fill="#1565c0">φ</text>
  <circle cx="110" cy="230" r="14" fill="#fff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="110" y="235" text-anchor="middle" font-size="11" fill="#1565c0">φ</text>
  <circle cx="110" cy="290" r="14" fill="#fff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="110" y="295" text-anchor="middle" font-size="11" fill="#1565c0">φ</text>

  <!-- Anten -> Faz ok -->
  <line x1="70" y1="110" x2="96" y2="110" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrB)"/>
  <line x1="70" y1="170" x2="96" y2="170" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrB)"/>
  <line x1="70" y1="230" x2="96" y2="230" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrB)"/>
  <line x1="70" y1="290" x2="96" y2="290" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrB)"/>

  <!-- Faz -> Toplama noktasina -->
  <line x1="124" y1="110" x2="160" y2="110" stroke="#1565c0" stroke-width="1.5"/>
  <line x1="124" y1="170" x2="160" y2="170" stroke="#1565c0" stroke-width="1.5"/>
  <line x1="124" y1="230" x2="160" y2="230" stroke="#1565c0" stroke-width="1.5"/>
  <line x1="124" y1="290" x2="160" y2="290" stroke="#1565c0" stroke-width="1.5"/>
  <!-- Dikey toplama hatti -->
  <line x1="160" y1="110" x2="160" y2="290" stroke="#1565c0" stroke-width="1.5"/>
  <!-- Toplama noktasi -->
  <circle cx="160" cy="200" r="10" fill="#e8f0fb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="160" y="204" text-anchor="middle" font-size="12" fill="#1565c0">Σ</text>

  <!-- Sigma -> Karistirici -->
  <line x1="170" y1="200" x2="195" y2="200" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrB)"/>
  <!-- Karistirici: RF kare -->
  <rect x="195" y="188" width="30" height="24" rx="3" fill="#fff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="210" y="203" text-anchor="middle" font-size="9" fill="#1565c0">RF</text>
  <!-- -> ADC -->
  <line x1="225" y1="200" x2="248" y2="200" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrB)"/>
  <!-- ADC kutu -->
  <rect x="225" y="188" width="35" height="24" rx="3" fill="#e8f0fb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="242" y="203" text-anchor="middle" font-size="9" fill="#1565c0">ADC</text>

  <!-- Tek cikis ok -->
  <line x1="235" y1="212" x2="235" y2="240" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrB)"/>
  <text x="200" y="256" text-anchor="middle" font-size="10" fill="#1565c0">tek dijital akis</text>

  <!-- Etiketler -->
  <text x="143" y="320" text-anchor="middle" font-size="10" fill="#6b7a90">RF fazlayici sayisi: N</text>
  <text x="143" y="334" text-anchor="middle" font-size="10" fill="#6b7a90">ADC sayisi: 1</text>
  <text x="143" y="348" text-anchor="middle" font-size="10" fill="#c0392b">Yalnizca tek huzme</text>
  <text x="143" y="362" text-anchor="middle" font-size="10" fill="#c0392b">Adaptif (MVDR) imkansiz</text>

  <!-- Alt bilgi -->
  <rect x="22" y="380" width="243" height="74" rx="3" fill="#e8f0fb"/>
  <text x="143" y="396" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565c0">Tipik Kullanim:</text>
  <text x="143" y="410" text-anchor="middle" font-size="10" fill="#36506e">Klasik radar, basit faz dizisi</text>
  <text x="143" y="424" text-anchor="middle" font-size="10" fill="#36506e">RF zinc. sayisi: 1</text>
  <text x="143" y="438" text-anchor="middle" font-size="10" fill="#36506e">Maliyet/guc: cok dusuk</text>
  <text x="143" y="452" text-anchor="middle" font-size="10" fill="#36506e">Esneklik: dusuk</text>

  <!-- === SAYISAL BF (orta) === -->
  <rect x="302" y="45" width="257" height="420" fill="#ffffff" stroke="#9fb3c8" stroke-width="1" rx="4"/>
  <rect x="302" y="45" width="257" height="28" rx="4" fill="#1a8a3a" opacity="0.12"/>
  <text x="430" y="64" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a8a3a">SAYISAL BF</text>

  <!-- 4 anten + tam RF zinciri -->
  <polygon points="337,100 357,120 317,120" fill="#f0fff4" stroke="#1a8a3a" stroke-width="1.5"/>
  <polygon points="337,160 357,180 317,180" fill="#f0fff4" stroke="#1a8a3a" stroke-width="1.5"/>
  <polygon points="337,220 357,240 317,240" fill="#f0fff4" stroke="#1a8a3a" stroke-width="1.5"/>
  <polygon points="337,280 357,300 317,300" fill="#f0fff4" stroke="#1a8a3a" stroke-width="1.5"/>

  <!-- Her elemana tam RF zinciri + ADC -->
  <!-- RF kutu -->
  <rect x="370" y="98" width="28" height="22" rx="2" fill="#fff" stroke="#1a8a3a" stroke-width="1.5"/>
  <text x="384" y="112" text-anchor="middle" font-size="8" fill="#1a8a3a">RF</text>
  <rect x="370" y="158" width="28" height="22" rx="2" fill="#fff" stroke="#1a8a3a" stroke-width="1.5"/>
  <text x="384" y="172" text-anchor="middle" font-size="8" fill="#1a8a3a">RF</text>
  <rect x="370" y="218" width="28" height="22" rx="2" fill="#fff" stroke="#1a8a3a" stroke-width="1.5"/>
  <text x="384" y="232" text-anchor="middle" font-size="8" fill="#1a8a3a">RF</text>
  <rect x="370" y="278" width="28" height="22" rx="2" fill="#fff" stroke="#1a8a3a" stroke-width="1.5"/>
  <text x="384" y="292" text-anchor="middle" font-size="8" fill="#1a8a3a">RF</text>

  <!-- ADC kutulari -->
  <rect x="408" y="98" width="28" height="22" rx="2" fill="#f0fff4" stroke="#1a8a3a" stroke-width="1.5"/>
  <text x="422" y="112" text-anchor="middle" font-size="8" fill="#1a8a3a">ADC</text>
  <rect x="408" y="158" width="28" height="22" rx="2" fill="#f0fff4" stroke="#1a8a3a" stroke-width="1.5"/>
  <text x="422" y="172" text-anchor="middle" font-size="8" fill="#1a8a3a">ADC</text>
  <rect x="408" y="218" width="28" height="22" rx="2" fill="#f0fff4" stroke="#1a8a3a" stroke-width="1.5"/>
  <text x="422" y="232" text-anchor="middle" font-size="8" fill="#1a8a3a">ADC</text>
  <rect x="408" y="278" width="28" height="22" rx="2" fill="#f0fff4" stroke="#1a8a3a" stroke-width="1.5"/>
  <text x="422" y="292" text-anchor="middle" font-size="8" fill="#1a8a3a">ADC</text>

  <!-- Oklar: anten -> RF -> ADC -->
  <line x1="357" y1="110" x2="370" y2="110" stroke="#1a8a3a" stroke-width="1.5" marker-end="url(#arrO)"/>
  <line x1="398" y1="110" x2="408" y2="110" stroke="#1a8a3a" stroke-width="1.5"/>
  <line x1="357" y1="170" x2="370" y2="170" stroke="#1a8a3a" stroke-width="1.5" marker-end="url(#arrO)"/>
  <line x1="398" y1="170" x2="408" y2="170" stroke="#1a8a3a" stroke-width="1.5"/>
  <line x1="357" y1="230" x2="370" y2="230" stroke="#1a8a3a" stroke-width="1.5" marker-end="url(#arrO)"/>
  <line x1="398" y1="230" x2="408" y2="230" stroke="#1a8a3a" stroke-width="1.5"/>
  <line x1="357" y1="290" x2="370" y2="290" stroke="#1a8a3a" stroke-width="1.5" marker-end="url(#arrO)"/>
  <line x1="398" y1="290" x2="408" y2="290" stroke="#1a8a3a" stroke-width="1.5"/>

  <!-- ADC -> DSP blok -->
  <line x1="436" y1="109" x2="480" y2="150" stroke="#1a8a3a" stroke-width="1"/>
  <line x1="436" y1="169" x2="480" y2="175" stroke="#1a8a3a" stroke-width="1"/>
  <line x1="436" y1="229" x2="480" y2="200" stroke="#1a8a3a" stroke-width="1"/>
  <line x1="436" y1="289" x2="480" y2="225" stroke="#1a8a3a" stroke-width="1"/>

  <!-- DSP blok -->
  <rect x="480" y="140" width="65" height="95" rx="4" fill="#f0fff4" stroke="#1a8a3a" stroke-width="1.5"/>
  <text x="512" y="183" text-anchor="middle" font-size="11" fill="#1a8a3a">w^H·x</text>
  <text x="512" y="197" text-anchor="middle" font-size="9" fill="#1a8a3a">yazilimda</text>
  <text x="512" y="210" text-anchor="middle" font-size="9" fill="#1a8a3a">N akis</text>

  <!-- Cikis oklar (cok huzme) -->
  <line x1="545" y1="165" x2="553" y2="165" stroke="#1a8a3a" stroke-width="1.5" marker-end="url(#arrO)"/>
  <text x="556" y="162" font-size="9" fill="#1a8a3a">huzme 1</text>
  <line x1="545" y1="188" x2="553" y2="188" stroke="#1a8a3a" stroke-width="1.5" marker-end="url(#arrO)"/>
  <text x="556" y="185" font-size="9" fill="#1a8a3a">huzme 2</text>
  <line x1="545" y1="211" x2="553" y2="211" stroke="#1a8a3a" stroke-width="1.5" marker-end="url(#arrO)"/>
  <text x="556" y="208" font-size="9" fill="#1a8a3a">huzme K</text>

  <!-- Etiketler -->
  <text x="430" y="320" text-anchor="middle" font-size="10" fill="#6b7a90">RF zinciri: N  |  ADC: N</text>
  <text x="430" y="334" text-anchor="middle" font-size="10" fill="#1a8a3a">Anlık cok-huzme</text>
  <text x="430" y="348" text-anchor="middle" font-size="10" fill="#1a8a3a">MVDR/MUSIC tam destekli</text>

  <!-- Alt bilgi -->
  <rect x="309" y="380" width="243" height="74" rx="3" fill="#f0fff4"/>
  <text x="430" y="396" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a8a3a">Tipik Kullanim:</text>
  <text x="430" y="410" text-anchor="middle" font-size="10" fill="#36506e">KrakenSDR, SIGINT, MVDR/MUSIC</text>
  <text x="430" y="424" text-anchor="middle" font-size="10" fill="#36506e">RF zincir sayisi: N (her eleman)</text>
  <text x="430" y="438" text-anchor="middle" font-size="10" fill="#36506e">Maliyet/guc: yuksek (N ADC)</text>
  <text x="430" y="452" text-anchor="middle" font-size="10" fill="#36506e">Esneklik: maksimum</text>

  <!-- === HIBRIT BF (sag) === -->
  <rect x="589" y="45" width="255" height="420" fill="#ffffff" stroke="#9fb3c8" stroke-width="1" rx="4"/>
  <rect x="589" y="45" width="255" height="28" rx="4" fill="#ff8f00" opacity="0.15"/>
  <text x="716" y="64" text-anchor="middle" font-size="13" font-weight="bold" fill="#ff8f00">HIBRIT BF</text>

  <!-- Alt-dizi 1: 2 eleman + analog faz -->
  <polygon points="620,98 638,118 602,118" fill="#fff8e1" stroke="#ff8f00" stroke-width="1.5"/>
  <polygon points="620,148 638,168 602,168" fill="#fff8e1" stroke="#ff8f00" stroke-width="1.5"/>
  <!-- Faz kaydiricilar alt-dizi 1 -->
  <circle cx="660" cy="108" r="11" fill="#fff" stroke="#ff8f00" stroke-width="1.5"/>
  <text x="660" y="112" text-anchor="middle" font-size="10" fill="#ff8f00">φ</text>
  <circle cx="660" cy="158" r="11" fill="#fff" stroke="#ff8f00" stroke-width="1.5"/>
  <text x="660" y="162" text-anchor="middle" font-size="10" fill="#ff8f00">φ</text>
  <!-- OK -->
  <line x1="638" y1="108" x2="649" y2="108" stroke="#ff8f00" stroke-width="1.5"/>
  <line x1="638" y1="158" x2="649" y2="158" stroke="#ff8f00" stroke-width="1.5"/>
  <!-- Topla -->
  <line x1="671" y1="108" x2="690" y2="133" stroke="#ff8f00" stroke-width="1.5"/>
  <line x1="671" y1="158" x2="690" y2="133" stroke="#ff8f00" stroke-width="1.5"/>
  <circle cx="690" cy="133" r="8" fill="#fff8e1" stroke="#ff8f00" stroke-width="1.5"/>
  <text x="690" y="137" text-anchor="middle" font-size="10" fill="#ff8f00">Σ</text>
  <!-- ADC 1 -->
  <line x1="698" y1="133" x2="715" y2="133" stroke="#ff8f00" stroke-width="1.5"/>
  <rect x="715" y="123" width="32" height="20" rx="2" fill="#fff8e1" stroke="#ff8f00" stroke-width="1.5"/>
  <text x="731" y="136" text-anchor="middle" font-size="8" fill="#ff8f00">ADC</text>

  <!-- Alt-dizi 2: 2 eleman + analog faz -->
  <polygon points="620,208 638,228 602,228" fill="#fff8e1" stroke="#ff8f00" stroke-width="1.5"/>
  <polygon points="620,258 638,278 602,278" fill="#fff8e1" stroke="#ff8f00" stroke-width="1.5"/>
  <circle cx="660" cy="218" r="11" fill="#fff" stroke="#ff8f00" stroke-width="1.5"/>
  <text x="660" y="222" text-anchor="middle" font-size="10" fill="#ff8f00">φ</text>
  <circle cx="660" cy="268" r="11" fill="#fff" stroke="#ff8f00" stroke-width="1.5"/>
  <text x="660" y="272" text-anchor="middle" font-size="10" fill="#ff8f00">φ</text>
  <line x1="638" y1="218" x2="649" y2="218" stroke="#ff8f00" stroke-width="1.5"/>
  <line x1="638" y1="268" x2="649" y2="268" stroke="#ff8f00" stroke-width="1.5"/>
  <line x1="671" y1="218" x2="690" y2="243" stroke="#ff8f00" stroke-width="1.5"/>
  <line x1="671" y1="268" x2="690" y2="243" stroke="#ff8f00" stroke-width="1.5"/>
  <circle cx="690" cy="243" r="8" fill="#fff8e1" stroke="#ff8f00" stroke-width="1.5"/>
  <text x="690" y="247" text-anchor="middle" font-size="10" fill="#ff8f00">Σ</text>
  <line x1="698" y1="243" x2="715" y2="243" stroke="#ff8f00" stroke-width="1.5"/>
  <rect x="715" y="233" width="32" height="20" rx="2" fill="#fff8e1" stroke="#ff8f00" stroke-width="1.5"/>
  <text x="731" y="246" text-anchor="middle" font-size="8" fill="#ff8f00">ADC</text>

  <!-- DSP blok hibrit -->
  <line x1="747" y1="133" x2="762" y2="188" stroke="#ff8f00" stroke-width="1.5"/>
  <line x1="747" y1="243" x2="762" y2="188" stroke="#ff8f00" stroke-width="1.5"/>
  <rect x="762" y="165" width="65" height="45" rx="4" fill="#fff8e1" stroke="#ff8f00" stroke-width="1.5"/>
  <text x="794" y="185" text-anchor="middle" font-size="9" fill="#ff8f00">sayisal</text>
  <text x="794" y="197" text-anchor="middle" font-size="9" fill="#ff8f00">K akis</text>

  <!-- K << N etiketi -->
  <text x="716" y="316" text-anchor="middle" font-size="10" fill="#6b7a90">ADC sayisi: K (1&lt;K≪N)</text>
  <text x="716" y="330" text-anchor="middle" font-size="10" fill="#6b7a90">Her alt-dizi: analog faz</text>
  <text x="716" y="344" text-anchor="middle" font-size="10" fill="#ff8f00">Sinirli cok-huzme</text>
  <text x="716" y="358" text-anchor="middle" font-size="10" fill="#ff8f00">Orta maliyet/esneklik</text>

  <!-- Alt bilgi -->
  <rect x="596" y="380" width="241" height="74" rx="3" fill="#fff8e1"/>
  <text x="716" y="396" text-anchor="middle" font-size="10" font-weight="bold" fill="#ff8f00">Tipik Kullanim:</text>
  <text x="716" y="410" text-anchor="middle" font-size="10" fill="#36506e">5G Massive MIMO, mmWave</text>
  <text x="716" y="424" text-anchor="middle" font-size="10" fill="#36506e">Alt-dizi basina analog faz</text>
  <text x="716" y="438" text-anchor="middle" font-size="10" fill="#36506e">Maliyet/guc: orta</text>
  <text x="716" y="452" text-anchor="middle" font-size="10" fill="#36506e">Esneklik: orta (K huzme)</text>

  <!-- Tablo karsilastirma alt -->
  <rect x="15" y="470" width="829" height="25" rx="3" fill="#1a2b40" opacity="0.07"/>
  <text x="143" y="487" text-anchor="middle" font-size="10" fill="#1565c0">ADC: 1  |  Tek huzme</text>
  <text x="430" y="487" text-anchor="middle" font-size="10" fill="#1a8a3a">ADC: N  |  Cok huzme  |  MVDR/MUSIC</text>
  <text x="716" y="487" text-anchor="middle" font-size="10" fill="#ff8f00">ADC: K≪N  |  K huzme  |  mmWave 5G</text>

</svg>
