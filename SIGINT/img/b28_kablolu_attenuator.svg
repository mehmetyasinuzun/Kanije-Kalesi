<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" font-family="Segoe UI, Arial, sans-serif">
  <rect width="840" height="440" fill="#f4f7fb"/>
  <text x="420" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a2b40">Dummy Load ve Kablolu Zayiflatici Baglanti</text>

  <defs>
    <marker id="a1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1565c0"/>
    </marker>
    <marker id="a2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1a8a3a"/>
    </marker>
    <marker id="a3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- === UST PANEL: Dummy Load ===-->
  <rect x="20" y="45" width="800" height="160" fill="#ffffff" stroke="#9fb3c8" stroke-width="1" rx="4"/>
  <text x="420" y="67" text-anchor="middle" font-size="12" font-weight="bold" fill="#36506e">Dummy Load (Sahte Yuk) ile Tek-Cihaz TX Testi — Havaya Cikis YOK</text>

  <!-- TX cihaz kutusu -->
  <rect x="50" y="90" width="130" height="70" rx="6" fill="#e8f0fb" stroke="#1565c0" stroke-width="2"/>
  <text x="115" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">TX Cihazi</text>
  <text x="115" y="135" text-anchor="middle" font-size="10" fill="#1565c0">HackRF / Pluto</text>
  <text x="115" y="148" text-anchor="middle" font-size="10" fill="#1565c0">SDR TX</text>

  <!-- TX cikis portu -->
  <rect x="176" y="117" width="12" height="14" fill="#1565c0" rx="1"/>
  <text x="182" y="112" text-anchor="middle" font-size="9" fill="#6b7a90">SMA</text>

  <!-- Koaks kablo -->
  <line x1="188" y1="124" x2="280" y2="124" stroke="#1565c0" stroke-width="3" stroke-linecap="round"/>
  <text x="234" y="116" text-anchor="middle" font-size="9" fill="#6b7a90">50Ω koaks</text>

  <!-- Dummy Load kutusu -->
  <rect x="280" y="100" width="120" height="55" rx="6" fill="#fdf0f0" stroke="#c0392b" stroke-width="2.5"/>
  <text x="340" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">DUMMY LOAD</text>
  <text x="340" y="137" text-anchor="middle" font-size="10" fill="#c0392b">50Ω  |  ≥15 dBm</text>
  <text x="340" y="150" text-anchor="middle" font-size="10" fill="#6b7a90">anma gucu yeterli</text>

  <!-- Dummy Load girisi -->
  <rect x="276" y="117" width="12" height="14" fill="#c0392b" rx="1"/>

  <!-- Isi oku -->
  <text x="440" y="105" font-size="22" fill="#c0392b" opacity="0.7">♨</text>
  <text x="480" y="115" font-size="11" fill="#c0392b">RF gucu</text>
  <text x="480" y="129" font-size="11" fill="#c0392b">ISIYA</text>
  <text x="480" y="143" font-size="11" fill="#c0392b">donusur</text>

  <!-- ANTEN YOK etiketi -->
  <rect x="570" y="88" width="220" height="88" rx="6" fill="#f0fff4" stroke="#1a8a3a" stroke-width="2"/>
  <text x="680" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a8a3a">ANTEN YOK</text>
  <text x="680" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a8a3a">HAVAYA CIKIS YOK</text>
  <text x="680" y="146" text-anchor="middle" font-size="10" fill="#36506e">Sinyal koaksiyel icinde</text>
  <text x="680" y="159" text-anchor="middle" font-size="10" fill="#36506e">ve yuk direncinde kalir</text>
  <text x="680" y="172" text-anchor="middle" font-size="10" fill="#1a8a3a">Fizik garantisi: kaçak yok</text>

  <!-- === ALT PANEL: Kablolu + Attenuator ===-->
  <rect x="20" y="220" width="800" height="200" fill="#ffffff" stroke="#9fb3c8" stroke-width="1" rx="4"/>
  <text x="420" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#36506e">Kablolu + Attenuator Zinciri: TX → ATT1 → ATT2 → RX (Havaya Cikis YOK)</text>

  <!-- TX cihaz -->
  <rect x="35" y="270" width="110" height="70" rx="5" fill="#e8f0fb" stroke="#1565c0" stroke-width="2"/>
  <text x="90" y="298" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">TX Cihazi</text>
  <text x="90" y="312" text-anchor="middle" font-size="9" fill="#1565c0">PlutoSDR /</text>
  <text x="90" y="324" text-anchor="middle" font-size="9" fill="#1565c0">LimeSDR</text>
  <!-- guc degeri -->
  <text x="90" y="354" text-anchor="middle" font-size="10" fill="#1565c0">P_TX = 0 dBm</text>

  <!-- Port -->
  <rect x="141" y="297" width="10" height="12" fill="#1565c0" rx="1"/>

  <!-- Kablo 1 -->
  <line x1="151" y1="303" x2="195" y2="303" stroke="#6b7a90" stroke-width="3" stroke-linecap="round"/>

  <!-- ATT1 (30 dB) -->
  <rect x="195" y="276" width="95" height="55" rx="5" fill="#fff8e1" stroke="#ff8f00" stroke-width="2"/>
  <text x="242" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#ff8f00">ATT1</text>
  <text x="242" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">−30 dB</text>
  <text x="242" y="325" text-anchor="middle" font-size="9" fill="#6b7a90">50Ω SMA</text>
  <!-- dBm hesap -->
  <text x="242" y="348" text-anchor="middle" font-size="10" fill="#ff8f00">0−30 = −30 dBm</text>

  <!-- Kablo 2 -->
  <line x1="290" y1="303" x2="330" y2="303" stroke="#6b7a90" stroke-width="3" stroke-linecap="round"/>

  <!-- ATT2 (20 dB) -->
  <rect x="330" y="276" width="95" height="55" rx="5" fill="#fff8e1" stroke="#ff8f00" stroke-width="2"/>
  <text x="377" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#ff8f00">ATT2</text>
  <text x="377" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">−20 dB</text>
  <text x="377" y="325" text-anchor="middle" font-size="9" fill="#6b7a90">50Ω SMA</text>
  <!-- dBm hesap -->
  <text x="377" y="348" text-anchor="middle" font-size="10" fill="#ff8f00">−30−20 = −50 dBm</text>

  <!-- Kablo 3 -->
  <line x1="425" y1="303" x2="470" y2="303" stroke="#6b7a90" stroke-width="3" stroke-linecap="round"/>

  <!-- RX cihaz -->
  <rect x="470" y="270" width="110" height="70" rx="5" fill="#f0fff4" stroke="#1a8a3a" stroke-width="2"/>
  <text x="525" y="298" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a8a3a">RX Cihazi</text>
  <text x="525" y="312" text-anchor="middle" font-size="9" fill="#1a8a3a">RTL-SDR /</text>
  <text x="525" y="324" text-anchor="middle" font-size="9" fill="#1a8a3a">HackRF</text>
  <!-- Hasar esigi -->
  <text x="525" y="354" text-anchor="middle" font-size="10" fill="#1a8a3a">max: −10 dBm ✓</text>

  <!-- Toplam attenuator bilgi kutusu -->
  <rect x="620" y="262" width="185" height="115" rx="5" fill="#fdf0f0" stroke="#c0392b" stroke-width="1.5"/>
  <text x="712" y="282" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Guc Butcesi:</text>
  <text x="712" y="298" text-anchor="middle" font-size="10" fill="#36506e">Toplam ATT = 30+20 = 50 dB</text>
  <text x="712" y="312" text-anchor="middle" font-size="10" fill="#36506e">P_TX = 0 dBm (ornek)</text>
  <text x="712" y="326" text-anchor="middle" font-size="10" fill="#36506e">P_RX = 0 − 50 = −50 dBm</text>
  <text x="712" y="340" text-anchor="middle" font-size="11" fill="#1a8a3a" font-weight="bold">−50 &lt; −10 → RX guvenli ✓</text>
  <text x="712" y="358" text-anchor="middle" font-size="9" fill="#6b7a90">KURAL: P_TX − ATT &lt; max_RX</text>
  <text x="712" y="371" text-anchor="middle" font-size="9" fill="#c0392b">Yetersiz ATT → RX zarar!</text>

  <!-- Altta aciklik seridi -->
  <rect x="20" y="400" width="800" height="30" rx="4" fill="#1a2b40" opacity="0.06"/>
  <text x="250" y="419" text-anchor="middle" font-size="10" fill="#c0392b" font-weight="bold">ANTEN YOK — Her sey koaks icinde</text>
  <text x="530" y="419" text-anchor="middle" font-size="10" fill="#1a8a3a">Havaya yayilma: FIZIKEN IMKANSIZ  |  Kacak yok, olcmeye gerek yok</text>

  <!-- ATT zincirleme oku -->
  <path d="M151,350 L195,350" fill="none" stroke="#9fb3c8" stroke-width="1" marker-end="url(#a1)"/>
  <path d="M290,350 L330,350" fill="none" stroke="#9fb3c8" stroke-width="1" marker-end="url(#a1)"/>
  <path d="M425,350 L470,350" fill="none" stroke="#9fb3c8" stroke-width="1" marker-end="url(#a1)"/>

</svg>
