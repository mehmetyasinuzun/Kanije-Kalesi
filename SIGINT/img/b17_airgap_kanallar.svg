<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" font-family="Segoe UI, Arial, sans-serif">
  <rect width="860" height="460" fill="#f4f7fb"/>
  <text x="430" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a2b40">Hava-Boslugu (Air-Gap) Asimi: Kacak Kanallar</text>
  <text x="430" y="46" text-anchor="middle" font-size="10.5" fill="#6b7a90">Ele gecirilmis makine → EM/akustik/optik/termal kanal → alici cihaz</text>

  <!-- Panel -->
  <rect x="30" y="56" width="800" height="380" fill="#fff" stroke="#9fb3c8" stroke-width="1"/>

  <!-- Sol: Airgap makine -->
  <rect x="60" y="140" width="150" height="180" rx="8" fill="#1565c0" opacity="0.14" stroke="#1565c0" stroke-width="2"/>
  <text x="135" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">HAVA-BOSLUKLU</text>
  <text x="135" y="184" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">MAKiNE</text>
  <text x="135" y="202" text-anchor="middle" font-size="9.5" fill="#6b7a90">(ag baglantisi</text>
  <text x="135" y="214" text-anchor="middle" font-size="9.5" fill="#6b7a90">yok)</text>
  <line x1="75" y1="224" x2="195" y2="224" stroke="#d3dde8" stroke-width="1"/>
  <text x="135" y="240" text-anchor="middle" font-size="9" fill="#c0392b" font-weight="bold">Zarl. yazilim</text>
  <text x="135" y="254" text-anchor="middle" font-size="9" fill="#c0392b">onceden yuklu</text>
  <text x="135" y="270" text-anchor="middle" font-size="9" fill="#6b7a90">(USB ile girebilir)</text>
  <text x="135" y="290" text-anchor="middle" font-size="9" fill="#6b7a90">Gizli veri: kriptog.</text>
  <text x="135" y="304" text-anchor="middle" font-size="9" fill="#6b7a90">anahtar / parola</text>

  <!-- Kanal oklari: sol makineden sag alicilara -->
  <defs>
    <marker id="ch1" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <polygon points="0,0 7,3 0,6" fill="#c0392b"/>
    </marker>
    <marker id="ch2" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <polygon points="0,0 7,3 0,6" fill="#ff8f00"/>
    </marker>
    <marker id="ch3" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <polygon points="0,0 7,3 0,6" fill="#6b7a90"/>
    </marker>
    <marker id="ch4" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <polygon points="0,0 7,3 0,6" fill="#1a8a3a"/>
    </marker>
    <marker id="ch5" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <polygon points="0,0 7,3 0,6" fill="#1565c0"/>
    </marker>
  </defs>

  <!-- Kanal 1: EM (ekran kablosu / bellek yolu) -->
  <line x1="210" y1="160" x2="480" y2="96" stroke="#c0392b" stroke-width="2" marker-end="url(#ch1)"/>
  <rect x="215" y="106" width="150" height="36" fill="#fff3f3" stroke="#c0392b" stroke-width="1" rx="3"/>
  <text x="290" y="120" text-anchor="middle" font-size="9.5" fill="#c0392b" font-weight="bold">EM Kanali</text>
  <text x="290" y="134" text-anchor="middle" font-size="9" fill="#4a5a70">Ekran kablosu / bellek yolu</text>
  <text x="290" y="145" text-anchor="middle" font-size="9" fill="#6b7a90">AirHopper / GSMem</text>

  <!-- Kanal 2: Akustik (fan) -->
  <line x1="210" y1="190" x2="480" y2="178" stroke="#ff8f00" stroke-width="2" marker-end="url(#ch2)"/>
  <rect x="215" y="160" width="150" height="36" fill="#fffbf0" stroke="#ff8f00" stroke-width="1" rx="3"/>
  <text x="290" y="174" text-anchor="middle" font-size="9.5" fill="#ff8f00" font-weight="bold">Akustik Kanal</text>
  <text x="290" y="188" text-anchor="middle" font-size="9" fill="#4a5a70">Fan hizi / disk sesi modülü</text>
  <text x="290" y="199" text-anchor="middle" font-size="9" fill="#6b7a90">Fansmitter / DiskFiltration</text>

  <!-- Kanal 3: Termal -->
  <line x1="210" y1="230" x2="480" y2="256" stroke="#6b7a90" stroke-width="2" marker-end="url(#ch3)"/>
  <rect x="215" y="240" width="150" height="36" fill="#f5f5f7" stroke="#6b7a90" stroke-width="1" rx="3"/>
  <text x="290" y="254" text-anchor="middle" font-size="9.5" fill="#6b7a90" font-weight="bold">Termal Kanal</text>
  <text x="290" y="268" text-anchor="middle" font-size="9" fill="#4a5a70">Sicaklik degisimi modülü</text>
  <text x="290" y="279" text-anchor="middle" font-size="9" fill="#6b7a90">BitWhisper</text>

  <!-- Kanal 4: LED -->
  <line x1="210" y1="270" x2="480" y2="336" stroke="#1a8a3a" stroke-width="2" marker-end="url(#ch4)"/>
  <rect x="215" y="316" width="150" height="36" fill="#f0fff4" stroke="#1a8a3a" stroke-width="1" rx="3"/>
  <text x="290" y="330" text-anchor="middle" font-size="9.5" fill="#1a8a3a" font-weight="bold">Optik Kanal (LED)</text>
  <text x="290" y="344" text-anchor="middle" font-size="9" fill="#4a5a70">Gösterge LED modülasyonu</text>
  <text x="290" y="355" text-anchor="middle" font-size="9" fill="#6b7a90">LED tabanli ifsa</text>

  <!-- Alici cihazlar - sag panel -->
  <!-- SDR -->
  <rect x="490" y="74" width="130" height="46" fill="#c0392b" opacity="0.12" stroke="#c0392b" stroke-width="1.5" rx="4"/>
  <text x="555" y="92" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">SDR / anten</text>
  <text x="555" y="108" text-anchor="middle" font-size="9.5" fill="#4a5a70">EM emanasyonu alir</text>

  <!-- Mikrofon -->
  <rect x="490" y="152" width="130" height="46" fill="#ff8f00" opacity="0.12" stroke="#ff8f00" stroke-width="1.5" rx="4"/>
  <text x="555" y="170" text-anchor="middle" font-size="10" font-weight="bold" fill="#ff8f00">Mikrofon</text>
  <text x="555" y="186" text-anchor="middle" font-size="9.5" fill="#4a5a70">Fan/disk sesini alir</text>

  <!-- Termal sensor -->
  <rect x="490" y="232" width="130" height="46" fill="#6b7a90" opacity="0.12" stroke="#6b7a90" stroke-width="1.5" rx="4"/>
  <text x="555" y="250" text-anchor="middle" font-size="10" font-weight="bold" fill="#6b7a90">Termal Sensor</text>
  <text x="555" y="266" text-anchor="middle" font-size="9.5" fill="#4a5a70">Sicaklik degisimini okur</text>

  <!-- Kamera -->
  <rect x="490" y="312" width="130" height="46" fill="#1a8a3a" opacity="0.12" stroke="#1a8a3a" stroke-width="1.5" rx="4"/>
  <text x="555" y="330" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a8a3a">Kamera</text>
  <text x="555" y="346" text-anchor="middle" font-size="9.5" fill="#4a5a70">LED/optik degisim</text>

  <!-- Ortak alici: yakin cihazdaki telefon -->
  <rect x="650" y="120" width="160" height="200" fill="#f4f7fb" stroke="#9fb3c8" stroke-width="1.5" rx="8"/>
  <text x="730" y="148" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a2b40">Yakin Cihazdaki</text>
  <text x="730" y="163" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a2b40">ALICI CIHAZ</text>
  <text x="730" y="182" text-anchor="middle" font-size="9.5" fill="#6b7a90">(ornegin: yakin bir</text>
  <text x="730" y="196" text-anchor="middle" font-size="9.5" fill="#6b7a90">bilgisayar, telefon,</text>
  <text x="730" y="210" text-anchor="middle" font-size="9.5" fill="#6b7a90">ya da gizli sensor)</text>
  <line x1="660" y1="240" x2="800" y2="240" stroke="#d3dde8" stroke-width="1"/>
  <text x="730" y="258" text-anchor="middle" font-size="9.5" fill="#c0392b" font-weight="bold">Veri hizi: cok dusuk</text>
  <text x="730" y="274" text-anchor="middle" font-size="9.5" fill="#c0392b">(bit/s - yuzlerce bit/s)</text>
  <text x="730" y="290" text-anchor="middle" font-size="9.5" fill="#4a5a70">Kucuk sir (anahtar) icin</text>
  <text x="730" y="305" text-anchor="middle" font-size="9.5" fill="#4a5a70">bile yeterli olabilir</text>

  <!-- Alicidan ok kanal -->
  <line x1="620" y1="100" x2="650" y2="160" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="620" y1="176" x2="650" y2="190" stroke="#ff8f00" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="620" y1="256" x2="650" y2="240" stroke="#6b7a90" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="620" y1="336" x2="650" y2="290" stroke="#1a8a3a" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Savunma kutusu -->
  <rect x="60" y="370" width="780" height="52" fill="#f4f7fb" stroke="#d3dde8" stroke-width="1" rx="4"/>
  <text x="430" y="390" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a2b40">Savunma: Air-gap tek basina yetmez — bulasmali makinede kanal kapatilmali</text>
  <text x="430" y="408" text-anchor="middle" font-size="10" fill="#4a5a70">Ekranlama (EM) | Akustik yalitim (fan/disk) | LED maskeleme | Termal ayrim | Alici cihazlari fiziksel uzaklastir</text>
</svg>
