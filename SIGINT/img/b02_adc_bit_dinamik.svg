<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="420" fill="#f4f7fb"/>
  <text x="380" y="27" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a2b40">ADC Bit Derinligi ve Dinamik Aralik Karsilastirma</text>
  <text x="380" y="45" text-anchor="middle" font-size="12" fill="#5a6b80">Her bit ≈ 6 dB dinamik aralik — guclu + zayif sinyal birlikte ayrimi</text>

  <!-- Eksen -->
  <line x1="160" y1="70" x2="160" y2="360" stroke="#7a8aa0" stroke-width="1.5"/>
  <line x1="160" y1="360" x2="720" y2="360" stroke="#7a8aa0" stroke-width="1.5"/>
  <polygon points="720,360 710,355 710,365" fill="#7a8aa0"/>
  <polygon points="160,70 155,80 165,80" fill="#7a8aa0"/>
  <text x="725" y="363" font-size="12" fill="#36506e">Cihaz</text>
  <text x="155" y="67" text-anchor="end" font-size="12" fill="#36506e">dB</text>

  <!-- Y eksen isaretleri -->
  <line x1="155" y1="360" x2="160" y2="360" stroke="#7a8aa0" stroke-width="1"/>
  <text x="150" y="364" text-anchor="end" font-size="10" fill="#4a5a70">0</text>
  <line x1="155" y1="307" x2="160" y2="307" stroke="#7a8aa0" stroke-width="1"/>
  <text x="150" y="311" text-anchor="end" font-size="10" fill="#4a5a70">48</text>
  <line x1="155" y1="260" x2="160" y2="260" stroke="#7a8aa0" stroke-width="1"/>
  <text x="150" y="264" text-anchor="end" font-size="10" fill="#4a5a70">72</text>
  <line x1="155" y1="225" x2="160" y2="225" stroke="#7a8aa0" stroke-width="1"/>
  <text x="150" y="229" text-anchor="end" font-size="10" fill="#4a5a70">84</text>
  <line x1="155" y1="190" x2="160" y2="190" stroke="#7a8aa0" stroke-width="1"/>
  <text x="150" y="194" text-anchor="end" font-size="10" fill="#4a5a70">96</text>
  <!-- Izgarа yatay -->
  <line x1="160" y1="307" x2="720" y2="307" stroke="#d3dde8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="160" y1="260" x2="720" y2="260" stroke="#d3dde8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="160" y1="225" x2="720" y2="225" stroke="#d3dde8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="160" y1="190" x2="720" y2="190" stroke="#d3dde8" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- BAR 1: 8-bit = 48 dB -->
  <rect x="190" y="307" width="100" height="53" fill="#c0392b" rx="3"/>
  <text x="240" y="326" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">8-bit</text>
  <text x="240" y="342" text-anchor="middle" font-size="11" fill="#fdd">~48 dB</text>
  <text x="240" y="356" text-anchor="middle" font-size="10" fill="#fdd">dar</text>
  <!-- Cihaz etiketi -->
  <text x="240" y="378" text-anchor="middle" font-size="10" fill="#36506e" font-weight="bold">RTL-SDR</text>
  <text x="240" y="390" text-anchor="middle" font-size="10" fill="#5a6b80">HackRF</text>
  <!-- dB degeri uzerinde -->
  <text x="240" y="303" text-anchor="middle" font-size="11" fill="#c0392b" font-weight="bold">48 dB</text>

  <!-- BAR 2: 12-bit = 72 dB -->
  <rect x="330" y="260" width="100" height="100" fill="#ff8f00" rx="3"/>
  <text x="380" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">12-bit</text>
  <text x="380" y="316" text-anchor="middle" font-size="11" fill="#fff">~72 dB</text>
  <text x="380" y="330" text-anchor="middle" font-size="10" fill="#fff">orta</text>
  <text x="380" y="378" text-anchor="middle" font-size="10" fill="#36506e" font-weight="bold">Airspy R2</text>
  <text x="380" y="390" text-anchor="middle" font-size="10" fill="#5a6b80">USRP B200/B210</text>
  <text x="380" y="256" text-anchor="middle" font-size="11" fill="#ff8f00" font-weight="bold">72 dB</text>

  <!-- BAR 3: 14-bit = 84 dB -->
  <rect x="470" y="225" width="100" height="135" fill="#1565c0" rx="3"/>
  <text x="520" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">14-bit</text>
  <text x="520" y="289" text-anchor="middle" font-size="11" fill="#cfe4fa">~84 dB</text>
  <text x="520" y="305" text-anchor="middle" font-size="10" fill="#cfe4fa">iyi</text>
  <text x="520" y="378" text-anchor="middle" font-size="10" fill="#36506e" font-weight="bold">SDRplay RSP1A</text>
  <text x="520" y="390" text-anchor="middle" font-size="10" fill="#5a6b80">RSPdx</text>
  <text x="520" y="221" text-anchor="middle" font-size="11" fill="#1565c0" font-weight="bold">84 dB</text>

  <!-- BAR 4: 16-bit = 96 dB -->
  <rect x="610" y="190" width="100" height="170" fill="#1a8a3a" rx="3"/>
  <text x="660" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">16-bit</text>
  <text x="660" y="272" text-anchor="middle" font-size="11" fill="#d5f5e3">~96 dB</text>
  <text x="660" y="289" text-anchor="middle" font-size="10" fill="#d5f5e3">cok temiz</text>
  <text x="660" y="378" text-anchor="middle" font-size="10" fill="#36506e" font-weight="bold">Airspy HF+</text>
  <text x="660" y="390" text-anchor="middle" font-size="10" fill="#5a6b80">Discovery</text>
  <text x="660" y="186" text-anchor="middle" font-size="11" fill="#1a8a3a" font-weight="bold">96 dB</text>

  <!-- Zayif sinyal gostergesi -->
  <rect x="160" y="70" width="560" height="40" fill="none"/>
  <!-- Guclu sinyal band -->
  <rect x="163" y="80" width="555" height="12" fill="#ff8f00" rx="2" opacity="0.25"/>
  <text x="445" y="90" text-anchor="middle" font-size="10" fill="#ff8f00" font-weight="bold">Guclu sinyal (FM kuleleri, GSM verici)</text>

  <!-- Zayif sinyal -->
  <rect x="163" y="96" width="555" height="8" fill="#1565c0" rx="2" opacity="0.15"/>
  <text x="445" y="106" text-anchor="middle" font-size="10" fill="#1565c0">Zayif hedef sinyal — yuksek bit derinligi ile kurtarilabilir</text>

  <!-- Bilgi kutulari sagda -->
  <rect x="10" y="70" width="148" height="280" fill="#ffffff" stroke="#9fb3c8" stroke-width="1" rx="2"/>
  <text x="84" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2b40">Neden Onemli</text>
  <line x1="10" y1="94" x2="158" y2="94" stroke="#d3dde8" stroke-width="1"/>
  <text x="18" y="111" font-size="10" fill="#c0392b" font-weight="bold">8-bit:</text>
  <text x="18" y="124" font-size="10" fill="#4a5a70">Guclu komsu</text>
  <text x="18" y="137" font-size="10" fill="#4a5a70">sinyal ADC'yi</text>
  <text x="18" y="150" font-size="10" fill="#4a5a70">doldurur, zayif</text>
  <text x="18" y="163" font-size="10" fill="#4a5a70">sinyal batar</text>
  <line x1="10" y1="172" x2="158" y2="172" stroke="#d3dde8" stroke-width="1"/>
  <text x="18" y="189" font-size="10" fill="#1a8a3a" font-weight="bold">16-bit:</text>
  <text x="18" y="202" font-size="10" fill="#4a5a70">Ayni anda guclu</text>
  <text x="18" y="215" font-size="10" fill="#4a5a70">FM + cok zayif</text>
  <text x="18" y="228" font-size="10" fill="#4a5a70">uydu sinyali</text>
  <text x="18" y="241" font-size="10" fill="#4a5a70">birlikte gorunur</text>
  <line x1="10" y1="252" x2="158" y2="252" stroke="#d3dde8" stroke-width="1"/>
  <text x="18" y="269" font-size="10" fill="#5a6b80">Her bit:</text>
  <text x="18" y="282" font-size="10" fill="#1565c0" font-weight="bold">+~6 dB</text>
  <text x="18" y="295" font-size="10" fill="#5a6b80">dinamik aralik</text>
  <text x="18" y="308" font-size="10" fill="#5a6b80">8→16: +48 dB</text>
  <text x="18" y="321" font-size="10" fill="#5a6b80">yani 256 kat</text>
  <text x="18" y="334" font-size="10" fill="#5a6b80">daha genis</text>

  <!-- Alt not -->
  <rect x="10" y="400" width="740" height="16" fill="none"/>
  <text x="380" y="412" text-anchor="middle" font-size="10.5" fill="#4a5a70">Bant genisligi "ne kadar genis gorursun" — bit derinligi "ne kadar temiz / zayif sinyali gorer" — ikisi farkli karar kriteridir</text>
</svg>
